          </p>
          <button
            type="button"
            class="btn btn-primary btn-lg btn-block"
            id="setup-error-goto-login-btn"
          >
            <span>Go to Main Login Page</span>
            ${ICONS.arrowRight}
          </button>
        </div>
      `;
      const loginBtn = cardRoot.querySelector('#setup-error-goto-login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          selectedRole = 'staff';
          Router.navigate('login');
        });
      }
      return;
    }

    const staff = verification.staff;
    const lockedEmail = verification.email;

    function renderSetupForm(newPassVal = '', confirmPassVal = '', errorMsg = '') {
      const check = validateStaffSetupPassword(newPassVal);

      cardRoot.innerHTML = `
        <div>
          <span class="staff-setup-brand-badge">
            ${ICONS.shieldCheck}
            <span>Approved Staff Setup</span>
          </span>
          <h1 class="page-title" style="font-size:1.5rem; margin-bottom:4px;">Create Your Account</h1>
          <p class="page-subtitle" style="margin-bottom:16px;">
            Your account has been approved. Set your password to get started.
          </p>

          <form id="staff-account-setup-form" novalidate>
            <!-- Locked / Read-Only Email Address (Step 3 & Step 4) -->
            <div class="form-group">
              <label class="form-label" for="setup-locked-email">Email Address</label>
              <div class="staff-setup-email-locked" title="Invitation email cannot be changed">
                <span style="display:inline-flex; align-items:center; gap:8px; min-width:0; overflow:hidden;">
                  <span style="color:var(--color-primary); display:inline-flex;">${ICONS.mail}</span>
                  <span id="setup-locked-email-text" style="overflow:hidden; text-overflow:ellipsis;">${escapeHtml(lockedEmail)}</span>
                </span>
                <span style="color:var(--color-muted); display:inline-flex;" title="Locked to invited email">${ICONS.lock}</span>
              </div>
              <input
                type="email"
                id="setup-locked-email"
                value="${escapeHtml(lockedEmail)}"
                readonly
                disabled
                hidden
              />
            </div>

            <!-- New Password -->
            <div class="form-group">
              <label class="form-label" for="setup-new-password">New Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <span class="input-icon-left">${ICONS.lock}</span>
                <input
                  type="${showNewPass ? 'text' : 'password'}"
                  id="setup-new-password"
                  class="form-input with-left-icon with-right-icon"
                  placeholder="Enter your password"
                  value="${escapeHtml(newPassVal)}"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="input-icon-right"
                  id="toggle-setup-new-pass"
                  aria-label="${showNewPass ? 'Hide password' : 'Show password'}"
                >
                  ${showNewPass ? ICONS.eyeOff : ICONS.eye}
                </button>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label class="form-label" for="setup-confirm-password">Confirm Password <span class="required">*</span></label>
              <div class="input-wrapper">
                <span class="input-icon-left">${ICONS.lock}</span>
                <input
                  type="${showConfirmPass ? 'text' : 'password'}"
                  id="setup-confirm-password"
                  class="form-input with-left-icon with-right-icon"
                  placeholder="Re-enter your password"
                  value="${escapeHtml(confirmPassVal)}"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="input-icon-right"
                  id="toggle-setup-confirm-pass"
                  aria-label="${showConfirmPass ? 'Hide password' : 'Show password'}"
                >
                  ${showConfirmPass ? ICONS.eyeOff : ICONS.eye}
                </button>
              </div>
            </div>

            <!-- Live Password Requirements Indicator -->
            <div class="staff-setup-req-list" id="setup-password-requirements">
              <div class="staff-setup-req-item ${check.minLength ? 'met' : ''}" id="req-min-len">
                ${check.minLength ? ICONS.checkCircle : ICONS.clock}
                <span>At least 8 characters long</span>
              </div>
              <div class="staff-setup-req-item ${check.hasLetter && check.hasNumber ? 'met' : ''}" id="req-alphanum">
                ${check.hasLetter && check.hasNumber ? ICONS.checkCircle : ICONS.clock}
                <span>Contains both letters and numbers</span>
              </div>
            </div>

            <div
              id="setup-password-error"
              class="form-error-msg"
              style="margin-bottom:12px;"
              ${errorMsg ? '' : 'hidden'}
            >${escapeHtml(errorMsg)}</div>

            <button
              type="submit"
              class="btn btn-primary btn-lg btn-block"
              id="setup-create-account-btn"
              ${isSubmitting ? 'disabled' : ''}
            >
              ${ICONS.shieldCheck}
              <span id="setup-create-account-btn-text">${isSubmitting ? 'Creating Account...' : 'Create Account'}</span>
            </button>
          </form>
        </div>
      `;

      const formEl = cardRoot.querySelector('#staff-account-setup-form');
      const newPassInput = cardRoot.querySelector('#setup-new-password');
      const confirmPassInput = cardRoot.querySelector('#setup-confirm-password');
      const errBox = cardRoot.querySelector('#setup-password-error');
      const submitBtn = cardRoot.querySelector('#setup-create-account-btn');
      const submitBtnText = cardRoot.querySelector('#setup-create-account-btn-text');

      function updateRequirementVisuals() {
        const c = validateStaffSetupPassword(newPassInput.value);
        const minLenEl = cardRoot.querySelector('#req-min-len');
        const alphaEl = cardRoot.querySelector('#req-alphanum');
        if (minLenEl) {
          minLenEl.className = `staff-setup-req-item ${c.minLength ? 'met' : ''}`;
          minLenEl.innerHTML = `${c.minLength ? ICONS.checkCircle : ICONS.clock}<span>At least 8 characters long</span>`;
        }
        if (alphaEl) {
          alphaEl.className = `staff-setup-req-item ${c.hasLetter && c.hasNumber ? 'met' : ''}`;
          alphaEl.innerHTML = `${c.hasLetter && c.hasNumber ? ICONS.checkCircle : ICONS.clock}<span>Contains both letters and numbers</span>`;
        }
        errBox.hidden = true;
      }

      newPassInput.addEventListener('input', updateRequirementVisuals);
      confirmPassInput.addEventListener('input', () => {
        errBox.hidden = true;
      });

      cardRoot.querySelector('#toggle-setup-new-pass').addEventListener('click', () => {
        showNewPass = !showNewPass;
        renderSetupForm(newPassInput.value, confirmPassInput.value, errBox.hidden ? '' : errBox.textContent);
      });

      cardRoot.querySelector('#toggle-setup-confirm-pass').addEventListener('click', () => {
        showConfirmPass = !showConfirmPass;
        renderSetupForm(newPassInput.value, confirmPassInput.value, errBox.hidden ? '' : errBox.textContent);
      });

      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting) return;

        const p1 = newPassInput.value;
        const p2 = confirmPassInput.value;
        const validation = validateStaffSetupPassword(p1);

        if (!validation.valid) {
          errBox.textContent = 'Password is too weak. Please enter at least 8 characters including both letters and numbers.';
          errBox.hidden = false;
          return;
        }

        if (p1 !== p2) {
          errBox.textContent = 'Passwords do not match. Please re-enter the exact same password in both fields.';
          errBox.hidden = false;
          return;
        }

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtnText.textContent = 'Creating Account...';
        errBox.hidden = true;

        const saveResult = await SupabaseService.completeStaffPasswordSetup(staff, p1);
        if (!saveResult.ok) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtnText.textContent = 'Create Account';
          errBox.textContent = saveResult.error || 'Could not save password. Please try again.';
          errBox.hidden = false;
          return;
        }

        // Step 6: Show success message and automatically redirect to the existing Main Login page
        const successMsg =
          'Your GarageFlow account is now active. Please sign in using your registered email address and newly created password.';
        postSetupSuccessMessage = successMsg;
        selectedRole = 'staff';
        draftEmail = lockedEmail;
        draftPassword = '';

        showToast('Account Created Successfully! Please sign in.', 'success');

        // Clean URL query/hash if needed so refresh stays clean
        if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
          try {
            window.history.replaceState({}, document.title, window.location.pathname);
          } catch (histErr) {
            // Ignore history state restrictions in sandboxed iframes
          }
        }

        // Automatically navigate to the existing main Login page without bypassing authentication
        Router.navigate('login');
      });
    }

    renderSetupForm();
  });
}

      `;

      const closeBtn = backdrop.querySelector('#sa-sheet-close-btn');
      if (closeBtn) closeBtn.addEventListener('click', closeSheet);

      if (isEditing) {
        const cancelBtn = backdrop.querySelector('#sa-sheet-cancel-edit-btn');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            isEditing = false;
            renderSheetContent();
          });
        }
        const editForm = backdrop.querySelector('#sa-sheet-edit-form');
        if (editForm) {
          editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = backdrop.querySelector('#sa-sheet-edit-error');
            const saveBtn = backdrop.querySelector('#sa-sheet-save-edit-btn');
            if (errEl) errEl.hidden = true;
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            const res = await SuperadminService.updateGarageOwner(currentOwner.id, {
              ownerName: backdrop.querySelector('#sa-edit-owner-name').value,
              garageName: backdrop.querySelector('#sa-edit-garage-name').value
            });
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
            if (!res.ok) {
              if (errEl) {
                errEl.textContent = res.error || 'Could not save changes.';
                errEl.hidden = false;
              }
              return;
            }
            currentOwner = { ...currentOwner, ...(res.owner || {}) };
            isEditing = false;
            showToast('Owner details updated.', 'success');
            renderSheetContent();
            loadOwnersList();
          });
        }
        return;
      }

      // 1. Edit Owner Details
      const editBtn = backdrop.querySelector('#sa-edit-owner-btn');
      if (editBtn) {
        editBtn.addEventListener('click', () => {
          isEditing = true;
          renderSheetContent();
        });
      }

      // 2. Resend Account Setup Email
      const resendBtn = backdrop.querySelector('#sa-resend-owner-email-btn');
      if (resendBtn) {
        resendBtn.addEventListener('click', async () => {
          resendBtn.disabled = true;
          resendBtn.textContent = 'Sending Setup Email...';
          const res = await SuperadminService.resendOwnerSetupEmail(currentOwner);
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend Account Setup Email';
          if (res.ok) {
            showToast(`Setup email sent to ${currentOwner.owner_email}`, 'success');
            closeSheet();
          } else {
            showToast(res.error || 'Could not send setup email.', 'warning');
          }
        });
      }

      // 3. Deactivate / Activate Owner
      const deactivateBtn = backdrop.querySelector('#sa-deactivate-owner-btn');
      if (deactivateBtn) {
        deactivateBtn.addEventListener('click', async () => {
          const nextStatus = currentOwner.status === 'Suspended' ? 'Active' : 'Suspended';
          deactivateBtn.disabled = true;
          deactivateBtn.textContent = nextStatus === 'Suspended' ? 'Deactivating...' : 'Activating...';
          const res = await SuperadminService.setGarageOwnerStatus(currentOwner.id, nextStatus);
          deactivateBtn.disabled = false;
          if (!res.ok) {
            deactivateBtn.textContent = currentOwner.status === 'Suspended' ? 'Activate Owner' : 'Deactivate Owner';
            showToast(res.error || 'Could not update owner status.', 'warning');
            return;
          }
          currentOwner = { ...currentOwner, ...(res.owner || { status: nextStatus }) };
          showToast(
            nextStatus === 'Suspended'
              ? `${currentOwner.owner_name} has been deactivated.`
              : `${currentOwner.owner_name} has been activated.`,
            nextStatus === 'Suspended' ? 'warning' : 'success'
          );
          renderSheetContent();
          loadOwnersList();
        });
      }
    }

    document.body.appendChild(backdrop);
    renderSheetContent();
  }

  async function loadOwnersList() {
    if (!listContainer) return;
    const res = await SuperadminService.fetchGarageOwners();
    if (!document.body.contains(listContainer)) return;

    if (!res.ok) {
      listContainer.innerHTML = `
        <div class="sa-empty-state">
          <div style="font-weight:700; color:#102653; margin-bottom:4px;">${res.migrationRequired ? 'Database Table Setup Required' : 'Unable to Load Owners'}</div>
          <div>${escapeHtml(res.error || 'Verify Supabase connection and permissions.')}</div>
        </div>
      `;
      return;
    }

    if (!res.owners.length) {
      listContainer.innerHTML = `
        <div class="sa-empty-state">
          No registered garage owners yet. Use the <strong>Add Garage Owner</strong> form above to create your first owner account.
        </div>
      `;
      return;
    }

    listContainer.innerHTML = res.owners
      .map((owner, idx) => {
        const initials = getInitials(owner.owner_name || 'GO');
        const statusText = owner.status || 'Setup Pending';
        const pillClass = statusText === 'Active' ? 'active' : 'pending';
        return `
          <button type="button" class="sa-owner-row" data-sa-owner-idx="${idx}">
            <div class="sa-owner-left">
              <span class="sa-owner-avatar">${escapeHtml(initials)}</span>
              <div class="sa-owner-meta">
                <div class="sa-owner-name">${escapeHtml(owner.owner_name || '')}</div>
                <div class="sa-owner-garage">${escapeHtml(owner.garage_name || '')}</div>
                <div class="sa-owner-email">${escapeHtml(owner.owner_email || '')}</div>
              </div>
            </div>
            <div class="sa-owner-right">
              <span class="sa-status-pill ${pillClass}">
                <span class="sa-status-dot"></span>
                <span>${escapeHtml(statusText)}</span>
              </span>
              <span class="sa-chevron">${ICONS.chevronRight}</span>
            </div>
          </button>
        `;
      })
      .join('');

    listContainer.querySelectorAll('[data-sa-owner-idx]').forEach((rowBtn) => {
      rowBtn.addEventListener('click', () => {
        const idx = Number(rowBtn.getAttribute('data-sa-owner-idx'));
        if (res.owners[idx]) openOwnerDetailModal(res.owners[idx]);
      });
    });
  }

  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldErrors();
      if (feedbackBox) feedbackBox.hidden = true;

      if (createBtn) {
        createBtn.disabled = true;
        createBtn.querySelector('span').textContent = 'Creating Owner Account...';
      }

      const result = await SuperadminService.createGarageOwner({
        ownerName: ownerNameInput.value,
        garageName: garageNameInput.value,
        ownerEmail: ownerEmailInput.value
      });

      if (createBtn) {
        createBtn.disabled = false;
        createBtn.querySelector('span').textContent = 'Create Owner Account';
      }

      if (!result.ok) {
        if (result.field === 'ownerName' && ownerNameErr) {
          ownerNameErr.textContent = result.error;
          ownerNameErr.hidden = false;
        } else if (result.field === 'garageName' && garageNameErr) {
          garageNameErr.textContent = result.error;
          garageNameErr.hidden = false;
        } else if (result.field === 'ownerEmail' && ownerEmailErr) {
          ownerEmailErr.textContent = result.error;
          ownerEmailErr.hidden = false;
        } else {
          showFeedback('warning', result.error || 'Unable to create owner account.');
        }
        return;
      }

      ownerNameInput.value = '';
      garageNameInput.value = '';
      ownerEmailInput.value = '';
      showFeedback(
        result.emailSent ? 'success' : 'info',
        result.emailNote || 'Owner account created. Owner will receive an email to set up their account.'
      );
      showToast('Garage Owner account created.');
      await loadOwnersList();
    });
  }

  loadOwnersList();
}

function renderSuperadminConnectivityPage(container) {
  container.innerHTML = `

        </div>
      </header>

      <section class="sa-card">
        <div class="sa-card-head">
          <span class="sa-card-head-icon">${ICONS.database}</span>
          <div>
            <h2 class="sa-card-title" style="font-size:1.1rem;">Live Gateway Diagnostics</h2>
            <p class="sa-card-desc">Tests PostgREST reachability and table access without exposing API keys or secrets.</p>
          </div>
        </div>

        <button type="button" id="sa-run-supabase-test-btn" class="sa-submit-btn">
          <span>Run Supabase Connectivity Check</span>
        </button>

        <div
          id="sa-supabase-test-results"
          style="margin-top:16px; padding:14px; border-radius:14px; background:#F6F9FF; border:1px solid #D9E5F7; font-size:0.82rem; line-height:1.6;"
          hidden
        ></div>
      </section>
    </div>
  `;

  container.querySelector('#sa-conn-back-btn').addEventListener('click', () => {
    Router.navigate('superadmin-settings');
  });

  const testBtn = container.querySelector('#sa-run-supabase-test-btn');
  const resultsBox = container.querySelector('#sa-supabase-test-results');
  let isRunning = false;

  testBtn.addEventListener('click', async () => {
    if (isRunning) return;
    isRunning = true;
    testBtn.disabled = true;
    testBtn.querySelector('span').textContent = 'Testing Connection...';
    resultsBox.hidden = false;
    resultsBox.innerHTML = `<div style="color:#71809E; font-weight:600;">Running live Supabase connectivity test...</div>`;

    try {
      const res = await window.GarageFlow.verifySupabaseConnection();
      const connStatus = res.projectReachable ? 'Connected (Project Reachable)' : 'Unreachable';
      const keyStatus = res.apiKeyAccepted ? 'Accepted (true)' : 'Rejected / Not Accepted (false)';
      const outcome = res.postgrestOutcome || 'unknown';
      const httpCode = res.httpStatus !== null && res.httpStatus !== undefined ? String(res.httpStatus) : 'None';
      const errCode = res.errorCode || 'None';
      const errMsg = res.details || 'None';

      resultsBox.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:6px; color:#102653;">
          <div><strong>1. Supabase Connection Status:</strong> <span id="sa-diag-conn">${escapeHtml(connStatus)}</span></div>
          <div><strong>2. API Key Accepted Status:</strong> <span id="sa-diag-key">${escapeHtml(keyStatus)}</span></div>
          <div><strong>3. PostgREST Outcome:</strong> <span id="sa-diag-outcome" style="font-weight:700; color:#1769EE;">${escapeHtml(outcome)}</span></div>
          <div><strong>4. HTTP Status Code:</strong> <span id="sa-diag-http">${escapeHtml(httpCode)}</span></div>
          <div><strong>5. Error Code:</strong> <span id="sa-diag-errcode">${escapeHtml(errCode)}</span></div>
          <div><strong>6. Details:</strong> <span id="sa-diag-msg">${escapeHtml(errMsg)}</span></div>
        </div>
      `;
      showToast(`Connectivity test completed: ${outcome}`, res.apiKeyAccepted ? 'success' : 'warning');
    } catch (err) {
      resultsBox.innerHTML = `<div style="color:#DC3545;">Connectivity check failed: ${escapeHtml(err && err.message ? err.message : 'Unknown error')}</div>`;
    } finally {
      isRunning = false;
      testBtn.disabled = false;
      testBtn.querySelector('span').textContent = 'Run Supabase Connectivity Check';
    }
  });
}

function mountShell(pageRenderFn, params) {
  if (AppState.currentRoute === 'staff-account-setup' || AppState.currentRoute === 'owner-account-setup') {
    appRoot.className = 'app-shell';
    appRoot.innerHTML = `<main class="app-main" id="screen-outlet" style="padding-bottom:32px;"></main>`;
    const outlet = document.getElementById('screen-outlet');
    pageRenderFn(outlet, params);
    return;
  }

  if (!AppState.user || AppState.currentRoute === 'login') {
    appRoot.className = 'app-shell auth-layout';
    appRoot.innerHTML = `<main id="screen-outlet"></main>`;
    const outlet = document.getElementById('screen-outlet');
    renderLoginPage(outlet);
    return;
  }

  // Superadmin screens: NO bottom navigation and NO garage sidebar
  if (SUPERADMIN_ROUTES.includes(AppState.currentRoute) && AppState.user.role === 'superadmin') {
    appRoot.className = 'app-shell';
    appRoot.innerHTML = `<main class="app-main sa-app-main" id="screen-outlet"></main>`;
    const outlet = document.getElementById('screen-outlet');
    pageRenderFn(outlet, params);
    return;
  }

  appRoot.className = 'app-shell';
  appRoot.innerHTML = `
    ${renderSidebar(AppState.currentRoute)}
    <main class="app-main" id="screen-outlet"></main>
    ${renderBottomNav(AppState.currentRoute)}
  `;

  const outlet = document.getElementById('screen-outlet');
  pageRenderFn(outlet, params);
}

// ==========================================================================
// GarageFlow — Garage Owner First-Time Password Setup & Activation Screen
// Opened automatically when a newly invited Garage Owner clicks their Gmail
// confirmation link (?setup_owner=1).
// ==========================================================================
function renderOwnerAccountSetupPage(container) {
  container.innerHTML = `
    <div class="sa-page-container" id="owner-account-setup-screen" style="padding-top:28px;">
      <section class="sa-card">
        <div class="sa-card-head">
          <span class="sa-card-head-icon">${ICONS.shieldCheck}</span>
          <div>
            <div class="sa-eyebrow" style="margin-bottom:2px;">GARAGEFLOW OWNER ONBOARDING</div>
            <h1 class="sa-card-title" style="font-size:1.35rem;">Set Up Your Owner Account</h1>
            <p class="sa-card-desc">Create your password to activate your GarageFlow Admin workspace.</p>
          </div>
        </div>

        <div id="owner-setup-status-banner" class="sa-status-banner info">
          Verifying your email invitation link with Supabase...
        </div>

        <form id="owner-setup-form" novalidate hidden>
          <div class="sa-field-group">
            <label class="sa-field-label" for="owner-setup-email">Verified Owner Gmail</label>
            <div class="sa-input-wrap">
              <span class="sa-input-icon">${ICONS.mail}</span>
              <input
                type="email"
                id="owner-setup-email"
                class="sa-input"
                readonly
                style="background:#EEF4FF; color:#102653; font-weight:700;"
              />
            </div>
          </div>

          <div class="sa-field-group">
            <label class="sa-field-label" for="owner-setup-password">Create Password</label>
            <div class="sa-input-wrap">
              <span class="sa-input-icon">${ICONS.lock}</span>
              <input
                type="password"
                id="owner-setup-password"
                class="sa-input"
                style="padding-right:44px;"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                required
              />
              <button type="button" class="input-icon-right" id="owner-setup-toggle-pass" aria-label="Show password">
                ${ICONS.eye}
              </button>
            </div>
          </div>

          <div class="sa-field-group">
            <label class="sa-field-label" for="owner-setup-confirm">Confirm Password</label>
            <div class="sa-input-wrap">
              <span class="sa-input-icon">${ICONS.lock}</span>
              <input
                type="password"
                id="owner-setup-confirm"
                class="sa-input"
                style="padding-right:44px;"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
              />
              <button type="button" class="input-icon-right" id="owner-setup-toggle-confirm" aria-label="Show confirm password">
                ${ICONS.eye}
              </button>
            </div>
          </div>

          <div id="owner-setup-error" class="form-error-msg" style="margin-bottom:10px;" hidden></div>

          <button type="submit" id="owner-setup-submit-btn" class="sa-submit-btn">
            <span>Activate Owner Account</span>
          </button>
        </form>

        <div style="text-align:center; margin-top:16px;">
          <button type="button" id="owner-setup-back-login-btn" class="login-forgot-link">
            Return to GarageFlow Login
          </button>
        </div>
      </section>
    </div>
  `;

  const banner = container.querySelector('#owner-setup-status-banner');
  const form = container.querySelector('#owner-setup-form');
  const emailField = container.querySelector('#owner-setup-email');
  const passField = container.querySelector('#owner-setup-password');
  const confirmField = container.querySelector('#owner-setup-confirm');
  const errorBox = container.querySelector('#owner-setup-error');
  const submitBtn = container.querySelector('#owner-setup-submit-btn');

  container.querySelector('#owner-setup-back-login-btn').addEventListener('click', () => {
    if (window.history && window.history.replaceState) {
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (e) {}
    }
    selectedRole = 'admin';
    Router.navigate('login');
  });

  function bindEyeToggle(btnId, inputEl) {
    const btn = container.querySelector(btnId);
    if (!btn || !inputEl) return;
    btn.addEventListener('click', () => {
      const showing = inputEl.type === 'text';
      inputEl.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
    });
  }
  bindEyeToggle('#owner-setup-toggle-pass', passField);
  bindEyeToggle('#owner-setup-toggle-confirm', confirmField);

  async function initOwnerSetupSession() {
    const client = SuperadminService.getActiveClient();
    if (!client || !client.auth) {
      banner.className = 'sa-status-banner danger';
      banner.textContent = 'Supabase client is unavailable. Please open this link from a live internet connection.';
      return;
    }

    try {
      // Handle PKCE ?code=... if Supabase redirected using PKCE flow
      const params = new URLSearchParams(window.location.search || '');
      const authCode = params.get('code');
      if (authCode && typeof client.auth.exchangeCodeForSession === 'function') {
        await client.auth.exchangeCodeForSession(authCode);
      }

      // Check active session established by the confirmation link
      let { data: sessionData } = await client.auth.getSession();
      if (!sessionData || !sessionData.session) {
        // Brief wait for detectSessionInUrl hash parsing on slow mobile browsers
        await new Promise((r) => setTimeout(r, 450));
        const retry = await client.auth.getSession();
        sessionData = retry.data;
      }

      const activeUser = sessionData && sessionData.session ? sessionData.session.user : null;
      if (!activeUser || !activeUser.email) {
        banner.className = 'sa-status-banner warning';
        banner.textContent = 'This setup link has expired or was already used. Ask Superadmin to resend your account setup email.';
        return;
      }

      emailField.value = activeUser.email;
      banner.className = 'sa-status-banner success';
      banner.textContent = 'Email verified! Choose a strong password below to activate your Garage Owner account.';
      form.hidden = false;
    } catch (err) {
      banner.className = 'sa-status-banner danger';
      banner.textContent = `Could not verify setup link: ${err && err.message ? err.message : 'Invalid or expired token.'}`;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.hidden = true;
    errorBox.textContent = '';

    const p1 = String(passField.value || '').trim();
    const p2 = String(confirmField.value || '').trim();

    if (p1.length < 8) {
      errorBox.textContent = 'Password must be at least 8 characters long.';
      errorBox.hidden = false;
      return;
    }
    if (p1 !== p2) {
      errorBox.textContent = 'Passwords do not match. Please re-enter them.';
      errorBox.hidden = false;
      return;
    }

    const client = SuperadminService.getActiveClient();
    submitBtn.disabled = true;
    submitBtn.querySelector('span').textContent = 'Activating Account...';

    try {
      // 1. Set owner's password securely in Supabase Auth
      const { error: updateErr } = await client.auth.updateUser({ password: p1 });
      if (updateErr) {
        throw new Error(updateErr.message || 'Unable to set password.');
      }

      // 2. Link auth_user_id & flip garage_owner_accounts.status -> 'Active'
      const { error: rpcErr } = await client.rpc('complete_garage_owner_setup');
      if (rpcErr) {
        throw new Error(
          rpcErr.code === 'PGRST202'
            ? 'Password was saved, but RPC "complete_garage_owner_setup" is missing. Please ask Superadmin to run GarageFlow_Owner_Activation_Migration.sql.'
            : rpcErr.message || 'Could not activate owner account record.'
        );
      }

      // 3. Sign out setup session cleanly so owner logs in explicitly via Admin Login
      await client.auth.signOut().catch(() => {});

      if (window.history && window.history.replaceState) {
        try {
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch (histErr) {}
      }

      selectedRole = 'admin';
      draftEmail = emailField.value;
      draftPassword = '';
      postSetupSuccessMessage = 'Your Garage Owner account is now Active! Sign in below under OWNER with your new password.';
      showToast('Garage Owner account activated!', 'success');
      Router.navigate('login');
    } catch (err) {
      errorBox.textContent = err && err.message ? err.message : 'Account activation failed.';
      errorBox.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.querySelector('span').textContent = 'Activate Owner Account';
    }
  });

  initOwnerSetupSession();
}

// Global Event Delegation for Navigation & Header Actions
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    const targetRoute = navBtn.getAttribute('data-nav');
    Router.navigate(targetRoute);
    return;
  }

  const actionBtn = e.target.closest('[data-action]');
  if (!actionBtn) return;

  const action = actionBtn.getAttribute('data-action');

  if (action === 'open-settings') {
    // Section 5: Settings icon opens Superadmin Settings for Superadmin, Admin Settings for Admin, Logout for Staff
    if (AppState.user && AppState.user.role === 'superadmin') {
      Router.navigate('superadmin-settings');
    } else if (AppState.user && AppState.user.role === 'staff') {
      Modal.openLogoutConfirmation(() => {
        AppState.logout();
        showToast('Signed out of your staff workspace.');
        Router.navigate('login');
      });
    } else {
      Router.navigate('settings');
    }
  } else if (action === 'logout') {
    Modal.openLogoutConfirmation(() => {
      AppState.logout();
      showToast('Signed out of your garage account.');
      Router.navigate('login');
    });
  } else if (action === 'open-notifications') {
    const receivedJobs = AppState.data.jobs.filter((j) => j.status === 'Received');
    Modal.open({
      title: 'Workshop Notifications',
      bodyHtml: `
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${
            receivedJobs.length === 0
              ? `<p style="font-size:var(--text-sm); color:var(--color-muted);">All vehicles have been inspected.</p>`
              : receivedJobs
                  .map(
                    (job) => `
                  <div
                    style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--color-surface-blue); border-radius:12px; cursor:pointer;"
                    data-notif-customer="${job.customerId}"
                  >
                    <div>
                      <div style="font-weight:700; font-size:13px;">${escapeHtml(job.id)} · ${escapeHtml(job.vehicleNumber)}</div>
                      <div style="font-size:12px; color:var(--color-muted);">${escapeHtml(job.customerName)} — ${escapeHtml(job.complaint)}</div>
                    </div>
                    ${renderStatusBadge(job.status)}
                  </div>
                `
                  )
                  .join('')
          }
        </div>
      `,
      onMount(modalEl) {
        modalEl.querySelectorAll('[data-notif-customer]').forEach((item) => {
          item.addEventListener('click', () => {
            const customerId = item.getAttribute('data-notif-customer');
            Modal.close();
            Router.navigate('customer-profile', { customerId });
          });
        });
      }
    });
  } else if (action === 'open-calendar-modal') {
    openDashboardCalendarModal();
  } else if (action === 'open-workshop-info') {
    const bp = AppState.data.businessProfile;
    Modal.open({
      title: 'Workshop Calendar & Summary',
      bodyHtml: `
        <div class="card-subtle" style="font-size:13px; display:flex; flex-direction:column; gap:6px;">
          <div><strong>Garage:</strong> ${escapeHtml(bp.displayName || bp.garageName)}</div>
          <div><strong>Address:</strong> ${escapeHtml(bp.address)}</div>
          <div><strong>Hours:</strong> ${escapeHtml(bp.businessHours)} (${escapeHtml(bp.workingDays)})</div>
          <div><strong>Active Date:</strong> ${escapeHtml(bp.currentDateLabel)}</div>
        </div>
      `
    });
  }
});

// Initialize Application immediately or on DOMContentLoaded
function detectAndRouteInvitationLinkOnStartup() {
  if (typeof window === 'undefined') {
    Router.renderCurrent();
    return;
  }
  const searchParams = new URLSearchParams(window.location.search || '');
  const hashStr = window.location.hash || '';
  const isOwnerSetupCallback =
    searchParams.get('setup_owner') === '1' ||
    hashStr.includes('owner-account-setup') ||
    (Boolean(searchParams.get('code')) && searchParams.get('setup_staff') !== '1') ||
    (hashStr.includes('access_token=') && hashStr.includes('type=magiclink') && searchParams.get('setup_staff') !== '1') ||
    (hashStr.includes('access_token=') && hashStr.includes('type=signup') && searchParams.get('setup_staff') !== '1');

  if (isOwnerSetupCallback) {
    Router.navigate('owner-account-setup');
    return;
  }

  const isInviteCallback =
    searchParams.get('setup_staff') === '1' ||
    searchParams.get('type') === 'invite' ||
    searchParams.get('type') === 'recovery' ||
    Boolean(searchParams.get('token_hash')) ||
    hashStr.includes('staff-account-setup') ||
    hashStr.includes('type=invite') ||
    hashStr.includes('type=recovery');

  if (isInviteCallback) {
    Router.navigate('staff-account-setup', {
      email: searchParams.get('email') || '',
      staffId: searchParams.get('staff_id') || '',
      inviteToken: searchParams.get('invite_token') || ''
    });
    return;
  }
  Router.renderCurrent();
}
