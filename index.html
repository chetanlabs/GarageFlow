              ${ICONS.checkCircle} Payment Status: Paid
            </span>
          </div>
        </div>

        <!-- Confirm & Cancel Buttons -->
        <button
          type="submit"
          class="btn btn-primary btn-lg btn-block"
          id="confirm-payment-submit-btn"
          style="margin-bottom:10px;"
        >
          ${ICONS.check}
          <span id="confirm-payment-btn-text">Confirm Payment · ${formatCurrency(enteredAmount)}</span>
        </button>

        <div style="text-align:center;">
          <button
            type="button"
            data-modal-close
            style="font-size:var(--text-sm); font-weight:700; color:var(--color-text-secondary); padding:6px 16px;"
          >
            Cancel
          </button>
        </div>
      </form>

    onMount(modalEl) {
      const amountInput = modalEl.querySelector('#payment-amount-input');
      const amountError = modalEl.querySelector('#payment-amount-error');
      const fullBalanceBtn = modalEl.querySelector('#pay-full-balance-btn');
      const previewReceived = modalEl.querySelector('#preview-payment-received');
      const previewRemaining = modalEl.querySelector('#preview-remaining-balance');
      const previewStatusPill = modalEl.querySelector('#preview-status-pill');
      const previewBox = modalEl.querySelector('#live-balance-preview-box');
      const confirmBtn = modalEl.querySelector('#confirm-payment-submit-btn');
      const confirmBtnText = modalEl.querySelector('#confirm-payment-btn-text');

      function updateLiveCalculation() {
        const val = Number(amountInput.value);
        amountError.hidden = true;
        amountInput.classList.remove('input-error');

        if (isNaN(val) || val <= 0) {
          amountError.textContent = 'Enter a payment amount greater than ₹0.';
          amountError.hidden = false;
          amountInput.classList.add('input-error');
          previewReceived.textContent = '₹0';
          previewRemaining.textContent = formatCurrency(summary.balance);
          confirmBtn.disabled = true;
          confirmBtnText.textContent = 'Confirm Payment';
          return;
        }

        if (val > summary.balance) {
          amountError.textContent = `Amount cannot exceed the balance due (${formatCurrency(summary.balance)}).`;
          amountError.hidden = false;
          amountInput.classList.add('input-error');
          previewReceived.textContent = formatCurrency(val);
          previewRemaining.textContent = 'Exceeds Balance';
          confirmBtn.disabled = true;
          return;
        }

        confirmBtn.disabled = false;
        const remaining = Math.max(0, summary.balance - val);
        previewReceived.textContent = formatCurrency(val);
        previewRemaining.textContent = formatCurrency(remaining);
        confirmBtnText.textContent = `Confirm Payment · ${formatCurrency(val)}`;

        if (remaining === 0) {
          previewBox.style.background = 'var(--color-success-light)';
          previewBox.style.borderColor = 'var(--color-success-border)';
          previewRemaining.style.color = 'var(--color-success)';
          previewStatusPill.innerHTML = `<span class="status-badge badge-paid">${ICONS.checkCircle} Payment Status: Paid</span>`;
        } else {
          previewBox.style.background = 'var(--color-warning-light)';
          previewBox.style.borderColor = 'var(--color-warning-border)';
          previewRemaining.style.color = 'var(--color-warning)';
          previewStatusPill.innerHTML = `<span class="status-badge badge-partial">${ICONS.clock} Payment Status: Partially Paid</span>`;
        }
      }

      amountInput.addEventListener('input', updateLiveCalculation);

      fullBalanceBtn.addEventListener('click', () => {
        amountInput.value = summary.balance;
        updateLiveCalculation();
      });

      modalEl.querySelectorAll('[data-pay-method]').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedMethod = btn.getAttribute('data-pay-method');
          modalEl.querySelectorAll('[data-pay-method]').forEach((b) => {
            b.classList.toggle('selected', b.getAttribute('data-pay-method') === selectedMethod);
          });
        });
      });

      modalEl.querySelector('#record-payment-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const amount = Number(amountInput.value);
        const date = modalEl.querySelector('#payment-date-input').value.trim() || todayPaymentDate;
        const reference = modalEl.querySelector('#payment-ref-input').value.trim();
        const notes = modalEl.querySelector('#payment-notes-input').value.trim();

        const result = AppState.recordPayment(invoice.id, {
          amount,
          method: selectedMethod,
          date,
          reference,
          notes
        });

        if (!result.ok) {
          amountError.textContent = result.error;
          amountError.hidden = false;
          amountInput.classList.add('input-error');
          return;
        }

        Modal.close();
        const updatedSummary = calculateInvoiceSummary(result.invoice);
        showToast('Payment received successfully');

        if (typeof onSuccess === 'function') {
          onSuccess(result);
        }
      });
    }
  });
}

let billDraft = null;

function createDefaultItems() {
  return [];
}

function resolveEditInvoiceDate(existingDateStr) {
  const todayIso = getLocalTodayIso();
  const todayShort = parseSelectedDateMeta(todayIso).formattedShort;
  if (!existingDateStr) return todayShort;
  const raw = String(existingDateStr).trim();
  const monthsMap = {
    jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
    jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
  };
  let parsedIso = null;
  const isoMatch = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (isoMatch) {
    parsedIso = `${isoMatch[1]}-${String(Number(isoMatch[2])).padStart(2, '0')}-${String(Number(isoMatch[3])).padStart(2, '0')}`;
  } else {
    const dmyMatch = raw.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
    if (dmyMatch) {
      const mNum = monthsMap[dmyMatch[2].slice(0, 3).toLowerCase()];
      if (mNum) {
        parsedIso = `${dmyMatch[3]}-${String(mNum).padStart(2, '0')}-${String(Number(dmyMatch[1])).padStart(2, '0')}`;
      }
    }
  }
  if (parsedIso && parsedIso < todayIso) {
    return todayShort;
  }
  return raw;
}

function renderCreateBillPage(container, params = {}) {
  const { customers } = AppState.data;

  // Auto-redirect to Edit Mode if opened for a jobId that already has an invoice
  let effectiveEditId = params.editInvoiceId || '';
  if (!effectiveEditId && params.jobId) {
    const linkedJob = AppState.getJobById(params.jobId);
    const existingForJob = AppState.getInvoiceByJobId(params.jobId, linkedJob && linkedJob.invoiceId);
    if (existingForJob) {
      effectiveEditId = existingForJob.id;
    }
  }
  const editingInvoice = effectiveEditId ? AppState.getInvoiceById(effectiveEditId) : null;
  const isEditMode = Boolean(editingInvoice);

  if (!customers || customers.length === 0) {
    container.innerHTML = `
      <div class="page-container">
        <header class="subpage-header">
          <div class="subpage-header-left">
            <button type="button" class="back-btn" id="create-bill-empty-back-btn" aria-label="Back to Payments">
              ${ICONS.chevronLeft}

          </p>
          <button type="button" class="btn btn-primary btn-pill" id="create-bill-add-first-cust-btn">
            ${ICONS.userPlus}
            <span>Add Customer</span>
          </button>

    container.querySelector('#create-bill-add-first-cust-btn').addEventListener('click', () => Router.navigate('add-customer', { returnTo: 'create-bill' }));
    return;
  }

  if (isEditMode) {
    if (!billDraft || billDraft.editInvoiceId !== editingInvoice.id) {
      const invCustomer = AppState.getCustomerById(editingInvoice.customerId) || customers[0];
      const matchedVehicle =
        (invCustomer.vehicles || []).find((v) => v.regNumber === editingInvoice.vehicleNumber) ||
        (invCustomer.vehicles || [])[0] ||
        null;
      const existingPaidTotal = (editingInvoice.payments || []).reduce(
        (sum, p) => sum + (Number(p.amount) || 0),
        0
      );
      billDraft = {
        editInvoiceId: editingInvoice.id,
        returnTo: params.returnTo || 'bill-details',
        returnCustomerId: params.customerId || editingInvoice.customerId,
        customerId: invCustomer.id,
        vehicleId: matchedVehicle ? matchedVehicle.id : null,
        customInvoiceNumber: editingInvoice.id,
        date: resolveEditInvoiceDate(editingInvoice.date),
        jobId: editingInvoice.jobId || '',
        items: (editingInvoice.items || []).map((it) => ({
          description: it.description || '',

            it.rate !== undefined && it.rate !== null && it.rate !== ''

              : Number(it.amount) || 0

          (editingInvoice.payments && editingInvoice.payments[0] && editingInvoice.payments[0].method) ||
          'Cash'
      };
    }
  } else if (!params._internalRerender || !billDraft || billDraft.editInvoiceId) {
    const initialCustomer = params.customerId
      ? AppState.getCustomerById(params.customerId)
      : customers[0];
    const initialVehicle = initialCustomer && initialCustomer.vehicles ? initialCustomer.vehicles[0] : null;

      editInvoiceId: '',

    const subtotal = billDraft.items.reduce(

    const rawDisc = billDraft.discount === '' || billDraft.discount === null || billDraft.discount === undefined ? '' : String(billDraft.discount).trim();

function syncBillDraftFromDOM(container) {
  if (!billDraft) return;
  const invNoEl = container.querySelector('#bill-inv-no');
  const dateEl = container.querySelector('#bill-inv-date');
  const jobEl = container.querySelector('#bill-job-id');
  if (invNoEl && AppState.data.invoiceSettings && AppState.data.invoiceSettings.autoInvoiceNumber === false) {
    billDraft.customInvoiceNumber = invNoEl.value.trim();
  }
  const discEl = container.querySelector('#bill-discount-input');
  const recEl = container.querySelector('#bill-received-input');
  const methEl = container.querySelector('#bill-method-select');

  if (dateEl) billDraft.date = dateEl.value;
  if (jobEl) billDraft.jobId = jobEl.value;
  if (discEl) billDraft.discount = discEl.value.trim();
  if (recEl) billDraft.amountReceived = recEl.value.trim();
  if (methEl) billDraft.paymentMethod = methEl.value;

  container.querySelectorAll('[data-item-row]').forEach((row) => {
    const idx = Number(row.getAttribute('data-item-row'));
    if (!billDraft.items[idx]) return;
    const rawQty = row.querySelector('.item-qty-input').value.trim();
    const rawRate = row.querySelector('.item-rate-input').value.trim();
    billDraft.items[idx].description = row.querySelector('.item-desc-input').value;
    billDraft.items[idx].qty = rawQty === '' ? '' : Number(rawQty);
    billDraft.items[idx].rate = rawRate === '' ? '' : Number(rawRate);
  });
}

function updateLiveBillTotalsInDOM(container) {
  syncBillDraftFromDOM(container);
  let subtotal = 0;

  container.querySelectorAll('[data-item-row]').forEach((row) => {
    const idx = Number(row.getAttribute('data-item-row'));
    const item = billDraft.items[idx];
    const hasRate =
      item.rate !== '' &&
      item.rate !== null &&
      item.rate !== undefined &&
      !isNaN(Number(item.rate));
    const cell = row.querySelector('.item-amount-cell');
    if (hasRate) {
      const rowAmt = Math.round((Number(item.qty) || 0) * Number(item.rate));
      subtotal += rowAmt;
      if (cell) cell.textContent = formatCurrency(rowAmt);
    } else {
      if (cell) cell.textContent = '';
    }
  });

  const rawDiscStr = billDraft.discount === '' || billDraft.discount === null || billDraft.discount === undefined ? '' : String(billDraft.discount).trim();
  const parsedDisc = rawDiscStr === '' ? 0 : Number(rawDiscStr);
  const discount = isNaN(parsedDisc) || parsedDisc < 0 ? 0 : parsedDisc;
  const grandTotal = Math.max(0, subtotal - discount);
  const isEditDraft = Boolean(billDraft && billDraft.editInvoiceId);
  const rawRecStr = billDraft.amountReceived === '' || billDraft.amountReceived === null || billDraft.amountReceived === undefined ? '' : String(billDraft.amountReceived).trim();
  const parsedRec = rawRecStr === '' ? 0 : Number(rawRecStr);
  const isNegativeRec = !isEditDraft && rawRecStr !== '' && !isNaN(parsedRec) && parsedRec < 0;
  const received = isEditDraft
    ? Number(billDraft.existingPaidAmount) || 0
    : isNaN(parsedRec) || parsedRec < 0
    ? 0
    : parsedRec;
  const pending = grandTotal - received;
  const exceedsGrandTotal = received > grandTotal;

  const subEl = container.querySelector('#summary-subtotal-el');
  const grandEl = container.querySelector('#summary-grand-total-el');
  const pendEl = container.querySelector('#summary-pending-el');
  const pendBanner = container.querySelector('#bill-pending-banner');
  const recInput = container.querySelector('#bill-received-input');
  const recErr = container.querySelector('#bill-received-error');
  const submitBtn = container.querySelector('#generate-bill-submit-btn');

  if (subEl) subEl.textContent = formatCurrency(subtotal);
  if (grandEl) grandEl.textContent = formatCurrency(grandTotal);
  if (pendEl) pendEl.textContent = pending < 0 ? `-${formatCurrency(Math.abs(pending))}` : formatCurrency(pending);
  if (recInput) {
    recInput.setAttribute('max', String(grandTotal));
    recInput.classList.toggle('input-error', exceedsGrandTotal || isNegativeRec);
  }
  if (pendBanner) {
    if (exceedsGrandTotal) {
      pendBanner.style.background = '#FEE2E2';
      pendBanner.style.borderColor = '#FCA5A5';
      pendBanner.style.color = '#DC3545';
    } else if (pending > 0) {
      pendBanner.style.background = 'var(--color-warning-light)';
      pendBanner.style.borderColor = 'var(--color-warning-border)';
      pendBanner.style.color = 'var(--color-warning)';
    } else {
      pendBanner.style.background = 'var(--color-success-light)';
      pendBanner.style.borderColor = 'var(--color-success-border)';
      pendBanner.style.color = 'var(--color-success)';
    }
  }
  if (recErr) {
    if (isNegativeRec) {
      recErr.textContent = 'Amount received cannot be negative.';
      recErr.hidden = false;
    } else if (exceedsGrandTotal) {
      recErr.textContent = isEditDraft
        ? `Revised bill total cannot be lower than the amount already received (${formatCurrency(received)}).`
        : 'Amount received cannot exceed the Grand Total. Please correct the received amount before generating the invoice.';
      recErr.hidden = false;
    } else {
      recErr.textContent = '';
      recErr.hidden = true;
    }
  }
  if (submitBtn) {
    submitBtn.disabled = exceedsGrandTotal;
  }
}

function bindCreateBillEvents(container, params) {
  const goBack = () => {
    const editId = billDraft && billDraft.editInvoiceId;
    const retTo = (billDraft && billDraft.returnTo) || 'payments';
    const retCust = billDraft && billDraft.returnCustomerId;
    billDraft = null;
    if (editId && retTo === 'customer-profile' && retCust) {
      Router.navigate('customer-profile', { customerId: retCust });
    } else if (editId) {
      Router.navigate('bill-details', { invoiceId: editId });
    } else {
      Router.navigate('payments');
    }
  };

  container.querySelector('#create-bill-back-btn').addEventListener('click', goBack);
  container.querySelector('#cancel-create-bill-btn').addEventListener('click', goBack);

  const addCustBtn = container.querySelector('#bill-add-customer-btn');
  if (addCustBtn) {
    addCustBtn.addEventListener('click', () => {
      syncBillDraftFromDOM(container);
      Router.navigate('add-customer', { returnTo: 'create-bill' });
    });
  }

  // Section 16: Clicking Invoice Date inside Bill Details opens interactive Date Picker
  const billDateInput = container.querySelector('#bill-inv-date');
  if (billDateInput) {
    billDateInput.addEventListener('click', () => {
      syncBillDraftFromDOM(container);
      openInvoiceDatePickerModal(billDraft.date, (meta) => {
        billDraft.date = meta.formattedShort;
        billDateInput.value = meta.formattedShort;
      });
    });
  }

  const billCustSelect = container.querySelector('#bill-customer-select');
  if (billCustSelect) {
  billCustSelect.addEventListener('change', (e) => {
    syncBillDraftFromDOM(container);
    const cust = AppState.getCustomerById(e.target.value);
    billDraft.customerId = cust.id;
    billDraft.vehicleId = cust.vehicles[0] ? cust.vehicles[0].id : null;
    billDraft.jobId = cust.currentJobId || '';
    renderCreateBillPage(container, { ...params, customerId: cust.id, _internalRerender: true });
  });
  billCustSelect.addEventListener('mousedown', (e) => {
    e.preventDefault();
    syncBillDraftFromDOM(container);
    SelectionPopup.open({
      title: 'Select Customer',
      searchable: true,
      searchPlaceholder: 'Search by name, number or keyword...',
      selectedValues: [billDraft.customerId],
      items: AppState.data.customers.map((c) => ({
        value: c.id,
        label: c.name,
        sublabel: `${c.phone} • ${c.vehicleNumber}`,
        icon: ICONS.users
      })),
      onConfirm(chosenId) {
        if (chosenId) {
          const cust = AppState.getCustomerById(chosenId);
          billDraft.customerId = cust.id;
          billDraft.vehicleId = cust.vehicles[0] ? cust.vehicles[0].id : null;
          billDraft.jobId = cust.currentJobId || '';
          renderCreateBillPage(container, { ...params, customerId: cust.id, _internalRerender: true });
        }
      }
    });
  });
  }

  const billMethodSelect = container.querySelector('#bill-method-select');
  if (billMethodSelect) {
    billMethodSelect.addEventListener('mousedown', (e) => {
      e.preventDefault();
      syncBillDraftFromDOM(container);
      const methodIcons = {
        Cash: ICONS.cash,
        UPI: ICONS.zap,
        'Bank Transfer': ICONS.bank,
        Other: ICONS.wallet
      };
      SelectionPopup.open({
        title: 'Select Payment Method',
        searchable: false,
        selectedValues: [billDraft.paymentMethod || 'Cash'],
        items: ['Cash', 'UPI', 'Bank Transfer', 'Other'].map((m) => ({
          value: m,
          label: m,
          sublabel: m === 'UPI' ? 'Instant QR / UPI App Transfer' : m === 'Cash' ? 'Cash payment at workshop' : `${m} settlement`,
          icon: methodIcons[m] || ICONS.wallet
        })),
        onConfirm(chosenMethod) {
          if (chosenMethod) {
            billDraft.paymentMethod = chosenMethod;
            billMethodSelect.value = chosenMethod;
          }
        }
      });
    });
  }

  const vehSelect = container.querySelector('#bill-vehicle-select');
  if (vehSelect) {
    vehSelect.addEventListener('change', (e) => {
      syncBillDraftFromDOM(container);
      billDraft.vehicleId = e.target.value;
      renderCreateBillPage(container, { ...params, _internalRerender: true });
    });
  }

  // Live calculation on item qty/rate, discount, or amount received input
  container.querySelectorAll('.item-desc-input, .item-qty-input, .item-rate-input').forEach((inp) => {
    inp.addEventListener('input', () => updateLiveBillTotalsInDOM(container));
  });

  container.querySelector('#bill-discount-input').addEventListener('input', () => {
    updateLiveBillTotalsInDOM(container);
  });

  const recInputElListener = container.querySelector('#bill-received-input');
  if (recInputElListener) {
    recInputElListener.addEventListener('input', () => {
      updateLiveBillTotalsInDOM(container);
    });
  }

  // Part 4 (Item 5): Add Item with Empty Default Values (Description: '', Qty: 1, Rate: '', Amount: '')
  container.querySelector('#bill-add-item-btn').addEventListener('click', () => {
    syncBillDraftFromDOM(container);
    billDraft.items.push({ description: '', qty: 1, rate: '' });
    renderCreateBillPage(container, { ...params, _internalRerender: true });
  });

  // Remove Item (allows deleting individual items, recalculating subtotal immediately)
  container.querySelectorAll('[data-remove-item]').forEach((btn) => {
    btn.addEventListener('click', () => {
      syncBillDraftFromDOM(container);
      const idx = Number(btn.getAttribute('data-remove-item'));
      if (idx >= 0 && idx < billDraft.items.length) {
        billDraft.items.splice(idx, 1);
        renderCreateBillPage(container, { ...params, _internalRerender: true });
      }
    });
  });

  // Submit Generate Bill (Create Mode) or Save Bill Changes (Edit Mode)
  container.querySelector('#create-bill-page-form').addEventListener('submit', (e) => {
    e.preventDefault();
    syncBillDraftFromDOM(container);

    const errEl = container.querySelector('#create-bill-error');
    errEl.hidden = true;

    if (billDraft && billDraft.editInvoiceId) {
      const editId = billDraft.editInvoiceId;
      const result = AppState.updateExistingBill(editId, {
        date: billDraft.date,
        items: billDraft.items,
        discount: billDraft.discount
      });
      if (!result.ok) {
        errEl.textContent = result.error;
        errEl.hidden = false;
        return;
      }
      billDraft = null;
      showToast('Invoice updated successfully');
      Router.navigate('bill-details', { invoiceId: result.invoice.id });
      return;
    }

    const result = AppState.generateBill({
      customerId: billDraft.customerId,
      vehicleId: billDraft.vehicleId,
      customInvoiceNumber: billDraft.customInvoiceNumber || '',
      date: billDraft.date,
      jobId: billDraft.jobId,
      items: billDraft.items,
      discount: billDraft.discount,
      amountReceived: billDraft.amountReceived,
      paymentMethod: billDraft.paymentMethod
    });

    if (!result.ok) {
      errEl.textContent = result.error;
      errEl.hidden = false;
      const recInputEl = container.querySelector('#bill-received-input');
      if (recInputEl && /amount received/i.test(result.error || '')) {
        recInputEl.classList.add('input-error');
        recInputEl.focus();
      }
      return;
    }

    billDraft = null;
    showToast('Invoice generated successfully');
    Router.navigate('invoice-preview', { invoiceId: result.invoice.id });
  });
}

function buildOfficialA4InvoiceHtml(invoice, businessProfile, summary, invSettings = {}) {
  const isPending = Number(summary.balance || 0) > 0;
  const isMultiPage = Array.isArray(summary.items) && summary.items.length > 8;

  // Use historical garage snapshot if present on invoice, else live businessProfile
  const gSnap = (invoice && invoice.garageSnapshot) || {};
  const rawGarageName = String(
    gSnap.garageName ||
    (businessProfile && (businessProfile.displayName || businessProfile.garageName)) ||
    'GarageFlow Workshop'
  ).trim();
  const garageTitleUpper = rawGarageName.toUpperCase();
  const garagePhone = String(gSnap.phone || (businessProfile && businessProfile.phone) || '').trim();
  const garageAddressBase = String(gSnap.address || (businessProfile && businessProfile.address) || '').trim();
  const garagePin = String(gSnap.pinCode || (businessProfile && businessProfile.pinCode) || '').trim();
  const garageAddress = garageAddressBase
    ? (garagePin && !garageAddressBase.includes(garagePin) ? `${garageAddressBase} - ${garagePin}` : garageAddressBase)
    : garagePin;

  // Customer & Vehicle details (handle optional Vehicle Model gracefully — never show undefined/null)
  const customerName = String((invoice && invoice.customerName) || 'Customer').trim();
  const customerPhone = String((invoice && invoice.customerPhone) || '').trim();
  const vehicleNumber = String((invoice && invoice.vehicleNumber) || '').trim();
  const jobId = String((invoice && invoice.jobId) || '').trim();
  const invDate = String((invoice && invoice.date) || '').trim();
  const invId = String((invoice && invoice.id) || 'INV-001').trim();

  // Resolve Brand & optional Model cleanly without fake placeholders
  let vehicleBrandModel = '';
  const explicitBrand = String((invoice && invoice.vehicleBrand) || '').trim();
  const explicitModel = String((invoice && invoice.vehicleModel) || '').trim();
  if (explicitBrand && explicitModel) {
    vehicleBrandModel = explicitModel.toLowerCase().startsWith(explicitBrand.toLowerCase())
      ? explicitModel
      : `${explicitBrand} ${explicitModel}`;
  } else if (explicitBrand) {
    vehicleBrandModel = explicitBrand;
  } else if (explicitModel && explicitModel.toLowerCase() !== 'vehicle') {
    vehicleBrandModel = explicitModel;
  } else if (invoice && invoice.vehicleDisplayModel && String(invoice.vehicleDisplayModel).trim().toLowerCase() !== 'vehicle') {
    vehicleBrandModel = String(invoice.vehicleDisplayModel).trim();
  }

  // Payment methods across multiple payments (deduplicated)
  const rawPayments = Array.isArray(invoice && invoice.payments) ? invoice.payments : [];
  const distinctMethods = [...new Set(rawPayments.map((p) => String(p.method || '').trim()).filter(Boolean))];
  const paymentMethodDisplay =
    distinctMethods.length > 0
      ? distinctMethods.join(', ')
      : summary.latestMethod && summary.paid > 0
      ? String(summary.latestMethod)
      : 'Not Paid Yet';

  // Strictly use ONLY the garage owner's actual uploaded/cropped QR image (NEVER generate a UPI QR or fake QR)
  const uploadedQrSrc = String((invSettings && invSettings.qrCodeDataUrl) || '').trim();
  const customLogoSrc = String(
    (invSettings && invSettings.logoDataUrl) ||
    (businessProfile && businessProfile.logoDataUrl) ||
    ''
  ).trim();
  const customSignatureSrc = String((invSettings && invSettings.signatureDataUrl) || '').trim();
  const hasUploadedQr = Boolean(uploadedQrSrc && (uploadedQrSrc.startsWith('data:image/') || /^https?:\/\//i.test(uploadedQrSrc)));

  const itemsRowsHtml = (summary.items || [])
    .map(
      (item) => `
        <tr>
          <td>${escapeHtml(item.description || '')}</td>
          <td>${escapeHtml(String(item.qty || 1))}</td>
          <td>${escapeHtml(formatCurrency(item.rate || 0))}</td>
          <td>${escapeHtml(formatCurrency(item.amount || 0))}</td>
        </tr>
      `
    )
    .join('');

  const paymentRightHtml = isPending
    ? `
      <table class="upi-inner-table">
        <tr>
          <td class="upi-text-cell">
            <div class="upi-heading">UPI PAYMENT</div>
            <div class="upi-subtext">${
              hasUploadedQr
                ? 'Scan the QR code to pay<br />the remaining balance.'
                : 'Payment QR not configured.<br />Upload QR in Invoice Settings.'
            }</div>
          </td>
          ${
            hasUploadedQr
              ? `<td class="upi-qr-cell">

                    <img class="qr-img" src="${uploadedQrSrc}" alt="Garage Payment QR Code" />

  const outstandingStripHtml = isPending

    .totals-table tr.sub-row td.t-label-cell { text-align: right; font-weight: 500; color: var(--navy-text); }
    .totals-table tr.sub-row td.t-colon-cell { text-align: center; font-weight: 500; color: var(--navy-text); }
    .totals-table tr.sub-row td.t-value-cell { text-align: right; font-weight: 700; color: var(--navy-dark); padding-right: 4.8mm; }
    .totals-table tr.spacer-row td { height: 1.8mm; padding: 0; }
    .totals-table tr.grand-row td { background-color: var(--blue-header-bg); height: 10.5mm; vertical-align: middle; padding: 0; }
    .totals-table tr.grand-row td.t-label-cell {
      text-align: right; font-size: 12.6pt; font-weight: 700; color: var(--navy-dark);
      border-top-left-radius: 3mm; border-bottom-left-radius: 3mm; padding-left: 4mm;
    }
    .totals-table tr.grand-row td.t-colon-cell { text-align: center; font-size: 12.6pt; font-weight: 700; color: var(--navy-dark); }
    .totals-table tr.grand-row td.t-value-cell { text-align: right; font-size: 15.5pt; font-weight: 800; color: var(--navy-dark); padding-right: 4.8mm; }

    .payment-card { page-break-inside: avoid; break-inside: avoid; }

</body>
</html>`;

/**
 * Renders the EXACT official A4 HTML invoice (buildOfficialA4InvoiceHtml) into a
 * crisp 2x high-resolution A4 portrait Canvas (1588 x 2246 px, exact 1:1.4142 aspect ratio)
 * using XML-serialized SVG <foreignObject>. Single source of truth for PNG, PDF, and WhatsApp share.
 */
async function renderOfficialInvoiceToCanvas(invoice, businessProfile, summary, invSettings = {}, sourceIframe = null) {
  const A4_W = 794;
  let A4_H = 1123;
  const SCALE = 2;

  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }

  let styleCss = '';
  let pageOuterHtml = '';

  // Prefer the already-rendered live iframe DOM if available; otherwise parse fresh HTML
  if (sourceIframe && sourceIframe.contentDocument && sourceIframe.contentDocument.getElementById('invoice-page')) {
    const doc = sourceIframe.contentDocument;
    const styleEl = doc.querySelector('style');
    const pageEl = doc.getElementById('invoice-page');
    styleCss = styleEl ? styleEl.textContent : '';
    A4_H = Math.max(1123, Math.ceil(pageEl.scrollHeight || 1123));
    pageOuterHtml = new XMLSerializer().serializeToString(pageEl);
  } else {
    const rawHtml = buildOfficialA4InvoiceHtml(invoice, businessProfile, summary, invSettings);
    const parsed = new DOMParser().parseFromString(rawHtml, 'text/html');
    const styleEl = parsed.querySelector('style');
    const pageEl = parsed.getElementById('invoice-page');
    styleCss = styleEl ? styleEl.textContent : '';
    const itemCount = Array.isArray(summary && summary.items) ? summary.items.length : 0;
    if (itemCount > 8) {
      A4_H = Math.max(1123, 1123 + (itemCount - 8) * 42);
    }
    pageOuterHtml = new XMLSerializer().serializeToString(pageEl);
  }

  // Ensure exact pixel dimensions & pure white background inside SVG foreignObject
  const sanitizedCss = styleCss
    .replace(/width:\s*210mm;/g, `width: ${A4_W}px;`)
    .replace(/height:\s*297mm;/g, `height: ${A4_H}px;`)
    .replace(/min-height:\s*297mm;/g, `min-height: ${A4_H}px;`) +
    "\n.invoice-page, .invoice-page table, .invoice-page td, .invoice-page th, .invoice-page div, .invoice-page span, .invoice-page p { font-family: 'Google Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }";

  // Escape CSS safely inside CDATA for strict XML parsing
  const safeCss = sanitizedCss.replace(/]]>/g, ']]]]><![CDATA[>');

  const svgMarkup =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${A4_W}" height="${A4_H}" viewBox="0 0 ${A4_W} ${A4_H}">` +
    `<foreignObject x="0" y="0" width="${A4_W}" height="${A4_H}">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${A4_W}px;height:${A4_H}px;background:#ffffff;margin:0;padding:0;overflow:hidden;font-family:'Google Sans','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#122645;-webkit-font-smoothing:antialiased;">` +
    `<style><![CDATA[${safeCss}]]></style>` +
    pageOuterHtml +
    `</div>` +
    `</foreignObject>` +
    `</svg>`;

  const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarkup);

  const img = await new Promise((resolve, reject) => {
    const image = new Image();
    image.decoding = 'async';
    image.onload = () => resolve(image);
    image.onerror = (err) => reject(new Error('Failed to rasterize A4 invoice SVG'));
    image.src = svgDataUrl;
  });

  const canvas = document.createElement('canvas');
  canvas.width = A4_W * SCALE;
  canvas.height = A4_H * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(SCALE, SCALE);
  ctx.drawImage(img, 0, 0, A4_W, A4_H);
  return { canvas, widthPx: A4_W, heightPx: A4_H };
}

/**
 * Generates an exact A4 Portrait PNG (1588 x 2246 @ 2x) matching the official HTML preview.
 */
async function generateOfficialInvoicePng(invoice, businessProfile, summary, invSettings = {}, sourceIframe = null) {
  const { canvas } = await renderOfficialInvoiceToCanvas(invoice, businessProfile, summary, invSettings, sourceIframe);
  const dataUrl = canvas.toDataURL('image/png');
  const blob = await new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/png'));
  return { blob, dataUrl, width: canvas.width, height: canvas.height };
}

/**
 * Wraps the exact 2x A4 Canvas JPEG into a standards-compliant A4 Portrait PDF (595.28 x 841.89 pt)
 * with exact 210mm x 297mm proportions, zero grey signature box, and byte-accurate xref table.
 */
async function generateOfficialInvoiceA4PdfBlob(invoice, businessProfile, summary, invSettings = {}, sourceIframe = null) {
  const { canvas, widthPx, heightPx } = await renderOfficialInvoiceToCanvas(invoice, businessProfile, summary, invSettings, sourceIframe);
  const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.95);
  const b64 = jpegDataUrl.split(',')[1];
  const binStr = atob(b64);
  const imgBytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) {
    imgBytes[i] = binStr.charCodeAt(i);
  }

  // Exact A4 portrait width = 595.28 pt; scale height proportionally if multi-page tall
  const pageW = 595.28;
  const pageH = heightPx === 1123 ? 841.89 : Number(((pageW * heightPx) / widthPx).toFixed(2));
  const imgW = canvas.width;
  const imgH = canvas.height;

  const encoder = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let bytePos = 0;

  function pushStr(str) {
    const bytes = encoder.encode(str);
    chunks.push(bytes);
    bytePos += bytes.length;
  }

  function pushBytes(arr) {
    chunks.push(arr);
    bytePos += arr.length;
  }

  function startObj(num) {
    offsets[num] = bytePos;
    pushStr(`${num} 0 obj\n`);
  }

  pushStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

  // 1: Catalog
  startObj(1);
  pushStr('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

  // 2: Pages
  startObj(2);
  pushStr('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');

  // 3: Page (A4 Portrait)
  startObj(3);
  pushStr(
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] ` +
    `/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`
  );

  // 4: JPEG Image XObject
  startObj(4);
  pushStr(
    `<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} ` +
    `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`
  );
  pushBytes(imgBytes);
  pushStr('\nendstream\nendobj\n');

  // 5: Page Content Stream drawing the A4 image edge-to-edge
  const contentStream = `q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
  startObj(5);
  pushStr(`<< /Length ${contentStream.length} >>\nstream\n${contentStream}endstream\nendobj\n`);

  const xrefStart = bytePos;
  pushStr('xref\n0 6\n0000000000 65535 f \n');
  for (let i = 1; i <= 5; i++) {
    pushStr(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
  }
  pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  return new Blob(chunks, { type: 'application/pdf' });
}

  const fitBtn = container.querySelector('#inv-zoom-fit-btn');
  const outBtn = container.querySelector('#inv-zoom-out-btn');
  const inBtn = container.querySelector('#inv-zoom-in-btn');

  const A4_WIDTH_PX = 794;
  let docHeightPx = 1123;
  let zoomMultiplier = 1; // 1 = Fit to viewport width

  function applyResponsiveA4Scale() {
    if (!stageOuter || !scaleBox || !iframe || !document.body.contains(stageOuter)) return;
    const availableW = Math.max(240, stageOuter.clientWidth - 26);
    const fitScale = Math.min(1, availableW / A4_WIDTH_PX);
    const effectiveScale = Math.max(0.28, Math.min(1.8, fitScale * zoomMultiplier));

    iframe.style.width = `${A4_WIDTH_PX}px`;
    iframe.style.height = `${docHeightPx}px`;
    iframe.style.transform = `scale(${effectiveScale})`;

    scaleBox.style.width = `${Math.round(A4_WIDTH_PX * effectiveScale)}px`;
    scaleBox.style.height = `${Math.round(docHeightPx * effectiveScale)}px`;

    if (zoomLabel) {
      zoomLabel.textContent = zoomMultiplier === 1
        ? `Fit · ${Math.round(effectiveScale * 100)}%`
        : `${Math.round(effectiveScale * 100)}%`;
    }
    if (fitBtn) fitBtn.classList.toggle('active', zoomMultiplier === 1);
  }

  if (iframe) {
    iframe.srcdoc = officialInvoiceHtml;
    iframe.addEventListener('load', () => {
      try {
        const innerPage = iframe.contentDocument && iframe.contentDocument.getElementById('invoice-page');
        if (innerPage) {
          docHeightPx = Math.max(1123, Math.ceil(innerPage.scrollHeight));
        }
      } catch (e) {}
      applyResponsiveA4Scale();
    });
  }

  applyResponsiveA4Scale();
  const onResize = () => applyResponsiveA4Scale();
  window.addEventListener('resize', onResize);
  invoiceResizeCleanup = () => window.removeEventListener('resize', onResize);

  if (fitBtn) {
    fitBtn.addEventListener('click', () => {
      zoomMultiplier = 1;
      applyResponsiveA4Scale();
    });
  }
  if (inBtn) {
    inBtn.addEventListener('click', () => {
      zoomMultiplier = Math.min(2.4, Number((zoomMultiplier + 0.25).toFixed(2)));
      applyResponsiveA4Scale();
    });
  }
  if (outBtn) {
    outBtn.addEventListener('click', () => {
      zoomMultiplier = Math.max(0.75, Number((zoomMultiplier - 0.25).toFixed(2)));
      applyResponsiveA4Scale();
    });
  }

  bindInvoicePreviewEvents(container, invoice, businessProfile, summary, params, iframe);
}

function bindInvoicePreviewEvents(container, invoice, businessProfile, summary, params = {}, invoiceIframe = null) {
  const goBackTarget = () => {
    if (typeof invoiceResizeCleanup === 'function') {
      invoiceResizeCleanup();
      invoiceResizeCleanup = null;
    }
    if (params.returnTo === 'invoice-settings') {
      Router.navigate('invoice-settings');
    } else {
      Router.navigate('payments');
    }
  };
  container.querySelector('#inv-preview-back-btn').addEventListener('click', goBackTarget);
  container.querySelector('#back-to-payments-link').addEventListener('click', goBackTarget);

  const recBtn = container.querySelector('#preview-record-payment-btn');
  if (recBtn) {
    recBtn.addEventListener('click', () => {
      openRecordPaymentModal(invoice.id, () => {
        renderInvoicePreviewPage(container, { invoiceId: invoice.id });
      });
    });
  }

  // Print / Save exact A4 Portrait Invoice directly from the isolated A4 iframe
  const printBtn = container.querySelector('#print-invoice-btn');
  if (printBtn) {
    printBtn.addEventListener('click', () => {
      if (invoiceIframe && invoiceIframe.contentWindow) {
        invoiceIframe.contentWindow.focus();
        invoiceIframe.contentWindow.print();
      } else {
        window.print();
      }
    });
  }

  // Explicit Download A4 PDF (Rendered directly from exact Official A4 HTML preview)
  const pdfBtn = container.querySelector('#download-invoice-pdf-btn');
  if (pdfBtn) {
    pdfBtn.addEventListener('click', async () => {
      pdfBtn.disabled = true;
      const origHtml = pdfBtn.innerHTML;
      pdfBtn.innerHTML = '<span>Preparing A4 PDF...</span>';
      try {
        const invSettings = AppState.data.invoiceSettings || {};
        const pdfBlob = await generateOfficialInvoiceA4PdfBlob(invoice, businessProfile, summary, invSettings, invoiceIframe);
        const url = URL.createObjectURL(pdfBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `GarageFlow-${invoice.id}-A4.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('A4 PDF downloaded.');
      } catch (err) {
        const invSettings = AppState.data.invoiceSettings || {};
        const pdfBlob = generateInvoiceA4PdfBlob(invoice, businessProfile, summary, invSettings);
        const url = URL.createObjectURL(pdfBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `GarageFlow-${invoice.id}-A4.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('A4 PDF downloaded.');
      } finally {
        pdfBtn.disabled = false;
        pdfBtn.innerHTML = origHtml;
      }
    });
  }

  // Explicit Save Invoice Image (PNG) (Exact 2x A4 Portrait capture from Official HTML preview)
  const pngBtn = container.querySelector('#save-invoice-device-btn');
  if (pngBtn) {
    pngBtn.addEventListener('click', async () => {
      pngBtn.disabled = true;
      const origHtml = pngBtn.innerHTML;
      pngBtn.innerHTML = '<span>Saving PNG...</span>';
      try {
        const invSettings = AppState.data.invoiceSettings || {};
        const { dataUrl } = await generateOfficialInvoicePng(invoice, businessProfile, summary, invSettings, invoiceIframe);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `GarageFlow-${invoice.id}.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('A4 Invoice PNG saved.');
      } catch (err) {
        try {
          const { dataUrl } = await generateInvoiceImageBlob(invoice, businessProfile, summary);
          const link = document.createElement('a');
          link.href = dataUrl;
          link.download = `GarageFlow-${invoice.id}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          showToast('Invoice image saved.');
        } catch (fallbackErr) {
          if (invoiceIframe && invoiceIframe.contentWindow) invoiceIframe.contentWindow.print();
        }
      } finally {
        pngBtn.disabled = false;
        pngBtn.innerHTML = origHtml;
      }
    });
  }

  // Explicit Share Invoice on WhatsApp (Uses exact Official A4 PNG)
  container.querySelector('#share-invoice-whatsapp-btn').addEventListener('click', async () => {
    const invSettings = AppState.data.invoiceSettings || {};
    let pngResult;
    try {
      pngResult = await generateOfficialInvoicePng(invoice, businessProfile, summary, invSettings, invoiceIframe);
    } catch (err) {
      pngResult = await generateInvoiceImageBlob(invoice, businessProfile, summary);
    }
    const { blob, dataUrl } = pngResult;
    const filename = `GarageFlow-${invoice.id}.png`;
    const file = blob ? new File([blob], filename, { type: 'image/png' }) : null;
    const vModelPart = invoice.vehicleModel ? ` (${invoice.vehicleModel})` : '';
    const shareSummaryText = `*${businessProfile.displayName || businessProfile.garageName || 'GarageFlow'} — Invoice ${invoice.id}*\nCustomer: ${invoice.customerName}\nVehicle: ${invoice.vehicleNumber}${vModelPart}\nGrand Total: ${formatCurrency(summary.total)}\nPaid: ${formatCurrency(summary.paid)}\nPending Balance: ${formatCurrency(summary.balance)}`;

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          title: `Invoice ${invoice.id}`,
          text: shareSummaryText,
          files: [file]
        });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }

    Modal.open({
      title: `Share Invoice ${invoice.id}`,
      bodyHtml: `
        <div class="info-banner" style="margin-bottom:12px;">
          <span style="color:var(--color-primary); display:inline-flex;">${ICONS.infoCircle}</span>
          <span>Download the prepared invoice below or open WhatsApp chat directly with your customer:</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <a href="${dataUrl}" download="${escapeHtml(filename)}" class="btn btn-primary btn-block">
            ${ICONS.download}
            <span>Download Invoice Image</span>
          </a>
          <a
            href="https://wa.me/${String(invoice.customerPhone || '').replace(/\D/g, '')}?text=${encodeURIComponent(shareSummaryText)}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-success btn-block"
          >
            ${ICONS.whatsapp}
            <span>Open WhatsApp Chat</span>
          </a>
        </div>
      `
    });
  });
}

// Displays Total Billed, Amount Received, Pending Amount, Payment History,
// and connects to Create Bill (Image 6) & Invoice Preview (Image 7)
// ==========================================================================
function renderPaymentsPage(container) {
  const { businessProfile, invoices } = AppState.data;
  const activeStatus = AppState.filters.paymentsStatus || 'All';
  const query = (AppState.filters.paymentsQuery || '').trim().toLowerCase();

  const enrichedInvoices = invoices.map((inv) => ({
    invoice: inv,
    summary: calculateInvoiceSummary(inv)
  }));

  const totalBilled = enrichedInvoices.reduce((acc, x) => acc + x.summary.total, 0);
  const totalCollected = enrichedInvoices.reduce((acc, x) => acc + x.summary.paid, 0);
  const totalPending = enrichedInvoices.reduce((acc, x) => acc + x.summary.balance, 0);

  const filteredInvoices = enrichedInvoices.filter(({ invoice, summary }) => {
    const matchesStatus = activeStatus === 'All' || summary.status === activeStatus;
    const matchesQuery =

      (invoice.jobId && invoice.jobId.toLowerCase().includes(query));
    return matchesStatus && matchesQuery;
  });

function bindPaymentsEvents(container) {
  const searchInput = container.querySelector('#payments-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      AppState.filters.paymentsQuery = e.target.value;
      renderPaymentsPage(container);
      const refocused = container.querySelector('#payments-search-input');
      if (refocused) {
        refocused.focus();
        refocused.setSelectionRange(refocused.value.length, refocused.value.length);
      }
    });
  }

  container.querySelectorAll('[data-payment-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      AppState.filters.paymentsStatus = btn.getAttribute('data-payment-filter');
      renderPaymentsPage(container);
    });
  });

  const resetBtn = container.querySelector('#reset-payments-filter-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      AppState.filters.paymentsStatus = 'All';
      AppState.filters.paymentsQuery = '';
      renderPaymentsPage(container);
    });
  }

  const filterBtn = container.querySelector('#payments-filter-btn');
  if (filterBtn) {
    filterBtn.addEventListener('click', () => {
      Modal.open({
        title: 'Filter Bills by Payment Status',
        bodyHtml: `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${['All', 'Unpaid', 'Partially Paid', 'Paid']
              .map(
                (st) => `
              <button type="button" class="btn ${AppState.filters.paymentsStatus === st ? 'btn-primary' : 'btn-outline'} btn-block" data-modal-pay-filter="${st}">
                ${st} Invoices
              </button>
            `
              )
              .join('')}
          </div>
        `,
        onMount(modalEl) {
          modalEl.querySelectorAll('[data-modal-pay-filter]').forEach((b) => {
            b.addEventListener('click', () => {
              AppState.filters.paymentsStatus = b.getAttribute('data-modal-pay-filter');
              Modal.close();
              renderPaymentsPage(container);
            });
          });
        }
      });
    });
  }

  // Create Bill button -> navigates to full Create Bill screen (Image 6)
  container.querySelector('#create-bill-btn').addEventListener('click', () => {
    Router.navigate('create-bill');
  });

  // Quick action buttons on each invoice card (Attachment 1 Design Enhancement)
  container.querySelectorAll('[data-view-bill]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const invoiceId = btn.getAttribute('data-view-bill');
      Router.navigate('bill-details', { invoiceId });
    });
  });

  container.querySelectorAll('[data-preview-pdf]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const invoiceId = btn.getAttribute('data-preview-pdf');
      Router.navigate('invoice-preview', { invoiceId });
    });
  });

  container.querySelectorAll('[data-record-pay]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const invoiceId = btn.getAttribute('data-record-pay');
      openRecordPaymentModal(invoiceId, () => {
        renderPaymentsPage(container);
      });
    });
  });

  // Clicking an invoice card opens Invoice Preview (Image 7)
  container.querySelectorAll('[data-invoice-card]').forEach((card) => {
    const openBill = () => {
      const invoiceId = card.getAttribute('data-invoice-card');
      Router.navigate('invoice-preview', { invoiceId });
    };
    card.addEventListener('click', openBill);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openBill();
      }
    });
  });
}

function bindBillDetailsEvents(container, invoice, summary) {

  const editDateBtn = container.querySelector('#bill-details-edit-date-btn');

    editDateBtn.addEventListener('click', () => {
      openInvoiceDatePickerModal(invoice.date, (meta) => {
        invoice.date = meta.formattedShort;
        AppState.notify();
        showToast(`Invoice date updated to ${meta.formattedShort}`);
        renderBillDetailsPage(container, { invoiceId: invoice.id });
      });
    });
  }

  const customerLink = container.querySelector('#bill-customer-link');
  if (customerLink) {
    customerLink.addEventListener('click', () => {
      Router.navigate('customer-profile', { customerId: invoice.customerId });
    });
  }

  const jobRefLink = container.querySelector('#bill-job-ref-link');
  if (jobRefLink) {
    jobRefLink.addEventListener('click', () => {
      Router.navigate('customer-profile', { customerId: invoice.customerId });
    });
  }

  // Record Payment modal trigger
  const recordPaymentBtn = container.querySelector('#open-record-payment-btn');
  if (recordPaymentBtn) {
    recordPaymentBtn.addEventListener('click', () => {
      openRecordPaymentModal(invoice.id, () => {
        renderBillDetailsPage(container, { invoiceId: invoice.id });
      });
    });
  }

  // Edit Bill button -> opens existing Generate Bill interface in Edit Mode
  const editBillBtn = container.querySelector('#bill-edit-btn');
  if (editBillBtn) {
    editBillBtn.addEventListener('click', () => {
      if (AppState.user && AppState.user.role === 'staff') return;
      Router.navigate('create-bill', {
        editInvoiceId: invoice.id,
        returnTo: 'bill-details'
      });
    });
  }
}

function bindBusinessProfileEvents(container) {
  container.querySelector('#bp-back-btn').addEventListener('click', () => {
    Router.navigate('settings');
  });

  container.querySelectorAll('[data-focus-input]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const targetId = btn.getAttribute('data-focus-input');
      const inp = container.querySelector(`#${targetId}`);
      if (inp) {
        inp.focus();
        inp.select();
      }
    });
  });

  // Logo image upload via FileReader
  const logoInput = container.querySelector('#bp-logo-upload');
  if (logoInput) {
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        AppState.updateBusinessProfile({ logoDataUrl: reader.result });
        showToast('Updated garage logo preview.');
        renderBusinessProfilePage(container);
      };
      reader.readAsDataURL(file);
    });
  }

  // Save Changes
  container.querySelector('#business-profile-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const garageName = container.querySelector('#bp-garage-name').value.trim();
    const ownerName = container.querySelector('#bp-owner-name').value.trim();
    const phone = container.querySelector('#bp-phone').value.trim();
    const email = container.querySelector('#bp-email').value.trim();
    const address = container.querySelector('#bp-address').value.trim();
    const pinCode = container.querySelector('#bp-pincode').value.trim();
    const businessType = container.querySelector('#bp-type').value.trim();
    const businessHours = container.querySelector('#bp-hours').value.trim();
    const workingDays = container.querySelector('#bp-days').value.trim();
    const displayName = container.querySelector('#bp-display-name').value.trim();

    if (!garageName || !phone || !address) {
      showToast('Garage name, phone number, and address are required.', 'danger');
      return;
    }

    AppState.updateBusinessProfile({
      garageName,
      ownerName,
      phone,
      email,
      address,
      pinCode,
      businessType,
      businessHours,
      workingDays,
      displayName: displayName || garageName
    });

    showToast('Business profile saved. Changes will appear on all generated invoices.');
  });
}

function bindWhatsAppIntegrationEvents(container) {
  container.querySelector('#wa-back-btn').addEventListener('click', () => {

  container.querySelector('#wa-contact-support-btn').addEventListener('click', () => {
    openBlankGmailCompose('');
  });

  // Connect WhatsApp Business button (Section 13: Never fakes a real Meta connection)
  container.querySelector('#connect-whatsapp-business-btn').addEventListener('click', async () => {
    let serverStatusMsg =
      'Meta WhatsApp Business Embedded Signup requires backend server configuration (META_APP_ID, META_APP_SECRET, and META_CONFIG_ID in server/.env).';

    try {
      const resp = await fetch('/api/whatsapp/connect', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-garage-id': AppState.data.tenant.garageId || 'GAR-001'
        },
        body: JSON.stringify({})
      });
      const data = await resp.json();
      if (data && data.message) {
        serverStatusMsg = data.message;
      }
    } catch (err) {
      // Running in standalone/browser-only mode without the Express server attached
    }

    Modal.open({
      title: 'Meta WhatsApp Business Setup',
      bodyHtml: `
        <div class="info-banner" style="margin-bottom:14px;">
          <span style="color:var(--color-primary); display:inline-flex;">${ICONS.shieldLock}</span>
          <span>${escapeHtml(serverStatusMsg)}</span>
        </div>

        <div class="card-subtle" style="font-size:var(--text-xs); line-height:1.55; margin-bottom:14px;">
          <div style="font-weight:800; color:var(--color-text); margin-bottom:6px;">
            Backend Integration Architecture Ready:
          </div>
          <div>• <strong>Tenant Isolation:</strong> Credentials stored per <code>garage_id</code> in <code>whatsapp_connections</code> table.</div>
          <div>• <strong>Server-Side Token Security:</strong> Access tokens, <code>waba_id</code>, and <code>phone_number_id</code> are exchanged and encrypted strictly on the Express backend (<code>server/server.js</code>) and never exposed in client-side JS or <code>localStorage</code>.</div>
          <div>• <strong>Connection Status:</strong> Remains <strong>Not Connected</strong> until valid Meta Embedded Signup OAuth credentials are supplied on the server.</div>
        </div>

        <button type="button" class="btn btn-primary btn-block" data-modal-close>
          Understood
        </button>
      `
    });
  });
}

function openAssetCropModal(rawImageUrl, options = {}, onCropped) {
  const {
    title = 'Crop Image',
    subtitle = 'Center the image inside the square frame using zoom and pan controls.',
    applyLabel = 'Apply Crop',
    preserveTransparency = false,
    fitMode = 'contain',
    minZoom = 0.6,
    maxZoom = 3
  } = options;

  let zoom = 1;
  let offsetX = 0;
  let offsetY = 0;

  Modal.open({
    title,
    centered: true,
    bodyHtml: `
      <div>
        <p style="font-size:12px; color:var(--color-muted); margin-bottom:10px;">
          ${escapeHtml(subtitle)}
        </p>
        <div style="display:flex; justify-content:center; margin-bottom:12px;">
          <canvas id="qr-crop-canvas" width="220" height="220" style="border:2px dashed #2563eb; border-radius:12px; background:${preserveTransparency ? 'repeating-conic-gradient(#f1f5f9 0% 25%, #ffffff 0% 50%) 50% / 16px 16px' : '#f8fafc'};"></canvas>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px; font-size:12px;">
          <label style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <span>Zoom</span>
            <input type="range" id="qr-crop-zoom" min="${minZoom}" max="${maxZoom}" step="0.05" value="1" style="width:150px;" />
          </label>
          <label style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <span>Horizontal Pan</span>
            <input type="range" id="qr-crop-pan-x" min="-150" max="150" step="2" value="0" style="width:150px;" />
          </label>
          <label style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <span>Vertical Pan</span>
            <input type="range" id="qr-crop-pan-y" min="-150" max="150" step="2" value="0" style="width:150px;" />
          </label>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
          <button type="button" class="btn btn-neutral-outline" data-modal-close>Cancel</button>
          <button type="button" class="btn btn-primary" id="apply-qr-crop-btn">${escapeHtml(applyLabel)}</button>
        </div>
      </div>
    `,
    onMount(modalEl) {
      const canvas = modalEl.querySelector('#qr-crop-canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        function renderToContext(targetCtx, w, h, ratioScale) {
          if (preserveTransparency) {
            targetCtx.clearRect(0, 0, w, h);
          } else {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(0, 0, w, h);
          }
          const baseScale =
            fitMode === 'cover'
              ? Math.max(w / img.width, h / img.height)
              : Math.min(w / img.width, h / img.height);
          const scale = baseScale * zoom;
          const dw = img.width * scale;
          const dh = img.height * scale;
          const dx = (w - dw) / 2 + offsetX * ratioScale;
          const dy = (h - dh) / 2 + offsetY * ratioScale;
          targetCtx.drawImage(img, dx, dy, dw, dh);
        }

        function redraw() {
          renderToContext(ctx, canvas.width, canvas.height, 1);
        }
        redraw();

        modalEl.querySelector('#qr-crop-zoom').addEventListener('input', (e) => {
          zoom = Number(e.target.value) || 1;
          redraw();
        });
        modalEl.querySelector('#qr-crop-pan-x').addEventListener('input', (e) => {
          offsetX = Number(e.target.value) || 0;
          redraw();
        });
        modalEl.querySelector('#qr-crop-pan-y').addEventListener('input', (e) => {
          offsetY = Number(e.target.value) || 0;
          redraw();
        });
        modalEl.querySelector('#apply-qr-crop-btn').addEventListener('click', () => {
          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = 440;
          exportCanvas.height = 440;
          const exportCtx = exportCanvas.getContext('2d');
          renderToContext(exportCtx, 440, 440, 2);
          const croppedUrl = exportCanvas.toDataURL('image/png');
          Modal.close();
          if (typeof onCropped === 'function') {
            onCropped(croppedUrl);
          }
        });
      };
      img.src = rawImageUrl;
    }
  });
}

function bindInvoiceSettingsEvents(container) {
  container.querySelector('#inv-settings-back-btn').addEventListener('click', () => {
    Router.navigate('settings');
  });

  // Upload Logo
  const logoInput = container.querySelector('#inv-logo-upload-input');
  if (logoInput) {
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        AppState.updateInvoiceSettings({ logoDataUrl: reader.result });
        showToast('Business logo updated successfully');
        renderInvoiceSettingsPage(container);
      };
      reader.readAsDataURL(file);
    });
  }

  const cropLogoBtn = container.querySelector('#inv-logo-crop-btn');
  if (cropLogoBtn) {
    cropLogoBtn.addEventListener('click', () => {
      const currentLogo =
        (AppState.data.invoiceSettings && AppState.data.invoiceSettings.logoDataUrl) ||
        (AppState.data.businessProfile && AppState.data.businessProfile.logoDataUrl);
      if (!currentLogo) return;
      openAssetCropModal(
        currentLogo,
        {
          title: 'Crop Garage Logo',
          subtitle: 'Adjust zoom and pan to center your garage logo inside the square frame.',
          applyLabel: 'Apply Logo Crop',
          preserveTransparency: true,
          fitMode: 'contain',
          minZoom: 0.6,
          maxZoom: 3
        },
        (croppedLogoUrl) => {
          AppState.updateInvoiceSettings({ logoDataUrl: croppedLogoUrl });
          showToast('Cropped garage logo saved');
          renderInvoiceSettingsPage(container);
        }
      );
    });
  }

  const removeLogoBtn = container.querySelector('#inv-logo-remove-btn');
  if (removeLogoBtn) {
    removeLogoBtn.addEventListener('click', () => {
      AppState.updateInvoiceSettings({ logoDataUrl: null });
      showToast('Garage logo removed. Default GarageFlow logo will be used.');
      renderInvoiceSettingsPage(container);
    });
  }

  // Upload Signature
  const sigInput = container.querySelector('#inv-sig-upload-input');
  if (sigInput) {
    sigInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        AppState.updateInvoiceSettings({ signatureDataUrl: reader.result });
        showToast('Owner signature updated successfully');
        renderInvoiceSettingsPage(container);
      };
      reader.readAsDataURL(file);
    });
  }

  const cropSigBtn = container.querySelector('#inv-sig-crop-btn');
  if (cropSigBtn) {
    cropSigBtn.addEventListener('click', () => {
      const currentSig = AppState.data.invoiceSettings && AppState.data.invoiceSettings.signatureDataUrl;
      if (!currentSig) return;
      openAssetCropModal(
        currentSig,
        {
          title: 'Crop Owner Signature',
          subtitle: 'Adjust zoom and pan to frame your signature cleanly while preserving transparency.',
          applyLabel: 'Apply Signature Crop',
          preserveTransparency: true,
          fitMode: 'contain',
          minZoom: 0.6,
          maxZoom: 3
        },
        (croppedSigUrl) => {
          AppState.updateInvoiceSettings({ signatureDataUrl: croppedSigUrl });
          showToast('Cropped owner signature saved');
          renderInvoiceSettingsPage(container);
        }
      );
    });
  }

  const removeSigBtn = container.querySelector('#inv-sig-remove-btn');
  if (removeSigBtn) {
    removeSigBtn.addEventListener('click', () => {
      AppState.updateInvoiceSettings({ signatureDataUrl: null });
      showToast('Owner signature removed. Default signature will be used.');
      renderInvoiceSettingsPage(container);
    });
  }

  // Upload & Verify Payment QR Code
  const qrInput = container.querySelector('#inv-qr-upload-input');
  if (qrInput) {
    qrInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const rawUrl = reader.result;
        const check = await verifyQrCodeReadability(rawUrl);
        AppState.updateInvoiceSettings({
          qrCodeDataUrl: rawUrl,
          qrVerified: check.valid,
          qrStatusText: check.reason
        });
        showToast(
          check.valid ? 'QR code verified and ready for invoices' : check.reason,
          check.valid ? 'success' : 'warning'
        );
        renderInvoiceSettingsPage(container);
      };
      reader.readAsDataURL(file);
    });
  }

  const sampleQrBtn = container.querySelector('#inv-qr-sample-verify-btn');
  if (sampleQrBtn) {
    sampleQrBtn.addEventListener('click', async () => {
      const sampleUrl = generateSampleUpiQrDataUrl();
      const check = await verifyQrCodeReadability(sampleUrl);
      AppState.updateInvoiceSettings({
        qrCodeDataUrl: sampleUrl,
        qrVerified: check.valid,
        qrStatusText: check.reason
      });
      showToast('QR code verified and ready for invoices');
      renderInvoiceSettingsPage(container);
    });
  }

  const cropQrBtn = container.querySelector('#inv-qr-crop-btn');
  if (cropQrBtn) {
    cropQrBtn.addEventListener('click', () => {
      const currentQr = AppState.data.invoiceSettings.qrCodeDataUrl;
      if (!currentQr) return;
      openQrCropModal(currentQr, async (croppedDataUrl) => {
        const check = await verifyQrCodeReadability(croppedDataUrl);
        AppState.updateInvoiceSettings({
          qrCodeDataUrl: croppedDataUrl,
          qrVerified: check.valid,
          qrStatusText: check.reason
        });
        showToast(
          check.valid ? 'Cropped QR code verified' : check.reason,
          check.valid ? 'success' : 'warning'
        );
        renderInvoiceSettingsPage(container);
      });
    });
  }

  const removeQrBtn = container.querySelector('#inv-qr-remove-btn');
  if (removeQrBtn) {
    removeQrBtn.addEventListener('click', () => {
      AppState.updateInvoiceSettings({
        qrCodeDataUrl: null,
        qrVerified: false,
        qrStatusText: 'QR code removed'
      });
      renderInvoiceSettingsPage(container);
    });
  }



  // Invoice Number & Date controls
  container.querySelector('#toggle-auto-inv-no').addEventListener('change', (e) => {
    AppState.updateInvoiceSettings({ autoInvoiceNumber: e.target.checked });
  });

  container.querySelector('#inv-next-seq-input').addEventListener('change', (e) => {
    AppState.updateInvoiceSettings({ currentInvoiceSeq: Math.max(1, Number(e.target.value) || 1) });
    renderInvoiceSettingsPage(container);
  });

  const invFormatSelect = container.querySelector('#inv-format-select');
  if (invFormatSelect) {
    invFormatSelect.style.cursor = 'pointer';
    invFormatSelect.style.fontWeight = '700';
    invFormatSelect.addEventListener('change', (e) => {
      AppState.updateInvoiceSettings({ invoiceFormat: e.target.value });
      renderInvoiceSettingsPage(container);
    });
    const openInvFormatPopup = (e) => {
      e.preventDefault();
      const currentCfg = AppState.data.invoiceSettings || INITIAL_DATA.invoiceSettings;
      const seqNum = currentCfg.currentInvoiceSeq || 4;
      const formatOptions = ['INV-01', 'INV-001', 'INVOICE-001', 'INV-{####}'].map((fmt) => ({
        value: fmt,
        label: fmt,
        sublabel: `Next invoice number: ${formatInvoiceNumber(seqNum, fmt)}`,
        icon: ICONS.fileText
      }));
      SelectionPopup.open({
        title: 'Select Invoice Number Format',
        searchable: false,
        selectedValues: [currentCfg.invoiceFormat || 'INV-01'],
        items: formatOptions,
        onConfirm(chosenFmt) {
          if (chosenFmt) {
            AppState.updateInvoiceSettings({ invoiceFormat: chosenFmt });
            renderInvoiceSettingsPage(container);
          }
        }
      });
    };
    invFormatSelect.addEventListener('mousedown', openInvFormatPopup);
    invFormatSelect.addEventListener('click', openInvFormatPopup);
  }

  container.querySelector('#toggle-auto-inv-date').addEventListener('change', (e) => {
    AppState.updateInvoiceSettings({ autoInvoiceDate: e.target.checked });
    renderInvoiceSettingsPage(container);
  });

  // Invoice Content switches
  container.querySelectorAll('[data-inv-content-toggle]').forEach((sw) => {
    sw.addEventListener('change', (e) => {
      const key = sw.getAttribute('data-inv-content-toggle');
      AppState.updateInvoiceSettings({ [key]: e.target.checked });
    });
  });

  // Template Appearance Previews
  container.querySelector('#preview-pending-template-btn').addEventListener('click', () => {
    syncFooterFields(container);
    Router.navigate('invoice-preview', {
      invoiceId: 'INV-01',
      previewMode: 'pending',
      returnTo: 'invoice-settings'
    });
  });

  container.querySelector('#preview-completed-template-btn').addEventListener('click', () => {
    syncFooterFields(container);
    Router.navigate('invoice-preview', {
      invoiceId: 'INV-03',
      previewMode: 'completed',
      returnTo: 'invoice-settings'
    });
  });

  function syncFooterFields(root) {
    const ty = root.querySelector('#inv-thankyou-input');
    const note = root.querySelector('#inv-note-input');
    const seq = root.querySelector('#inv-next-seq-input');
    AppState.updateInvoiceSettings({
      thankYouMessage: ty ? ty.value.trim() : 'Thank you for choosing our garage!',
      additionalNote: note ? note.value.trim() : '',
      currentInvoiceSeq: seq ? Math.max(1, Number(seq.value) || 1) : 4
    });
  }

  container.querySelector('#inv-settings-preview-btn').addEventListener('click', () => {
    syncFooterFields(container);
    Router.navigate('invoice-preview', {
      invoiceId: 'INV-01',
      previewMode: null,
      returnTo: 'invoice-settings'
    });
  });

  container.querySelector('#inv-settings-save-btn').addEventListener('click', () => {
    syncFooterFields(container);
    showToast('Invoice & payment settings saved successfully');
  });
}

function bindNotificationSettingsEvents(container) {
  container.querySelector('#notif-settings-back-btn').addEventListener('click', () => {
    Router.navigate('settings');
  });

  const notif = AppState.data.notificationSettings || INITIAL_DATA.notificationSettings;

  container.querySelector('#toggle-service-reminders').addEventListener('change', (e) => {
    AppState.updateNotificationSettings({ serviceRemindersEnabled: e.target.checked });
  });

  container.querySelector('#toggle-morning-summary').addEventListener('change', (e) => {
    AppState.updateNotificationSettings({ morningSummaryEnabled: e.target.checked });
  });

  container.querySelector('#toggle-payment-reminders').addEventListener('change', (e) => {
    AppState.updateNotificationSettings({ paymentRemindersEnabled: e.target.checked });
  });

  // Delete service reminder
  container.querySelectorAll('[data-del-srv-rem]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.getAttribute('data-del-srv-rem'));
      const next = [...(notif.serviceReminders || [])];
      next.splice(idx, 1);
      AppState.updateNotificationSettings({ serviceReminders: next });
      renderNotificationSettingsPage(container);
    });
  });

  // Add service reminder
  container.querySelector('#add-service-reminder-btn').addEventListener('click', () => {
    Modal.open({
      title: 'Add Service Time Reminder',
      centered: true,
      bodyHtml: `
        <form id="add-srv-rem-form">
          <div class="form-group">
            <label class="form-label" for="custom-srv-rem-input">Reminder Lead Time</label>
            <input
              type="text"
              id="custom-srv-rem-input"
              class="form-input"
              placeholder="e.g. 15 minutes before, 2 hours before"
              value="15 minutes before"
              required
            />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
            <button type="button" class="btn btn-neutral-outline" data-modal-close>Cancel</button>
            <button type="submit" class="btn btn-primary">Add Reminder</button>
          </div>
        </form>
      `,
      onMount(modalEl) {
        modalEl.querySelector('#add-srv-rem-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const val = modalEl.querySelector('#custom-srv-rem-input').value.trim();
          if (!val) return;
          const next = [...(notif.serviceReminders || []), val];
          AppState.updateNotificationSettings({ serviceReminders: next });
          Modal.close();
          renderNotificationSettingsPage(container);
        });
      }
    });
  });

  // Delete payment reminder
  container.querySelectorAll('[data-del-pay-rem]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.getAttribute('data-del-pay-rem'));
      const next = [...(notif.paymentReminders || [])];
      next.splice(idx, 1);
      AppState.updateNotificationSettings({ paymentReminders: next });
      renderNotificationSettingsPage(container);
    });
  });

  // Add payment reminder
  container.querySelector('#add-payment-reminder-btn').addEventListener('click', () => {
    Modal.open({
      title: 'Add Pending Payment Reminder',
      centered: true,
      bodyHtml: `
        <form id="add-pay-rem-form">
          <div class="form-group">
            <label class="form-label" for="custom-pay-rem-input">Remind After</label>
            <input
              type="text"
              id="custom-pay-rem-input"
              class="form-input"
              placeholder="e.g. 14 days, 30 days"
              value="14 days"
              required
            />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
            <button type="button" class="btn btn-neutral-outline" data-modal-close>Cancel</button>
            <button type="submit" class="btn btn-primary">Add Reminder</button>
          </div>
        </form>
      `,
      onMount(modalEl) {
        modalEl.querySelector('#add-pay-rem-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const val = modalEl.querySelector('#custom-pay-rem-input').value.trim();
          if (!val) return;
          const next = [...(notif.paymentReminders || []), val];
          AppState.updateNotificationSettings({ paymentReminders: next });
          Modal.close();
          renderNotificationSettingsPage(container);
        });
      }
    });
  });

  // Manage Device Notification Permission (Real Browser Notification API)
  container.querySelector('#manage-device-permission-btn').addEventListener('click', async () => {
    if (typeof window !== 'undefined' && 'Notification' in window) {
      try {
        const result = await Notification.requestPermission();
        AppState.updateNotificationSettings({ devicePermissionStatus: result });
        showToast(`Device notification permission: ${result}`);
        renderNotificationSettingsPage(container);
        return;
      } catch (err) {
        // Fallback info modal if browser blocks direct request
      }
    }
    showToast('Device notification permission status checked');
  });
}

function validateStaffSetupPassword(password) {
  const pwd = String(password || '');
  const minLength = pwd.length >= 8;
  const hasLetter = /[A-Za-z]/.test(pwd);
  const hasNumber = /[0-9]/.test(pwd);
  return {
    valid: minLength && hasLetter && hasNumber,
    minLength,
    hasLetter,
    hasNumber
  };
}

function renderStaffAccountSetupPage(container, params = {}) {
  let showNewPass = false;
  let showConfirmPass = false;
  let isSubmitting = false;

  container.innerHTML = `
    <div class="staff-setup-shell">
      <div class="staff-setup-card" id="staff-setup-card-root">

  SupabaseService.verifyInvitationSession(params).then((verification) => {
    if (!verification.ok) {
      cardRoot.innerHTML = `
        <div style="text-align:center; padding:8px 4px;">
          <div class="logout-icon-circle" style="margin:0 auto 12px;">
            ${ICONS.alertCircle}
