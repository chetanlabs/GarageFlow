function bindLoginEvents(container) {
  const screenRoot = container.querySelector('#login-screen-root');
  const form = container.querySelector('#login-form');
  const emailInput = container.querySelector('#login-email');
  const passwordInput = container.querySelector('#login-password');
  const emailError = container.querySelector('#login-email-error');
  const passwordError = container.querySelector('#login-password-error');

  let blurTimer = null;
  let baseWindowHeight = window.innerHeight;

  function isMobileOrTabletViewport() {
    return window.innerWidth <= 1024;
  }

  function setMobileInputFocusState(focused) {
    if (!screenRoot || !document.body.contains(screenRoot)) return;
    if (isMobileOrTabletViewport() && focused) {
      screenRoot.classList.add('input-focused');
    } else {
      screenRoot.classList.remove('input-focused');
    }
    if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
      window.scrollTo(0, 0);
    }
  }

  function syncViewportState() {
    if (!screenRoot || !document.body.contains(screenRoot)) return;
    const vv = window.visualViewport;
    const currentHeight = vv ? vv.height : window.innerHeight;

    if (currentHeight > baseWindowHeight) {
      baseWindowHeight = currentHeight;
    }

    document.documentElement.style.setProperty('--vvh', `${Math.round(currentHeight)}px`);

    const activeEl = document.activeElement;
    const inputCurrentlyFocused = activeEl === emailInput || activeEl === passwordInput;
    const heightShrunk = isMobileOrTabletViewport() && currentHeight < baseWindowHeight * 0.82;

    if (isMobileOrTabletViewport() && (inputCurrentlyFocused || heightShrunk)) {
      screenRoot.classList.add('input-focused');
    } else {
      screenRoot.classList.remove('input-focused');
    }

    if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
      window.scrollTo(0, 0);
    }
  }

  // Section 6: Immediately hide the entire hero image on mobile/tablet when Email or Password input is focused
  [emailInput, passwordInput].forEach((inp) => {
    inp.addEventListener('focus', () => {
      if (blurTimer) {
        clearTimeout(blurTimer);
        blurTimer = null;
      }
      setMobileInputFocusState(true);
    });

    inp.addEventListener('blur', () => {
      if (blurTimer) clearTimeout(blurTimer);
      blurTimer = setTimeout(() => {
        const active = document.activeElement;
        if (active !== emailInput && active !== passwordInput) {
          setMobileInputFocusState(false);
        }
      }, 100);
    });
  });

  // Preserve typed values across role/eye toggles
  emailInput.addEventListener('input', () => {
    draftEmail = emailInput.value;
    emailError.hidden = true;
    emailInput.classList.remove('input-error');
  });

  passwordInput.addEventListener('input', () => {
    draftPassword = passwordInput.value;
    passwordError.hidden = true;
    passwordInput.classList.remove('input-error');
  });

  // Role selection cards (Owner vs Staff)
  container.querySelectorAll('[data-role-select]').forEach((btn) => {
    btn.addEventListener('click', () => {
      draftEmail = emailInput.value;
      draftPassword = passwordInput.value;
      selectedRole = btn.getAttribute('data-role-select');
      renderLoginPage(container);
    });
  });

  // Password visibility toggle (preserve input focus if an input was focused)
  const toggleBtn = container.querySelector('#toggle-password-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
    });
    toggleBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
      toggleBtn.innerHTML = showPassword ? ICONS.eyeOff : ICONS.eye;
    });
  }

  // Forgot password modal
  const forgotBtn = container.querySelector('#forgot-password-btn');
  if (forgotBtn) {
    forgotBtn.addEventListener('click', () => {
      Modal.open({
        title: 'Forgot Password',
        bodyHtml: `
          <p style="font-size:var(--text-sm); color:var(--color-muted); margin-bottom:14px;">
            Enter your registered email address or mobile number to request a password reset from your garage administrator.
          </p>
          <div class="form-group">
            <label class="form-label" for="reset-email-input">Email or phone number</label>
            <input
              type="text"
              id="reset-email-input"
              class="form-input"
              value="${escapeHtml(emailInput.value)}"
              placeholder="Enter your email or phone"
            />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="send-reset-demo-btn">
            Request Password Reset
          </button>
        `,
        onMount(modalEl) {
          modalEl.querySelector('#send-reset-demo-btn').addEventListener('click', () => {
            Modal.close();
            showToast('Password reset request sent to your registered contact.');
          });
        }
      });
    });
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportState);
    window.visualViewport.addEventListener('scroll', syncViewportState);
  }
  window.addEventListener('resize', syncViewportState);

  viewportCleanup = () => {
    if (blurTimer) clearTimeout(blurTimer);
    document.documentElement.style.removeProperty('--vvh');
    if (window.visualViewport) {
      window.visualViewport.removeEventListener('resize', syncViewportState);
      window.visualViewport.removeEventListener('scroll', syncViewportState);
    }
    window.removeEventListener('resize', syncViewportState);
  };

  syncViewportState();

  const dismissBannerBtn = container.querySelector('#dismiss-setup-banner-btn');
  if (dismissBannerBtn) {
    dismissBannerBtn.addEventListener('click', () => {
      postSetupSuccessMessage = '';
      renderLoginPage(container);
    });
  }

  // Sign In form submission (supports both Supabase Auth and local state verification)
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    emailError.hidden = true;
    passwordError.hidden = true;
    emailInput.classList.remove('input-error');
    passwordInput.classList.remove('input-error');

    const submitBtn = form.querySelector('.login-submit-btn');
    if (submitBtn) submitBtn.disabled = true;

    let result;
    const cleanInputEmail = String(emailInput.value || '').trim().toLowerCase();
    const isDemoAdminLogin =
      selectedRole === 'admin' &&
      (cleanInputEmail === DEMO_CREDENTIALS.admin.email.toLowerCase() ||
        cleanInputEmail.replace(/\s+/g, '') === DEMO_CREDENTIALS.admin.phone.replace(/\s+/g, ''));
    const isDemoStaffLogin =
      selectedRole === 'staff' &&
      (cleanInputEmail === DEMO_CREDENTIALS.staff.email.toLowerCase() ||
        cleanInputEmail.replace(/\s+/g, '') === DEMO_CREDENTIALS.staff.phone.replace(/\s+/g, ''));

    if (selectedRole === 'superadmin') {
      result = await AppState.loginSuperadminWithSupabase(emailInput.value, passwordInput.value);
    } else if (selectedRole === 'admin' && !isDemoAdminLogin) {
      result = await AppState.loginOwnerWithSupabase(emailInput.value, passwordInput.value);
    } else if (selectedRole === 'staff' && !isDemoStaffLogin) {
      result = await AppState.loginStaffWithSupabase(emailInput.value, passwordInput.value);
    } else {
      result = AppState.login(selectedRole, emailInput.value, passwordInput.value);
    }

    if (submitBtn) submitBtn.disabled = false;

    if (!result.ok) {
      if (result.field === 'email') {
        emailError.textContent = result.error;
        emailError.hidden = false;
        emailInput.classList.add('input-error');
      } else {
        passwordError.textContent = result.error;
        passwordError.hidden = false;
        passwordInput.classList.add('input-error');
      }
      return;
    }

    postSetupSuccessMessage = '';
    if (typeof viewportCleanup === 'function') {
      viewportCleanup();
      viewportCleanup = null;
    }

    if (AppState.user && AppState.user.role === 'superadmin') {
      showToast('Signed in as Superadmin');
      Router.navigate('superadmin-dashboard');
      return;
    }

    const roleDisplay = selectedRole === 'admin' ? 'Owner' : 'Staff';
    showToast(`Signed in as ${roleDisplay}`);
    Router.navigate('dashboard');
  });
}

    ? jobs.filter((j) => j.receivedDate === selectedDateStr)

    brand: '',
    model: '',
    year: '',
    notes: ''
  };

function syncDraftFromInputs(container) {
  if (!draftCustomer) return;
  const nameEl = container.querySelector('#cust-full-name');
  const mobileEl = container.querySelector('#cust-mobile');
  const emailEl = container.querySelector('#cust-email');
  const addressEl = container.querySelector('#cust-address');

  if (nameEl) draftCustomer.name = nameEl.value;
  if (mobileEl) draftCustomer.phone = mobileEl.value;
  if (emailEl) draftCustomer.email = emailEl.value;
  if (addressEl) draftCustomer.address = addressEl.value;

  container.querySelectorAll('.vehicle-entry-card').forEach((card) => {
    const idx = Number(card.getAttribute('data-vehicle-index'));
    if (!draftCustomer.vehicles[idx]) return;
    draftCustomer.vehicles[idx].regNumber = card.querySelector('.v-reg-input').value;
    draftCustomer.vehicles[idx].brand = card.querySelector('.v-brand-input').value;
    draftCustomer.vehicles[idx].model = card.querySelector('.v-model-input').value;
    draftCustomer.vehicles[idx].year = card.querySelector('.v-year-input').value;
    draftCustomer.vehicles[idx].notes = card.querySelector('.v-notes-input').value;
  });
}

function bindAddCustomerEvents(container, params) {
  const goBack = () => {
    draftCustomer = null;
    if (params.returnTo) {
      Router.navigate(params.returnTo, params);
    } else {
      Router.navigate('customers');
    }
  };

  container.querySelector('#add-cust-back-btn').addEventListener('click', goBack);
  container.querySelector('#cancel-add-customer-btn').addEventListener('click', goBack);

  // Switch vehicle type (Bike | Scooter | Car)
  container.querySelectorAll('[data-select-vtype]').forEach((btn) => {
    btn.addEventListener('click', () => {
      syncDraftFromInputs(container);
      const idx = Number(btn.getAttribute('data-vindex'));
      const newType = btn.getAttribute('data-select-vtype');
      if (draftCustomer.vehicles[idx]) {
        draftCustomer.vehicles[idx].type = newType;
      }
      renderAddCustomerPage(container, params);
    });
  });

  // Add Another Vehicle
  container.querySelector('#add-another-vehicle-btn').addEventListener('click', () => {
    syncDraftFromInputs(container);
    draftCustomer.vehicles.push(createEmptyVehicle('Scooter'));
    renderAddCustomerPage(container, params);
    showToast(`Added Vehicle ${draftCustomer.vehicles.length} entry.`);
  });

  // Remove Vehicle
  container.querySelectorAll('[data-remove-vehicle]').forEach((btn) => {
    btn.addEventListener('click', () => {
      syncDraftFromInputs(container);
      const idx = Number(btn.getAttribute('data-remove-vehicle'));
      if (draftCustomer.vehicles.length > 1) {
        draftCustomer.vehicles.splice(idx, 1);
        renderAddCustomerPage(container, params);
      }
    });
  });

  // Submit / Save Customer
  container.querySelector('#add-customer-page-form').addEventListener('submit', (e) => {
    e.preventDefault();
    syncDraftFromInputs(container);

    const errBox = container.querySelector('#add-customer-error');
    errBox.hidden = true;

    const name = String(draftCustomer.name || '').trim();
    const digits = String(draftCustomer.phone || '').replace(/\D/g, '');
    const email = String(draftCustomer.email || '').trim();

    if (!name) {
      errBox.textContent = 'Customer Full Name is required.';
      errBox.hidden = false;
      return;
    }

    if (digits.length < 10) {
      errBox.textContent = 'Please enter a valid 10-digit mobile number.';
      errBox.hidden = false;
      return;
    }

    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errBox.textContent = 'Please enter a valid email address.';
      errBox.hidden = false;
      return;
    }

    for (let i = 0; i < draftCustomer.vehicles.length; i++) {
      const v = draftCustomer.vehicles[i];
      if (!String(v.regNumber || '').trim()) {
        errBox.textContent = `Please enter the registration number for Vehicle ${i + 1}.`;
        errBox.hidden = false;
        return;
      }
      if (!String(v.brand || '').trim()) {
        errBox.textContent = `Please enter the Brand for Vehicle ${i + 1}.`;
        errBox.hidden = false;
        return;
      }
    }

    const isEditingCustomer = Boolean(draftCustomer && draftCustomer.id);
    const result = AppState.saveCustomerWithVehicles(draftCustomer);
    if (!result.ok) {
      errBox.textContent = result.error;
      errBox.hidden = false;
      showToast(result.error, 'danger');
      return;
    }

    draftCustomer = null;
    showToast(isEditingCustomer ? 'Customer details updated successfully' : 'Customer added successfully');

    if (params.returnTo === 'new-service') {
      Router.navigate('new-service', { customerId: result.customer.id });
    } else if (params.returnTo === 'create-bill') {
      Router.navigate('create-bill', { customerId: result.customer.id });
    } else {
      Router.navigate('customer-profile', { customerId: result.customer.id });
    }
  });
}

// GarageFlow — Customers Directory (js/pages/customers.js)

function renderCustomersPage(container) {
  const { customers, jobs } = AppState.data;
  const query = (AppState.filters.customersQuery || '').trim().toLowerCase();
  const statusFilter = AppState.filters.customersStatus || 'All';

  const filteredCustomers = customers.filter((c) => {
    const job = jobs.find((j) => j.id === c.currentJobId) || { status: 'Ready' };
    const matchesStatus = statusFilter === 'All' || job.status === statusFilter;
    const matchesVehicle = (c.vehicles || []).some(
      (v) =>
        v.regNumber.toLowerCase().includes(query) ||
        `${v.brand} ${v.model}`.toLowerCase().includes(query)
    );
    const matchesQuery =
      !query ||
      c.name.toLowerCase().includes(query) ||
      c.id.toLowerCase().includes(query) ||
      c.phone.toLowerCase().includes(query) ||
      matchesVehicle ||
      (c.currentJobId && c.currentJobId.toLowerCase().includes(query));
    return matchesStatus && matchesQuery;
  });

  const totalVehiclesCount = customers.reduce((sum, c) => sum + (c.vehicles ? c.vehicles.length : 1), 0);

  container.innerHTML = `
    <div class="page-container">
      ${renderTopHeader({
        eyebrow: null,
        title: 'Customers',
        subtitle: 'Manage your customers & vehicles'
      })}

      <!-- Search & Filter Bar -->
      <div class="search-bar-wrap">
        <div class="search-input-box">
          ${ICONS.search}
          <input
            type="search"
            id="customer-search-input"
            class="search-input"
            placeholder="Search name, phone or vehicle..."
            value="${escapeHtml(AppState.filters.customersQuery)}"
            aria-label="Search customers by name, phone or vehicle"
          />
        </div>
        <button
          type="button"
          class="filter-btn ${statusFilter !== 'All' ? 'active' : ''}"
          id="customer-filter-btn"
          aria-label="Filter customers by service status"
        >
          ${ICONS.filter}
        </button>
      </div>

      <!-- Counts & Add Customer CTA Row -->
      <div class="customers-toolbar">
        <div class="customer-counts-row">
          <div class="count-pill">
            <span style="color:var(--color-primary); display:inline-flex;">${ICONS.users}</span>
            <span><strong style="color:var(--color-text);">${customers.length}</strong> Customers</span>
          </div>

          <div class="count-pill">
            <span style="color:var(--color-primary); display:inline-flex;">${ICONS.car}</span>
            <span><strong style="color:var(--color-text);">${totalVehiclesCount}</strong> Vehicles</span>
          </div>
        </div>

        <button type="button" class="btn btn-primary btn-pill" id="add-customer-btn">
          ${ICONS.plus}
          <span>Add Customer</span>
        </button>
      </div>

      <!-- Customer Cards -->
      ${
        filteredCustomers.length === 0
          ? `
        <div class="card empty-state">
          <p style="font-weight:700; color:var(--color-text); margin-bottom:4px;">No customers match your search</p>
          <p style="font-size:var(--text-xs); margin-bottom:14px;">Try searching by another name, phone number, or registration.</p>
          <button type="button" class="btn btn-soft-blue" id="reset-customer-search-btn">Reset Filters</button>
        </div>
      `
          : `
        <div class="cards-grid-responsive">
          ${filteredCustomers.map((customer) => renderCustomerCard(customer, jobs)).join('')}
        </div>
      `
      }
    </div>
  `;

  bindCustomersEvents(container);
}

function renderCustomerCard(customer, jobs) {
  const currentJob = jobs.find((j) => j.id === customer.currentJobId) || null;
  const activeStatus = currentJob ? currentJob.status : 'Ready';
  const extraVehicleCount = Math.max(0, (customer.vehicles || []).length - 1);

  let statusDescription = 'Ready for customer pickup';
  if (!currentJob) {
    statusDescription = 'Registered customer';
  } else if (activeStatus === 'In-progress') {
    statusDescription = `Expected: ${currentJob.expectedDelivery || 'Today, 5:30 PM'}`;
  } else if (activeStatus === 'Received') {
    statusDescription = 'Vehicle inspection pending';
  }

  return `
    <article
      class="card card-interactive customer-card"
      data-customer-card="${customer.id}"
      role="button"
      tabindex="0"
      aria-label="Open customer profile for ${escapeHtml(customer.name)}"
    >
      <!-- 1. Top Section: Avatar + Name & Phone + Right Navigation Chevron -->
      <div class="customer-card-top">
        <div class="customer-card-identity">
          <div class="avatar avatar-lg">${escapeHtml(customer.initials)}</div>
          <div class="customer-name-group">
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <h2 class="customer-name">${escapeHtml(customer.name)}</h2>
              <span style="font-size:11px; font-weight:700; color:var(--color-muted);">${escapeHtml(customer.id)}</span>
            </div>
            <div class="customer-phone">
              ${ICONS.phone}
              <span>${escapeHtml(customer.phone)}</span>
            </div>
          </div>
        </div>
        <span class="text-muted">${ICONS.chevronRight}</span>
      </div>

      <!-- 2. Vehicle Information: Full-Width Compact Panel -->
      <div class="customer-vehicle-panel">
        <span class="customer-vehicle-icon">
          ${getVehicleIcon(customer.vehicleType)}
        </span>
        <div class="customer-vehicle-details">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
            <span class="customer-vehicle-reg">${escapeHtml(customer.vehicleNumber)}</span>
            ${
              extraVehicleCount > 0
                ? `<span class="job-id-pill" style="padding:2px 7px; font-size:10px;">+${extraVehicleCount} more</span>`
                : ''
            }
          </div>
          <div class="customer-vehicle-model">${escapeHtml(customer.vehicleModel)}</div>
        </div>
      </div>

      <!-- 3. Service Progress Section -->
      <div class="customer-progress-box">
        <div class="customer-status-summary">
          ${renderStatusBadge(activeStatus)}
          <span style="font-size:var(--text-xs); color:var(--color-text-secondary); font-weight:600;">
            ${escapeHtml(statusDescription)}
          </span>
        </div>
        ${renderServiceStepper(activeStatus, 'In-progress')}
      </div>

      <!-- 4. Bottom Information Section -->
      <div class="customer-card-footer">
        <div class="customer-meta-group">
          <span class="customer-meta-item">
            ${ICONS.calendar}
            <span>Last: <strong>${escapeHtml(customer.lastServiceDate)}</strong></span>
          </span>
          <span class="customer-meta-item">
            ${ICONS.calendar}
            <span><strong>${customer.totalVisits}</strong> visits</span>
          </span>
        </div>

        ${
          customer.currentJobId
            ? `<span class="job-id-pill">${escapeHtml(customer.currentJobId)}</span>`
            : `<span class="job-id-pill">${customer.vehicles.length} vehicle(s)</span>`
        }
      </div>
    </article>
  `;
}

function bindCustomersEvents(container) {
  const searchInput = container.querySelector('#customer-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      AppState.filters.customersQuery = e.target.value;
      renderCustomersPage(container);
      const refocused = container.querySelector('#customer-search-input');
      if (refocused) {
        refocused.focus();
        refocused.setSelectionRange(refocused.value.length, refocused.value.length);
      }
    });
  }

  const resetBtn = container.querySelector('#reset-customer-search-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      AppState.filters.customersQuery = '';
      AppState.filters.customersStatus = 'All';
      renderCustomersPage(container);
    });
  }

  const filterBtn = container.querySelector('#customer-filter-btn');
  if (filterBtn) {
    filterBtn.addEventListener('click', () => {
      Modal.open({
        title: 'Filter Customers by Active Service Status',
        bodyHtml: `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${['All', 'Received', 'In-progress', 'Ready']
              .map(
                (st) => `
              <button type="button" class="btn ${AppState.filters.customersStatus === st ? 'btn-primary' : 'btn-outline'} btn-block" data-cust-status="${st}">
                ${st === 'All' ? 'All Customers' : `Status: ${st}`}
              </button>
            `
              )
              .join('')}
          </div>
        `,
        onMount(modalEl) {
          modalEl.querySelectorAll('[data-cust-status]').forEach((b) => {
            b.addEventListener('click', () => {
              AppState.filters.customersStatus = b.getAttribute('data-cust-status');
              Modal.close();
              renderCustomersPage(container);
            });
          });
        }
      });
    });
  }

  const addCustomerBtn = container.querySelector('#add-customer-btn');
  if (addCustomerBtn) {
    addCustomerBtn.addEventListener('click', () => {
      Router.navigate('add-customer');
    });
  }

  container.querySelectorAll('[data-customer-card]').forEach((card) => {
    const openProfile = () => {
      const customerId = card.getAttribute('data-customer-card');
      Router.navigate('customer-profile', { customerId });
    };
    card.addEventListener('click', openProfile);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openProfile();
      }
    });
  });
}

function openAddVehicleModal(customer, onAdded) {
  let selectedType = 'Scooter';

  Modal.open({
    title: `Add Vehicle to ${customer.name}`,
    bodyHtml: `
      <form id="modal-add-vehicle-form" novalidate>
        <div class="vehicle-type-selector">
          ${['Bike', 'Scooter', 'Car']
            .map(
              (t) => `
            <button type="button" class="vehicle-type-btn ${selectedType === t ? 'active' : ''}" data-modal-vtype="${t}">
              ${getVehicleIcon(t)}
              <span>${t}</span>
            </button>
          `
            )
            .join('')}
        </div>

        <div class="form-group">
          <label class="form-label" for="mv-reg">Vehicle Registration Number <span class="required">*</span></label>
          <input type="text" id="mv-reg" class="form-input" placeholder="e.g. MH12 AB 9876" required />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="mv-brand">Brand <span class="required">*</span></label>
            <input type="text" id="mv-brand" class="form-input" placeholder="e.g. Honda" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="mv-model">Model <span class="required">*</span></label>
            <input type="text" id="mv-model" class="form-input" placeholder="e.g. Activa 6G" required />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="mv-year">Year <span class="optional">(Optional)</span></label>
            <input type="text" id="mv-year" class="form-input" placeholder="e.g. 2024" maxlength="4" />
          </div>
          <div class="form-group">
            <label class="form-label" for="mv-notes">Notes <span class="optional">(Optional)</span></label>
            <input type="text" id="mv-notes" class="form-input" placeholder="Optional details" />
          </div>
        </div>

        <div id="mv-error" class="form-error-msg" hidden></div>

        <div style="display:flex; gap:10px; margin-top:14px;">
          <button type="button" class="btn btn-outline btn-block" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save Vehicle</button>
        </div>
      </form>
    `,
    onMount(modalEl) {
      modalEl.querySelectorAll('[data-modal-vtype]').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedType = btn.getAttribute('data-modal-vtype');
          modalEl.querySelectorAll('[data-modal-vtype]').forEach((b) => {
            b.classList.toggle('active', b.getAttribute('data-modal-vtype') === selectedType);
          });
        });
      });

      modalEl.querySelector('#modal-add-vehicle-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const errEl = modalEl.querySelector('#mv-error');
        errEl.hidden = true;

        const regNumber = modalEl.querySelector('#mv-reg').value.trim();
        const brand = modalEl.querySelector('#mv-brand').value.trim();
        const model = modalEl.querySelector('#mv-model').value.trim();
        const year = modalEl.querySelector('#mv-year').value.trim();
        const notes = modalEl.querySelector('#mv-notes').value.trim();

        if (!regNumber || !brand || !model) {
          errEl.textContent = 'Registration number, brand, and model are required.';
          errEl.hidden = false;
          return;
        }

        const res = AppState.addVehicleToCustomer(customer.id, {
          type: selectedType,
          regNumber,
          brand,
          model,
          year,
          notes
        });

        if (!res.ok) {
          errEl.textContent = res.error;
          errEl.hidden = false;
          return;
        }

        Modal.close();
        showToast(`Added ${res.vehicle.regNumber} (${res.vehicle.brand} ${res.vehicle.model}) to ${customer.name}.`);
        if (typeof onAdded === 'function') {
          onAdded(res.vehicle);
        }
      });
    }
  });
}

function bindCustomerProfileEvents(container, customer, currentJob) {
  container.querySelector('#profile-back-btn').addEventListener('click', () => Router.navigate('customers'));

  container.querySelector('#edit-customer-profile-btn').addEventListener('click', () => {
    Router.navigate('add-customer', { editCustomerId: customer.id, returnTo: 'customer-profile', customerId: customer.id });
  });

  // Add Vehicle to existing customer
  const addVehicleBtn = container.querySelector('#profile-add-vehicle-btn');
  if (addVehicleBtn) {
    addVehicleBtn.addEventListener('click', () => {
      openAddVehicleModal(customer, () => {
        renderCustomerProfilePage(container, { customerId: customer.id });
      });
    });
  }

  // Segmented status buttons (Received | In-progress | Ready)
  container.querySelectorAll('[data-set-job-status]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (!currentJob) return;
      const newStatus = btn.getAttribute('data-set-job-status');
      AppState.updateJobStatus(currentJob.id, newStatus);
      showToast('Service status updated successfully');
      renderCustomerProfilePage(container, { customerId: customer.id });
    });
  });

  // New Service Visit for this customer
  container.querySelector('#profile-new-visit-btn').addEventListener('click', () => {
    Router.navigate('new-service', { customerId: customer.id });
  });

  // Create or Edit Bill for this customer (Admin only; Ready services only)
  const createBillBtn = container.querySelector('#profile-create-bill-btn');
  if (createBillBtn) {
    createBillBtn.addEventListener('click', () => {
      if (AppState.user && AppState.user.role === 'staff') return;
      const existingInv = currentJob
        ? AppState.getInvoiceByJobId(currentJob.id, currentJob.invoiceId)
        : null;
      if (existingInv) {
        Router.navigate('create-bill', {
          editInvoiceId: existingInv.id,
          returnTo: 'customer-profile',
          customerId: customer.id
        });
      } else {
        Router.navigate('create-bill', {
          customerId: customer.id,
          jobId: currentJob ? currentJob.id : ''
        });
      }
    });
  }

  // Clicking a Service History row opens the linked invoice or creates a bill for Admin only
  container.querySelectorAll('[data-visit-job]').forEach((row) => {
    row.addEventListener('click', () => {
      if (AppState.user && AppState.user.role === 'staff') {
        return;
      }
      const invoiceId = row.getAttribute('data-visit-invoice');
      const jobId = row.getAttribute('data-visit-job');
      const matchingInvoice = AppState.data.invoices.find(
        (inv) => inv.id === invoiceId || inv.jobId === jobId
      );
      if (matchingInvoice) {
        Router.navigate('invoice-preview', { invoiceId: matchingInvoice.id });
      } else {
        Router.navigate('create-bill', { customerId: customer.id, jobId });
      }
    });
  });
}

function syncVisitInputs(container) {
  const cEl = container.querySelector('#visit-complaint');
  const nEl = container.querySelector('#visit-notes');
  const sEl = container.querySelector('#visit-staff');
  const dEl = container.querySelector('#visit-delivery');
  const oEl = container.querySelector('#visit-odometer');
  const vEl = container.querySelector('#visit-vehicle-select');

  if (cEl) visitState.complaint = cEl.value;
  if (nEl) visitState.inspectionNotes = nEl.value;
  if (sEl) visitState.staffId = sEl.value;
  if (dEl) visitState.expectedDelivery = dEl.value;
  if (oEl) visitState.odometer = oEl.value;
  if (vEl) visitState.selectedVehicleId = vEl.value;
}

function bindNewServiceVisitEvents(container, selectedCustomer) {
  const goBack = () => Router.navigate('services');
  container.querySelector('#new-srv-back-btn').addEventListener('click', goBack);
  container.querySelector('#cancel-new-visit-btn').addEventListener('click', goBack);

  // Live customer search
  const searchInput = container.querySelector('#visit-customer-search');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      syncVisitInputs(container);
      visitState.searchQuery = e.target.value;
      renderNewServiceVisitPage(container);
      const refocused = container.querySelector('#visit-customer-search');
      if (refocused) {
        refocused.focus();
        refocused.setSelectionRange(refocused.value.length, refocused.value.length);
      }
    });
  }

  // Pick customer from search results
  container.querySelectorAll('[data-pick-customer]').forEach((btn) => {
    btn.addEventListener('click', () => {
      syncVisitInputs(container);
      visitState.selectedCustomerId = btn.getAttribute('data-pick-customer');
      visitState.selectedVehicleId = null;
      visitState.searchQuery = '';
      renderNewServiceVisitPage(container);
    });
  });

  // Vehicle dropdown change & Universal Vehicle Selection Popup (Image Reference 02)
  const vehSelect = container.querySelector('#visit-vehicle-select');
  if (vehSelect) {
    vehSelect.addEventListener('change', (e) => {
      syncVisitInputs(container);
      visitState.selectedVehicleId = e.target.value;
      renderNewServiceVisitPage(container);
    });
    vehSelect.addEventListener('mousedown', (e) => {
      if (selectedCustomer.vehicles && selectedCustomer.vehicles.length > 0) {
        e.preventDefault();
        syncVisitInputs(container);
        SelectionPopup.open({
          title: 'Select Customer Vehicle',
          searchable: selectedCustomer.vehicles.length > 3,
          searchPlaceholder: 'Search by vehicle model or registration...',
          selectedValues: [visitState.selectedVehicleId || selectedCustomer.vehicles[0].id],
          items: selectedCustomer.vehicles.map((v) => ({
            value: v.id,
            label: `${v.brand} ${v.model}`.trim(),
            sublabel: `${v.regNumber} • ${v.type}`,
            icon: getVehicleIcon(v.type)
          })),
          onConfirm(chosenVehId) {
            if (chosenVehId) {
              visitState.selectedVehicleId = chosenVehId;
              renderNewServiceVisitPage(container);
            }
          }
        });
      }
    });
  }

  // Expected Delivery Date & Time Modal (Image Reference 01)
  const deliveryPickerBtn = container.querySelector('#visit-delivery-picker-btn');
  if (deliveryPickerBtn) {
    deliveryPickerBtn.addEventListener('click', () => {
      syncVisitInputs(container);
      openExpectedDeliveryModal(visitState.expectedDelivery, (formattedDelivery) => {
        visitState.expectedDelivery = formattedDelivery;
        const hiddenInput = container.querySelector('#visit-delivery');
        const dispText = container.querySelector('#visit-delivery-display-text');
        if (hiddenInput) hiddenInput.value = formattedDelivery;
        if (dispText) dispText.textContent = formattedDelivery;
      });
    });
  }

  // Add Vehicle to Existing Customer
  container.querySelector('#visit-add-vehicle-btn').addEventListener('click', () => {
    syncVisitInputs(container);
    openAddVehicleModal(selectedCustomer, (addedVehicle) => {
      visitState.selectedVehicleId = addedVehicle.id;
      renderNewServiceVisitPage(container);
    });
  });

  // Open Reusable Customer Selection Popup (Image Reference 02)
  const openCustPopupBtn = container.querySelector('#visit-open-customer-popup-btn');
  if (openCustPopupBtn) {
    openCustPopupBtn.addEventListener('click', () => {
      syncVisitInputs(container);
      SelectionPopup.open({
        title: 'Select Customer',
        searchable: true,
        searchPlaceholder: 'Search by name, number or keyword...',
        selectedValues: [selectedCustomer.id],
        items: AppState.data.customers.map((c) => ({
          value: c.id,
          label: c.name,
          sublabel: `${c.phone} • ${c.id}`,
          icon: ICONS.users
        })),
        onConfirm(chosenId) {
          if (chosenId) {
            visitState.selectedCustomerId = chosenId;
            visitState.selectedVehicleId = null;
            renderNewServiceVisitPage(container);
          }
        }
      });
    });
  }

  // Open Reusable Multi-Staff Selection Popup (Optional — Image Reference 02)
  const staffPopupBtn = container.querySelector('#visit-staff-popup-btn');
  if (staffPopupBtn) {
    staffPopupBtn.addEventListener('click', () => {
      syncVisitInputs(container);
      const eligibleStaff = AppState.data.staff.filter((s) => isStaffAccountEligibleForAssignment(s));
      const eligibleIdsSet = new Set(eligibleStaff.map((s) => s.id));
      SelectionPopup.open({
        title: 'Assign Mechanic / Staff (Optional)',
        multiple: true,
        searchable: true,
        allowClear: true,
        searchPlaceholder: 'Search by name, number or keyword...',
        emptyMessage: 'No active staff members available for assignment.',
        selectedValues: (visitState.staffIds || []).filter((id) => eligibleIdsSet.has(id)),
        items: eligibleStaff.map((s) => ({
          value: s.id,
          label: s.name,
          sublabel: `${s.role} • ${s.phone}`,
          badge: s.status,
          icon: ICONS.wrench
        })),
        onConfirm(chosenIds) {
          const requestedIds = Array.isArray(chosenIds) ? chosenIds : [];
          const validIds = requestedIds.filter((id) => {
            const member = AppState.data.staff.find((s) => s.id === id);
            return isStaffAccountEligibleForAssignment(member);
          });
          if (validIds.length !== requestedIds.length) {
            showToast('Only staff members with Active account status can be assigned.', 'error');
          }
          visitState.staffIds = validIds;
          visitState.staffId = visitState.staffIds[0] || '';
          renderNewServiceVisitPage(container);
        }
      });
    });
  }

  // Add New Customer
  container.querySelector('#visit-add-new-customer-btn').addEventListener('click', () => {
    syncVisitInputs(container);
    Router.navigate('add-customer', { returnTo: 'new-service' });
  });

  // Submit New Service Visit
  container.querySelector('#new-service-visit-form').addEventListener('submit', (e) => {
    e.preventDefault();
    syncVisitInputs(container);
    const errEl = container.querySelector('#new-visit-error');
    errEl.hidden = true;

    if (!visitState.complaint.trim()) {
      errEl.textContent = 'Please enter the customer complaint or requested service work.';
      errEl.hidden = false;
      return;
    }

    const staffBtn = container.querySelector('#visit-staff-popup-btn');
    const res = AppState.createServiceVisit({
      customerId: selectedCustomer.id,
      vehicleId: visitState.selectedVehicleId,
      complaint: visitState.complaint,
      inspectionNotes: visitState.inspectionNotes,
      staffIds: AppState.data.staff.length > 0 ? visitState.staffIds || [] : [],
      staffId: (visitState.staffIds && visitState.staffIds[0]) || '',
      expectedDelivery: visitState.expectedDelivery,
      odometer: visitState.odometer
    });

    if (!res.ok) {
      errEl.textContent = res.error;
      errEl.hidden = false;
      return;
    }

    // Reset form fields for next entry
    visitState.complaint = '';
    visitState.inspectionNotes = '';
    showToast('Service created successfully');
    Router.navigate('services');
  });
}

// ==========================================================================
// GarageFlow — Service Tracking Screen (js/pages/services.js)
// Enforces 3 mutually exclusive statuses: Received | In-progress | Ready
// ==========================================================================
function renderServicesPage(container) {
  const { jobs } = AppState.data;
  const activeStatus = AppState.filters.servicesStatus || 'All';
  const query = (AppState.filters.servicesQuery || '').trim().toLowerCase();

  // Summary counts for the 3 statuses
  const inProgressCount = jobs.filter((j) => j.status === 'In-progress').length;
  const readyCount = jobs.filter((j) => j.status === 'Ready').length;
  const receivedCount = jobs.filter((j) => j.status === 'Received').length;
  const pad2 = (n) => String(n).padStart(2, '0');

  // Filter jobs
  const filteredJobs = jobs.filter((job) => {
    const matchesStatus = activeStatus === 'All' || job.status === activeStatus;
    const matchesQuery =
      !query ||
      job.id.toLowerCase().includes(query) ||
      job.vehicleNumber.toLowerCase().includes(query) ||
      job.vehicleModel.toLowerCase().includes(query) ||
      job.customerName.toLowerCase().includes(query) ||
      job.complaint.toLowerCase().includes(query);
    return matchesStatus && matchesQuery;
  });

  container.innerHTML = `
    <div class="page-container">
      ${renderTopHeader({
        eyebrow: null,
        title: 'Service Tracking',
        subtitle: 'Track every vehicle, from arrival to delivery'
      })}

      <!-- 3 Clean White Service Summary Cards in ONE horizontal row -->
      <div class="dashboard-row-3">
        <div class="dashboard-stat-card white-summary-card clickable ${activeStatus === 'In-progress' ? 'active-card-outline' : ''}" data-status-pill="In-progress">
          <span class="dashboard-stat-icon summary-icon-badge blue">${ICONS.clock}</span>
          <span class="dashboard-stat-label summary-metric-label">In-progress</span>
          <span class="dashboard-stat-value summary-metric-value">${pad2(inProgressCount)}</span>
        </div>

        <div class="dashboard-stat-card white-summary-card clickable ${activeStatus === 'Ready' ? 'active-card-outline' : ''}" data-status-pill="Ready">
          <span class="dashboard-stat-icon summary-icon-badge green">${ICONS.check}</span>
          <span class="dashboard-stat-label summary-metric-label">Ready</span>
          <span class="dashboard-stat-value summary-metric-value">${pad2(readyCount)}</span>
        </div>

        <div class="dashboard-stat-card white-summary-card clickable ${activeStatus === 'Received' ? 'active-card-outline' : ''}" data-status-pill="Received">
          <span class="dashboard-stat-icon summary-icon-badge orange">${ICONS.hourglass}</span>
          <span class="dashboard-stat-label summary-metric-label">Received</span>
          <span class="dashboard-stat-value summary-metric-value">${pad2(receivedCount)}</span>
        </div>
      </div>

      <!-- Search Input & Filter Button -->
      <div class="search-bar-wrap">
        <div class="search-input-box">
          ${ICONS.search}
          <input
            type="search"
            id="service-search-input"
            class="search-input"
            placeholder="Search vehicle, customer or job ID"
            value="${escapeHtml(AppState.filters.servicesQuery)}"
            aria-label="Search vehicle, customer or job ID"
          />
        </div>
        <button
          type="button"
          class="filter-btn ${activeStatus !== 'All' ? 'active' : ''}"
          id="service-filter-modal-btn"
          aria-label="Filter services by status"
        >
          ${ICONS.filter}
        </button>
      </div>

      <!-- Status Filter Pills & New Service Entry CTA -->
      <div class="filter-pills-row">
        <div class="filter-pills" role="tablist" aria-label="Filter jobs by status">
          ${['All', 'Received', 'In-progress', 'Ready']
            .map(
              (status) => `
            <button
              type="button"
              class="filter-pill ${activeStatus === status ? 'active' : ''}"
              data-status-pill="${status}"
            >
              ${status}
            </button>
          `
            )
            .join('')}
        </div>

        <button type="button" class="btn btn-primary btn-pill" id="new-service-entry-btn">
          ${ICONS.plus}
          <span>New Service Entry</span>
        </button>
      </div>

      <!-- Service Cards Grid -->
      ${
        filteredJobs.length === 0
          ? `
        <div class="card empty-state">
          <p style="font-weight:700; color:var(--color-text); margin-bottom:4px;">No matching service jobs found</p>
          <p style="font-size:var(--text-xs); margin-bottom:14px;">Try clearing your search or switching the status filter.</p>
          <button type="button" class="btn btn-soft-blue" id="reset-service-filters-btn">Show All Service Jobs</button>
        </div>
      `
          : `
        <div class="cards-grid-responsive">
          ${filteredJobs.map((job) => renderServiceJobCard(job)).join('')}
        </div>
      `
      }
    </div>
  `;

  bindServicesEvents(container);
}

  const nextStatusMap = {
    Received: 'In-progress',
    'In-progress': 'Ready',

  return `
    <article class="card card-interactive" data-view-job-customer="${job.customerId}">
      <!-- Card Top Row: Job ID + Status Pill + Elapsed Time -->
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="card-title">${escapeHtml(job.id)}</span>
          ${renderStatusBadge(job.status)}
        </div>
        <div style="display:flex; align-items:center; gap:5px; font-size:var(--text-xs); color:var(--color-muted); font-weight:600;">
          ${ICONS.clock}
          <span>${escapeHtml(job.elapsedTime)}</span>
          ${ICONS.chevronRight}
        </div>
      </div>

      <!-- Responsive Vehicle & Customer Panel -->
      <div class="service-card-grid">
        <div class="service-card-vehicle">
          <div class="vehicle-icon-box">${getVehicleIcon(job.vehicleType)}</div>
          <div style="min-width:0;">
            <div style="font-weight:800; font-size:0.9375rem; color:var(--color-text);">${escapeHtml(job.vehicleNumber)}</div>
            <div style="font-size:var(--text-xs); color:var(--color-muted);">${escapeHtml(job.vehicleModel)}</div>
          </div>
        </div>

        <div class="service-card-customer">
          <div style="min-width:0;">
            <div style="display:flex; align-items:center; gap:6px; font-weight:700; font-size:var(--text-sm); color:var(--color-text);">
              <span style="color:#475569; display:inline-flex;">${ICONS.user}</span>
              <span>${escapeHtml(job.customerName)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px; font-size:var(--text-xs); color:var(--color-muted); margin-top:2px;">
              ${ICONS.phone}
              <span>${escapeHtml(job.customerPhone)}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Complaint & Assigned Staff -->
      <div style="display:flex; align-items:flex-start; gap:8px; font-size:var(--text-sm); margin-bottom:10px;">
        <span style="color:var(--color-primary); display:inline-flex; margin-top:2px;">${ICONS.wrench}</span>
        <span><strong>Complaint:</strong> ${escapeHtml(job.complaint)}</span>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
        <div style="display:flex; align-items:center; gap:8px; font-size:var(--text-xs); color:var(--color-text-secondary);">
          <span class="avatar avatar-xs">${escapeHtml(job.assignedStaffInitials)}</span>
          <span><strong>${escapeHtml(job.assignedStaffShort)}</strong> • ${escapeHtml(job.assignedStaffRole)}</span>
        </div>

        <button
          type="button"
          class="btn btn-soft-blue"
          style="padding:4px 10px; font-size:11px; min-height:28px; border-radius:999px;"
          data-advance-job="${job.id}"
          data-next-status="${nextStatus}"
        >
          Mark ${nextStatus}
        </button>
      </div>

      <!-- 3-Step Progress Tracker -->
      ${renderServiceStepper(job.status, 'In-progress')}

      <!-- Footer: Expected Delivery & View Details -->
      <div
        style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-top:10px; margin-top:6px; border-top:1px solid var(--color-border-subtle); font-size:var(--text-xs);"
      >
        <div style="display:flex; align-items:center; gap:6px; color:var(--color-text-secondary); font-weight:500;">
          ${ICONS.calendar}
          <span>Expected: <strong>${escapeHtml(job.expectedDelivery)}</strong></span>
        </div>

        <span
          style="color:var(--color-primary); font-weight:700; display:inline-flex; align-items:center; gap:3px; margin-left:auto;"
        >
          <span>View Details</span>
          ${ICONS.chevronRight}
        </span>
      </div>
    </article>
  `;
}

function bindServicesEvents(container) {
  const searchInput = container.querySelector('#service-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      AppState.filters.servicesQuery = e.target.value;
      renderServicesPage(container);
      const refocused = container.querySelector('#service-search-input');
      if (refocused) {
        refocused.focus();
        refocused.setSelectionRange(refocused.value.length, refocused.value.length);
      }
    });
  }

  container.querySelectorAll('[data-status-pill]').forEach((el) => {
    el.addEventListener('click', () => {
      AppState.filters.servicesStatus = el.getAttribute('data-status-pill');
      renderServicesPage(container);
    });
  });

  const resetBtn = container.querySelector('#reset-service-filters-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      AppState.filters.servicesStatus = 'All';
      AppState.filters.servicesQuery = '';
      renderServicesPage(container);
    });
  }

  const filterModalBtn = container.querySelector('#service-filter-modal-btn');
  if (filterModalBtn) {
    filterModalBtn.addEventListener('click', () => {
      Modal.open({
        title: 'Filter Service Jobs',
        bodyHtml: `
          <p style="font-size:var(--text-sm); color:var(--color-muted); margin-bottom:12px;">Select one of the three service stages:</p>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${['All', 'Received', 'In-progress', 'Ready']
              .map(
                (st) => `
              <button type="button" class="btn ${AppState.filters.servicesStatus === st ? 'btn-primary' : 'btn-outline'} btn-block" data-modal-filter="${st}">
                ${st === 'All' ? 'All Workshop Jobs' : st}
              </button>
            `
              )
              .join('')}
          </div>
        `,
        onMount(modalEl) {
          modalEl.querySelectorAll('[data-modal-filter]').forEach((b) => {
            b.addEventListener('click', () => {
              AppState.filters.servicesStatus = b.getAttribute('data-modal-filter');
              Modal.close();
              renderServicesPage(container);
            });
          });
        }
      });
    });
  }

  // New Service Entry button -> navigates to New Service Visit screen (Image 2)
  const newServiceBtn = container.querySelector('#new-service-entry-btn');
  if (newServiceBtn) {
    newServiceBtn.addEventListener('click', () => {
      Router.navigate('new-service');
    });
  }

  // Quick status advance button inside job card
  container.querySelectorAll('[data-advance-job]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const jobId = btn.getAttribute('data-advance-job');
      const nextStatus = btn.getAttribute('data-next-status');
      AppState.updateJobStatus(jobId, nextStatus);
      showToast('Service status updated successfully');
      renderServicesPage(container);
    });
  });

  container.querySelectorAll('[data-view-job-customer]').forEach((card) => {
    card.addEventListener('click', () => {
      const customerId = card.getAttribute('data-view-job-customer');
      Router.navigate('customer-profile', { customerId });
    });
  });
}

// --- js/pages/add-staff.js ---
// ==========================================================================
// GarageFlow — IMAGE 3: Add / Edit Staff Screen (js/pages/add-staff.js)
// Implements Section 9 & Image 3:
// - Staff Details: Full Name, Mobile Number (+91), Email, Role, Joining Date, Address
// - Login Access: Enable Staff Login toggle, Approved Login Email, Access Status
// - Staff Access Permissions: Strictly 3 options (Home, Service Tracking, Customer)
// ==========================================================================
function renderAddStaffPage(container, params = {}) {
  const editStaff = params.staffId ? AppState.getStaffById(params.staffId) : null;

  const todayIso = getLocalTodayIso();
  const todayFormatted = parseSelectedDateMeta(todayIso).formattedShort;

  const state = {
    id: editStaff ? editStaff.id : null,
    name: editStaff ? editStaff.name : '',
    phone: editStaff ? editStaff.phone.replace(/^\+91\s*/, '') : '',
    email: editStaff ? editStaff.email : '',
    role: editStaff ? editStaff.role : 'Mechanic',
    joiningDateIso: editStaff ? (editStaff.joiningDateIso || todayIso) : todayIso,
    joiningDate: editStaff ? (editStaff.joiningDate || todayFormatted) : todayFormatted,
    address: editStaff ? (editStaff.address || '') : '',
    enableLogin: editStaff ? Boolean(editStaff.enableLogin) : true,
    approvedEmail: editStaff ? editStaff.approvedEmail || editStaff.email : '',
    status: editStaff ? editStaff.status : 'Pending',
    permissions: editStaff && Array.isArray(editStaff.permissions)
      ? [...editStaff.permissions]
      : ['Home', 'Service Tracking', 'Customer']
  };

  function renderForm() {
    const accessStatusLabel = !state.enableLogin || state.status === 'Suspended' || state.status === 'Inactive'
      ? 'Suspended'
      : state.status === 'Active'
      ? 'Active'
      : state.status === 'Approved – Setup Pending'
      ? 'Approved – Setup Pending'
      : 'Pending Approval';

    const badgeClass = accessStatusLabel === 'Suspended'
      ? 'badge-unpaid'
      : accessStatusLabel === 'Active'
      ? 'badge-active'
      : accessStatusLabel === 'Approved – Setup Pending'
      ? 'badge-in-progress'
      : 'badge-pending';

    container.innerHTML = `
      <div class="page-container">
        <!-- Header -->
        <header class="subpage-header">
          <div class="subpage-header-left">
            <button
              type="button"
              class="back-btn"
              id="add-staff-back-btn"
              aria-label="Back to Staff list"
            >
              ${ICONS.chevronLeft}
            </button>
            <div>
              <h1 class="page-title">${editStaff ? 'Edit Staff' : 'Add Staff'}</h1>
              <p class="page-subtitle">Add a team member to your workshop</p>
            </div>
          </div>
        </header>

        <form id="add-staff-page-form" novalidate>
          <!-- 1. Staff Details Card (Image 3) -->
          <section class="card">

            <div class="form-group">

              <div class="input-wrapper">

            <div class="form-group">

                  <span>+91</span>

                  placeholder="98765 43210"
                  value="${escapeHtml(state.phone)}"
                  required
                />

            <div class="form-group">
              <label class="form-label" for="stf-email">Email Address <span class="required">*</span></label>
              <div class="input-wrapper">
                <span class="input-icon-left">${ICONS.mail}</span>
                <input
                  type="email"
                  id="stf-email"
                  class="form-input with-left-icon"
                  placeholder="rohan.patil@example.com"
                  value="${escapeHtml(state.email)}"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="stf-role">Role / Designation <span class="required">*</span></label>
              <div class="input-wrapper">
                <span class="input-icon-left">${ICONS.briefcase}</span>
                <select
                  id="stf-role"
                  class="form-select"
                  style="padding-left:2.5rem; font-weight:700; cursor:pointer;"
                  aria-label="Role / Designation"
                >
                  ${['Mechanic', 'Technician', 'Service Advisor', 'Service Staff', 'Electrician']
                    .map(
                      (r) => `<option value="${r}" ${state.role === r ? 'selected' : ''}>${r}</option>`
                    )
                    .join('')}
                </select>
              </div>
            </div>

            <div class="form-row-2">

                <label class="form-label" for="stf-joined">Joining Date</label>

                  <input
                    type="text"
                    id="stf-joined"
                    class="form-input with-left-icon"

                  <input

                    id="stf-address"
                    class="form-input with-left-icon"
                    placeholder="Enter address (optional)"
                    value="${escapeHtml(state.address)}"

          <!-- 2. Login Access Card (Part 3: Staff Access Permissions selector removed; fixed policy enforced) -->
          <section class="card">
            <h2 class="section-title" style="margin-bottom:2px;">
              <span style="color:var(--color-primary); display:inline-flex;">${ICONS.shieldLock}</span>
              <span>Login Access</span>

            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;">

                <input type="checkbox" id="stf-enable-login" ${state.enableLogin ? 'checked' : ''} />

            <div class="form-group">
              <label class="form-label" for="stf-approved-email">Approved Login Email</label>
              <div class="input-wrapper">

                <input
                  type="email"
                  id="stf-approved-email"
                  class="form-input with-left-icon"
                  style="background:var(--color-surface-blue);"
                  placeholder="rohan.patil@example.com"
                  value="${escapeHtml(state.approvedEmail || state.email)}"
                  ${state.enableLogin ? '' : 'disabled'}

                  ${ICONS.clock} ${escapeHtml(accessStatusLabel)}
                </span>

                  state.enableLogin && (state.status === 'Pending' || state.status === 'Pending Approval')
                    ? `<button
                        type="button"
                        class="btn btn-primary btn-pill"
                        id="edit-staff-approve-btn"
                        style="padding:4px 12px; min-height:30px; font-size:11.5px;"
                      >
                        ${ICONS.mail}
                        <span>Approve &amp; Send Invite</span>
                      </button>`
                    : ''
                }
              </div>
            </div>

            <div class="info-banner" style="margin-bottom:0;">
              <span style="color:var(--color-primary); display:inline-flex; margin-top:1px;">${ICONS.infoCircle}</span>

                Staff can sign in only after Admin approval. Staff will set their own password during account setup.
              </span>
            </div>
          </section>

          <div id="add-staff-error" class="form-error-msg" style="margin-bottom:10px;" hidden></div>

          <button
            type="submit"
            class="btn btn-primary btn-lg btn-block"
            style="margin-bottom:12px;"
          >
            ${ICONS.save}
            <span>Save Staff</span>
          </button>

          <button
            type="button"
            class="btn btn-neutral-outline btn-lg btn-block"
            id="cancel-add-staff-btn"
          >
            Cancel
          </button>
        </form>
      </div>
    `;

    bindEvents();
  }

  function syncInputs() {
    const nEl = container.querySelector('#stf-name');
    const pEl = container.querySelector('#stf-phone');
    const eEl = container.querySelector('#stf-email');
    const rEl = container.querySelector('#stf-role');
    const jEl = container.querySelector('#stf-joined');
    const aEl = container.querySelector('#stf-address');
    const apEl = container.querySelector('#stf-approved-email');

    if (nEl) state.name = nEl.value;
    if (pEl) state.phone = pEl.value;
    if (eEl) {
      state.email = eEl.value;
      if (!state.approvedEmail) state.approvedEmail = eEl.value;
    }
    if (rEl) state.role = rEl.value;
    if (jEl) state.joiningDate = jEl.value;
    if (aEl) state.address = aEl.value;
    if (apEl) state.approvedEmail = apEl.value;
  }

  function bindEvents() {
    const goBack = () => {
      if (editStaff) {
        Router.navigate('staff-profile', { staffId: editStaff.id });
      } else {
        Router.navigate('staff-list');
      }
    };

    container.querySelector('#add-staff-back-btn').addEventListener('click', goBack);
    container.querySelector('#cancel-add-staff-btn').addEventListener('click', goBack);

    // Integrate Joining Date with existing interactive Calendar Date Picker (no timezone shift)
    const joinedInput = container.querySelector('#stf-joined');
    if (joinedInput) {
      joinedInput.addEventListener('click', () => {
        syncInputs();
        openInvoiceDatePickerModal(state.joiningDate, (chosenFormatted, chosenIso) => {
          state.joiningDate = chosenFormatted || parseSelectedDateMeta(getLocalTodayIso()).formattedShort;
          state.joiningDateIso = chosenIso || getLocalTodayIso();
          joinedInput.value = state.joiningDate;
        });
      });
    }

    // Sync approved email automatically as email is typed
    const emailInput = container.querySelector('#stf-email');
    const approvedInput = container.querySelector('#stf-approved-email');
    if (emailInput && approvedInput) {
      emailInput.addEventListener('input', () => {
        approvedInput.value = emailInput.value;
      });
    }

    // Part 6.2: Apply Image 02 Universal Selection UI to Role / Designation
    const roleSelectEl = container.querySelector('#stf-role');
    if (roleSelectEl) {
      roleSelectEl.addEventListener('change', (e) => {
        syncInputs();
        state.role = e.target.value;
      });
      const openRolePopup = (e) => {
        e.preventDefault();
        syncInputs();
        SelectionPopup.open({
          title: 'Select Role / Designation',
          searchable: false,
          selectedValues: [state.role || 'Mechanic'],
          items: STAFF_ROLE_OPTIONS,
          onConfirm(chosenRole) {
            if (chosenRole) {
              state.role = chosenRole;
              renderForm();
            }
          }
        });
      };
      roleSelectEl.addEventListener('mousedown', openRolePopup);
      roleSelectEl.addEventListener('click', openRolePopup);
    }

    // Toggle Enable Staff Login
    container.querySelector('#stf-enable-login').addEventListener('change', (e) => {
      syncInputs();
      state.enableLogin = e.target.checked;
      renderForm();
    });

    // Approve Pending Staff Account & Trigger Email Invitation from Edit Staff
    const approveBtn = container.querySelector('#edit-staff-approve-btn');
    if (approveBtn) {
      approveBtn.addEventListener('click', async () => {
        syncInputs();
        state.status = 'Approved – Setup Pending';
        state.enableLogin = true;
        if (state.id) {
          const approved = AppState.approveStaffAccount(state.id);
          if (approved) {
            const inviteRes = await SupabaseService.sendStaffInvitationEmail(approved);
            if (inviteRes.emailSent) {
              showToast(inviteRes.message, 'success');
            } else {
              showToast('Approved (Setup Pending). Configure Supabase in Settings to send live emails.', 'warning');
            }
          }
        }
        renderForm();
      });
    }

    // Submit Save Staff
    container.querySelector('#add-staff-page-form').addEventListener('submit', (e) => {
      e.preventDefault();
      syncInputs();

      const errEl = container.querySelector('#add-staff-error');
      errEl.hidden = true;

      const cleanName = state.name.trim();
      const digits = state.phone.replace(/\D/g, '');
      const cleanEmail = state.email.trim();

      if (!cleanName) {
        errEl.textContent = 'Staff Full Name is required.';
        errEl.hidden = false;
        return;
      }
      if (digits.length < 10) {
        errEl.textContent = 'Please enter a valid 10-digit mobile number.';
        errEl.hidden = false;
        return;
      }
      if (!cleanEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
        errEl.textContent = 'Please enter a valid email address.';
        errEl.hidden = false;
        return;
      }

      const formattedPhone = state.phone.trim().startsWith('+91')
        ? state.phone.trim()
        : `+91 ${state.phone.trim()}`;

      const saved = AppState.saveStaffMember({
        id: state.id,
        name: cleanName,
        phone: formattedPhone,
        email: cleanEmail,
        role: state.role,
        joiningDate: state.joiningDate.trim() || parseSelectedDateMeta(getLocalTodayIso()).formattedShort,
        joiningDateIso: state.joiningDateIso || getLocalTodayIso(),
        address: state.address.trim(),
        enableLogin: state.enableLogin,
        approvedEmail: (state.approvedEmail || cleanEmail).trim(),
        status: state.enableLogin ? (editStaff ? state.status : 'Pending Approval') : 'Suspended',
        permissions: state.permissions
      });

      showToast(editStaff ? 'Staff details updated successfully' : 'Staff added successfully');
      Router.navigate('staff-profile', { staffId: saved.id });
    });
  }

  renderForm();
}

// --- js/pages/staff-list.js ---
// ==========================================================================
// GarageFlow — IMAGE 4: View All Staff Directory (js/pages/staff-list.js)
// Implements Section 9 & Image 4:
// - Staff count pill ("5 Staff") & Settings icon
// - Search staff by name or mobile + status filter
// - "+ Add Staff" primary button
// - Staff directory cards (Name, Role, Phone, Active/Pending/Inactive status)
// ==========================================================================
function renderStaffListPage(container) {
  const { staff } = AppState.data;
  const query = (AppState.filters.staffQuery || '').trim().toLowerCase();
  const statusFilter = AppState.filters.staffStatus || 'All';

  const filteredStaff = staff.filter((member) => {
    const matchesStatus = statusFilter === 'All' || member.status === statusFilter;
    const matchesQuery =
      !query ||
      member.name.toLowerCase().includes(query) ||
      member.role.toLowerCase().includes(query) ||
      member.phone.toLowerCase().includes(query) ||
      member.email.toLowerCase().includes(query);
    return matchesStatus && matchesQuery;
  });

  container.innerHTML = `
    <div class="page-container">
      <!-- Top Header matching Image 4 -->
      <header class="subpage-header">
        <div class="subpage-header-left">
          <button
            type="button"
            class="back-btn"
            id="staff-list-back-btn"
            aria-label="Back to Home Dashboard"
          >
            ${ICONS.chevronLeft}
          </button>
          <div>
            <h1 class="page-title">All Staff</h1>
            <p class="page-subtitle">Manage your workshop team</p>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <div class="count-pill" style="padding:0.4rem 0.75rem; font-weight:700; color:var(--color-primary);">
            ${ICONS.users}
            <span>${staff.length} Staff</span>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-action="open-settings"
            aria-label="Open Settings"
          >
            ${ICONS.settings}
          </button>
        </div>
      </header>

      <!-- Search & Filter Bar -->
      <div class="search-bar-wrap">
        <div class="search-input-box">
          ${ICONS.search}
          <input
            type="search"
            id="staff-search-input"
            class="search-input"
            placeholder="Search staff by name or mobile"
            value="${escapeHtml(AppState.filters.staffQuery)}"
            aria-label="Search staff by name or mobile"
          />
        </div>
        <button
          type="button"
          class="filter-btn ${statusFilter !== 'All' ? 'active' : ''}"
          id="staff-filter-btn"
          aria-label="Filter staff by status"
        >
          ${ICONS.filter}
        </button>
      </div>

      <!-- + Add Staff Primary CTA Button -->
      <button
        type="button"
        class="btn btn-primary btn-lg btn-block"
        id="staff-list-add-btn"
        style="margin-bottom:16px;"
      >
        ${ICONS.plus}
        <span>Add Staff</span>
      </button>

      <!-- Staff Directory List -->
      ${
        filteredStaff.length === 0
          ? `
        <div class="card empty-state">
          <p style="font-weight:700; color:var(--color-text); margin-bottom:4px;">No staff members match your search</p>
          <p style="font-size:var(--text-xs); margin-bottom:12px;">Try clearing your search query or status filter.</p>
          <button type="button" class="btn btn-soft-blue" id="reset-staff-filter-btn">Show All Staff</button>
        </div>
      `
          : `
        <div>
          ${filteredStaff
            .map(
              (member) => `
            <article
              class="staff-directory-card"
              data-staff-card="${member.id}"
              role="button"
              tabindex="0"
              aria-label="Open profile for ${escapeHtml(member.name)}"
            >
              <div class="staff-directory-left">
                <div class="avatar avatar-lg avatar-soft">${escapeHtml(member.initials)}</div>
                <div style="min-width:0; flex:1;">
                  <div style="font-size:var(--text-lg); font-weight:800; color:var(--color-text); line-height:1.25;">
                    ${escapeHtml(member.name)}
                  </div>
                  <div style="font-size:var(--text-xs); color:var(--color-muted); font-weight:600; margin-top:2px;">
                    ${escapeHtml(member.role)}
                  </div>
                  <div style="display:flex; align-items:center; gap:6px; font-size:var(--text-sm); color:var(--color-text-secondary); margin-top:4px;">
                    ${ICONS.phone}
                    <span>${escapeHtml(member.phone)}</span>
                  </div>
                </div>
              </div>

              <div class="staff-directory-right">
                ${
                  member.status === 'Pending' || member.status === 'Pending Approval'
                    ? `<button
                        type="button"
                        class="btn btn-primary btn-pill"
                        data-quick-approve-staff="${member.id}"
                        style="padding:4px 10px; min-height:28px; font-size:11px;"
                      >
                        Approve &amp; Invite
                      </button>`
                    : ''
                }
                ${renderStatusBadge(member.status)}
                <span class="text-muted">${ICONS.chevronRight}</span>
              </div>
            </article>
          `
            )
            .join('')}
        </div>
      `
      }
    </div>
  `;

  bindStaffListEvents(container);
}

function bindStaffListEvents(container) {
  container.querySelector('#staff-list-back-btn').addEventListener('click', () => {
    Router.navigate('dashboard');
  });

  const searchInput = container.querySelector('#staff-search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      AppState.filters.staffQuery = e.target.value;
      renderStaffListPage(container);
      const refocused = container.querySelector('#staff-search-input');
      if (refocused) {
        refocused.focus();
        refocused.setSelectionRange(refocused.value.length, refocused.value.length);
      }
    });
  }

  const resetBtn = container.querySelector('#reset-staff-filter-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      AppState.filters.staffQuery = '';
      AppState.filters.staffStatus = 'All';
      renderStaffListPage(container);
    });
  }

  const filterBtn = container.querySelector('#staff-filter-btn');
  if (filterBtn) {
    filterBtn.addEventListener('click', () => {
      Modal.open({
        title: 'Filter Staff Directory',
        bodyHtml: `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${['All', 'Active', 'Pending', 'Inactive']
              .map(
                (st) => `
              <button type="button" class="btn ${AppState.filters.staffStatus === st ? 'btn-primary' : 'btn-outline'} btn-block" data-staff-filter="${st}">
                ${st === 'All' ? 'All Staff Members' : `${st} Staff`}
              </button>
            `
              )
              .join('')}
          </div>
        `,
        onMount(modalEl) {
          modalEl.querySelectorAll('[data-staff-filter]').forEach((b) => {
            b.addEventListener('click', () => {
              AppState.filters.staffStatus = b.getAttribute('data-staff-filter');
              Modal.close();
              renderStaffListPage(container);
            });
          });
        }
      });
    });
  }

  container.querySelector('#staff-list-add-btn').addEventListener('click', () => {
    Router.navigate('add-staff', { staffId: null });
  });

  container.querySelectorAll('[data-quick-approve-staff]').forEach((btn) => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const sId = btn.getAttribute('data-quick-approve-staff');
      const approved = AppState.approveStaffAccount(sId);
      if (approved) {
        const res = await SupabaseService.sendStaffInvitationEmail(approved);
        if (res.emailSent) {
          showToast(`Approved ${approved.name} & sent invitation email to ${approved.email}.`);
        } else {
          showToast(`Approved ${approved.name} (Status: Approved – Setup Pending).`, 'warning');
        }
        renderStaffListPage(container);
      }
    });
  });

  container.querySelectorAll('[data-staff-card]').forEach((card) => {
    const openStaff = () => {
      const staffId = card.getAttribute('data-staff-card');
      Router.navigate('staff-profile', { staffId });
    };
    card.addEventListener('click', openStaff);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openStaff();
      }
    });
  });
}

      (Array.isArray(j.assignedStaffIds) && j.assignedStaffIds.includes(staff.id))
  );

  const activeJobsCount = assignedJobs.filter(
    (j) => j.status === 'Received' || j.status === 'In-progress'
  ).length;

    (Number(staff.completedJobsCount) || 0) +
    assignedJobs.filter((j) => j.status === 'Ready').length;

            <div style="min-width:0; flex:1;">

                ${escapeHtml(staff.name)}
              </h2>
              <div style="font-size:var(--text-sm); color:var(--color-muted); font-weight:600; margin:2px 0 6px;">
                ${escapeHtml(staff.role)}
              </div>
              <div style="margin-bottom:8px;">
                ${renderStatusBadge(staff.status)}
              </div>
              <div style="display:flex; align-items:center; gap:6px; font-size:var(--text-xs); color:var(--color-text-secondary);">
                ${ICONS.calendar}
                <span>Joined ${escapeHtml(staff.joiningDate || '12 Aug 2026')}</span>
              </div>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-primary btn-pill"
            id="staff-top-edit-btn"
            style="padding:0.5rem 0.95rem; font-size:var(--text-xs); min-height:36px;"
          >
            ${ICONS.edit}
            <span>Edit Profile</span>
          </button>

      <!-- 2. Contact Details Card (Image 5) -->

function bindStaffProfileEvents(container, staff) {
  container.querySelector('#staff-profile-back-btn').addEventListener('click', () => {
    Router.navigate('staff-list');
  });

  const openEdit = () => Router.navigate('add-staff', { staffId: staff.id });
  container.querySelector('#staff-top-edit-btn').addEventListener('click', openEdit);
  container.querySelector('#staff-bottom-edit-btn').addEventListener('click', openEdit);
  const staffMoreBtn = container.querySelector('#staff-profile-more-btn');
  if (staffMoreBtn) staffMoreBtn.addEventListener('click', openEdit);

  container.querySelector('#staff-view-all-jobs-btn').addEventListener('click', () => {
    Router.navigate('services');
  });

  container.querySelectorAll('[data-open-assigned-job]').forEach((row) => {
    row.addEventListener('click', () => {
      const customerId = row.getAttribute('data-open-assigned-job');
      Router.navigate('customer-profile', { customerId });
    });
  });

  // Step 1 & 2: Approve Pending Staff Account & Send Supabase Email Invitation
  const approveAccountBtn = container.querySelector('#staff-approve-account-btn');
  if (approveAccountBtn) {
    approveAccountBtn.addEventListener('click', async () => {
      approveAccountBtn.disabled = true;
      const approved = AppState.approveStaffAccount(staff.id);
      if (approved) {
        const inviteRes = await SupabaseService.sendStaffInvitationEmail(approved);
        if (inviteRes.emailSent) {
          showToast(inviteRes.message, 'success');
        } else {
          showToast(`Approved (${approved.status}). ${inviteRes.error}`, 'warning');
        }
        renderStaffProfilePage(container, { staffId: staff.id });
      }
    });
  }

  const resendInviteBtn = container.querySelector('#staff-resend-invite-btn');
  if (resendInviteBtn) {
    resendInviteBtn.addEventListener('click', async () => {
      resendInviteBtn.disabled = true;
      const inviteRes = await SupabaseService.sendStaffInvitationEmail(staff);
      resendInviteBtn.disabled = false;
      if (inviteRes.emailSent) {
        showToast(inviteRes.message, 'success');
      } else {
        showToast(inviteRes.error, 'warning');
      }
    });
  }

  const openSetupScreenBtn = container.querySelector('#staff-open-setup-screen-btn');
  if (openSetupScreenBtn) {
    openSetupScreenBtn.addEventListener('click', () => {
      if (!staff.invitationToken) {
        SupabaseService.buildAccountSetupUrl(staff);
      }
      Router.navigate('staff-account-setup', {
        staffId: staff.id,
        email: staff.approvedEmail || staff.email,
        inviteToken: staff.invitationToken
      });
    });
  }

  // Deactivate / Activate Staff
  container.querySelector('#staff-toggle-active-btn').addEventListener('click', () => {
    const updated = AppState.toggleStaffActiveStatus(staff.id);
    if (updated) {
      showToast(
        `${updated.name}'s account is now ${updated.status}.`,
        updated.status === 'Inactive' ? 'warning' : 'success'
      );
      renderStaffProfilePage(container, { staffId: staff.id });
    }
  });
}

            Amount Received <span class="required">*</span>
          </label>
          <div class="amount-pay-row">
            <div class="input-wrapper">
              <span
                style="position:absolute; left:14px; font-size:1.3rem; font-weight:800; color:var(--color-text); pointer-events:none;"
              >
                ₹

              <input

              <div style="font-size:0.9375rem; font-weight:800; color:var(--color-text);">${formatCurrency(summary.balance)}</div>

            <div style="border-right:1px solid #cbd5e1;">

              </div>
            </div>
          </div>
