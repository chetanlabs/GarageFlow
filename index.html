  }
  const key = String(SUPABASE_CONFIG.publishableKey || '').trim();
  if (!key || key.startsWith('PASTE_') || isServiceRoleKey(key)) {
    return null;
  }
  supabaseClient = window.supabase.createClient(
    SUPABASE_CONFIG.url,
    key,
    { auth: SUPABASE_CONFIG.authOptions }
  );
  if (window.GarageFlow) {

  return supabaseClient;
}

    rlsVerified: false, // Never claimed as verified in Step 1
    failureCategory: 'none', // 'none' | 'network_or_cors_error' | 'http_auth_error' | 'database_error'
    postgrestOutcome: 'not_tested', // 'successful_database_request' | 'missing_database_table' | 'permission_or_rls_error' | 'invalid_api_key' | 'network_or_cors_error' | 'unexpected_postgrest_error'
    httpStatus: null,
    errorCode: null,
    details: ''
  };

  // 1. Check if @supabase/supabase-js v2 loaded from CDN
  if (
    !overrideClient &&
    (typeof window === 'undefined' || !window.supabase || typeof window.supabase.createClient !== 'function')
  ) {
    report.failureCategory = 'network_or_cors_error';
    report.postgrestOutcome = 'network_or_cors_error';
    report.details = 'Supabase JS CDN script did not load. Check internet connectivity.';
    return report;
  }
  report.sdkLoaded = true;

  // 2. Validate Publishable Key configuration & block service_role / secret keys
  if (isServiceRoleKey(key)) {
    report.failureCategory = 'http_auth_error';
    report.postgrestOutcome = 'service_role_rejected';
    report.details = 'Security Error: Refusing to use service_role / secret key in browser code.';
    return report;
  }
  if (!activeClient) {
    report.failureCategory = 'http_auth_error';
    report.postgrestOutcome = 'client_not_initialized';
    report.details = 'SUPABASE_CONFIG.publishableKey is missing or still set to placeholder.';
    return report;
  }

  // 3. Verify authentication & connectivity directly through an actual PostgREST table request
  //    (Uses table query directly, as Supabase restricts the OpenAPI root path to secret keys)
  try {
    const response = await activeClient
      .from('customers')
      .select('id')
      .limit(1);

    const httpStatus = typeof response.status === 'number' && response.status > 0 ? response.status : null;
    const pgError = response.error || null;
    const errCode = pgError && pgError.code ? String(pgError.code) : null;
    const errMsg = pgError && pgError.message ? String(pgError.message) : '';
    const errMsgLower = errMsg.toLowerCase();

    report.httpStatus = httpStatus;
    report.errorCode = errCode;

    // Outcome 5: Network or CORS Error (no HTTP status returned by fetch)
    if (
      !httpStatus &&
      pgError &&
      (errMsgLower.includes('failed to fetch') ||
        errMsgLower.includes('networkerror') ||
        errMsgLower.includes('load failed') ||
        errMsgLower.includes('fetch'))
    ) {
      report.projectReachable = false;
      report.apiKeyAccepted = false;
      report.databaseTablesConfigured = false;
      report.failureCategory = 'network_or_cors_error';
      report.postgrestOutcome = 'network_or_cors_error';
      report.details = `Network or CORS error reaching ${SUPABASE_CONFIG.url}: ${errMsg}`;
      return report;
    }

    report.projectReachable = true;

    const isPermissionOrRlsError =
      errCode === '42501' ||
      errMsgLower.includes('permission denied') ||
      errMsgLower.includes('row-level security');

    // Outcome 4: API Key Rejected by Supabase (HTTP 401 / 403 or PGRST301 on table endpoint)
    if (
      !isPermissionOrRlsError &&
      (httpStatus === 401 ||
        httpStatus === 403 ||
        errCode === 'PGRST301' ||
        errMsgLower.includes('invalid api key') ||
        errMsgLower.includes('no api key found') ||
        errMsgLower.includes('jwt'))
    ) {
      report.apiKeyAccepted = false;
      report.databaseTablesConfigured = false;
      report.failureCategory = 'http_auth_error';
      report.postgrestOutcome = 'invalid_api_key';
      report.details = `API key rejected by Supabase (HTTP ${httpStatus || 401}${errCode ? ', code: ' + errCode : ''}): ${errMsg || 'Unauthorized'}`;
      return report;
    }

    // Outcome 2: API Key Accepted, but 'customers' Table Is Missing (PGRST205 / 42P01)
    if (errCode === 'PGRST205' || errCode === '42P01') {
      report.apiKeyAccepted = true;
      report.databaseTablesConfigured = false;
      report.failureCategory = 'none';
      report.postgrestOutcome = 'missing_database_table';
      report.details = `API key accepted by Supabase (${errCode}), but table "public.customers" is not created yet.`;
      return report;
    }

    // Outcome 3: API Key Accepted, but Permission / RLS Denied (42501)
    if (isPermissionOrRlsError) {
      const evidencesTableExists =
        errMsgLower.includes('table customers') ||
        errMsgLower.includes('table "customers"') ||
        errMsgLower.includes('relation "customers"') ||
        errMsgLower.includes('relation "public.customers"');
      report.apiKeyAccepted = true;
      report.databaseTablesConfigured = evidencesTableExists;
      report.failureCategory = 'database_error';
      report.postgrestOutcome = 'permission_or_rls_error';
      report.details = `API key accepted by Supabase, but permission/RLS denied access (${errCode || httpStatus}): ${errMsg}`;
      return report;
    }

    // Outcome 1: API Key Accepted and Query Successful (HTTP 200 / 206, no error)
    if (!pgError && (httpStatus === 200 || httpStatus === 206)) {
      report.apiKeyAccepted = true;
      report.databaseTablesConfigured = true;
      report.failureCategory = 'none';
      report.postgrestOutcome = 'successful_database_request';
      report.details = 'API key accepted and query to "public.customers" succeeded (RLS policies not verified in Step 1).';
      return report;
    }

    // Other unexpected PostgREST responses
    report.databaseTablesConfigured = false;
    report.failureCategory = 'database_error';
    report.postgrestOutcome = 'unexpected_postgrest_error';
    report.details = `Unexpected PostgREST response (HTTP ${httpStatus || 'unknown'}, code: ${errCode || 'none'}): ${errMsg || 'Unrecognized response'}`;
    return report;
  } catch (err) {
    report.projectReachable = false;
    report.apiKeyAccepted = false;
    report.databaseTablesConfigured = false;
    report.failureCategory = 'network_or_cors_error';
    report.postgrestOutcome = 'network_or_cors_error';
    report.details = `Network or CORS error reaching ${SUPABASE_CONFIG.url}: ${err && err.message ? err.message : 'Failed to fetch'}`;
    return report;
  }
}

// GarageFlow — Superadmin Supabase Service (Trusted Role & Owner Management)
// ==========================================================================
const SuperadminService = {
  _platformSettingsCache: {
    meta_app_id: '',
    meta_waba_id: '',
    meta_webhook_url: '',
    whatsapp_api_status: 'Configuration Required',
    notify_new_owner_created: true,
    notify_owner_activated: true,
    notify_system_health_alerts: true,
    notify_whatsapp_api_errors: true
  },

  getActiveClient() {
    return getOrInitSupabaseClient() || (window.GarageFlow && window.GarageFlow.supabaseClient) || null;
  },

  /**
   * Verifies that the authenticated Supabase user holds a trusted Superadmin role
   * from server-side database structures (public.verify_superadmin_role RPC,
   * public.superadmin_accounts table, or service-controlled app_metadata.role).
   * NEVER trusts UI role selection or user-editable user_metadata.
   */
  async verifyTrustedSuperadminRole(client, authUser) {
    if (!client || !authUser || !authUser.id) {
      return { authorized: false, reason: 'No authenticated Supabase user session.' };
    }

    // 1. Primary check: trusted SECURITY DEFINER RPC verify_superadmin_role()
    try {
      const { data: rpcData, error: rpcError } = await client.rpc('verify_superadmin_role');
      if (!rpcError && rpcData) {
        const row = Array.isArray(rpcData) ? rpcData[0] : rpcData;
        if (row && row.is_superadmin === true) {
          return {
            authorized: true,
            source: 'rpc:verify_superadmin_role',
            fullName: row.full_name || 'Superadmin',
            email: row.email || authUser.email
          };
        }
        return {
          authorized: false,
          reason: 'This account is not registered as an active Superadmin.'
        };
      }
    } catch (rpcErr) {
      // Fall through to direct RLS-protected table check
    }

    // 2. Secondary check: RLS-protected public.superadmin_accounts table
    try {
      const { data: saRow, error: saErr } = await client
        .from('superadmin_accounts')
        .select('id, email, full_name, is_active')
        .eq('auth_user_id', authUser.id)
        .eq('is_active', true)
        .maybeSingle();

      if (!saErr && saRow && saRow.is_active === true) {
        return {
          authorized: true,
          source: 'table:superadmin_accounts',
          fullName: saRow.full_name || 'Superadmin',
          email: saRow.email || authUser.email
        };
      }
      if (!saErr && !saRow) {
        // Table exists and user is not listed as an active Superadmin
        const appRole = String((authUser.app_metadata && authUser.app_metadata.role) || '').toLowerCase();
        if (appRole !== 'superadmin') {
          return {
            authorized: false,
            reason: 'This account does not have Superadmin authorization.'
          };
        }
      }
    } catch (tblErr) {
      // Fall through to app_metadata check
    }

    // 3. Tertiary check: service-role-only JWT app_metadata.role === 'superadmin'
    const appMetaRole = String((authUser.app_metadata && authUser.app_metadata.role) || '').toLowerCase();
    if (appMetaRole === 'superadmin') {
      return {
        authorized: true,
        source: 'auth:app_metadata',
        fullName: 'Superadmin',
        email: authUser.email
      };
    }

    return {
      authorized: false,
      reason: 'Access denied: Your account is not authorized for Superadmin access.'
    };
  },

  /**
   * Fetches real dynamically registered Garage Owners from Supabase.
   * Never returns hardcoded sample owners.
   */
  async fetchGarageOwners() {
    const client = this.getActiveClient();
    if (!client) {
      return { ok: false, owners: [], migrationRequired: false, error: 'Supabase client is not initialized.' };
    }
    try {
      const { data, error } = await client
        .from('garage_owner_accounts')
        .select('id, owner_name, garage_name, owner_email, status, invited_at, activated_at, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        const code = String(error.code || '');
        const msg = String(error.message || '');
        if (code === 'PGRST205' || code === '42P01' || msg.toLowerCase().includes('garage_owner_accounts')) {
          return {
            ok: false,
            owners: [],
            migrationRequired: true,
            error: 'Table "public.garage_owner_accounts" is not created in Supabase yet. Run GarageFlow_Superadmin_Migration.sql in Supabase SQL Editor.'
          };
        }
        return { ok: false, owners: [], migrationRequired: false, error: msg || 'Unable to load garage owners.' };
      }

      return { ok: true, owners: Array.isArray(data) ? data : [], migrationRequired: false };
    } catch (err) {
      return {
        ok: false,
        owners: [],
        migrationRequired: false,
        error: err && err.message ? err.message : 'Network error loading garage owners.'
      };
    }
  },

  /**
   * Creates a Garage Owner record in Supabase and triggers Supabase Auth email setup.
   * Uses ONLY publishable key & authenticated Superadmin session (zero service_role in frontend).
   */
  async createGarageOwner({ ownerName, garageName, ownerEmail }) {
    const cleanOwner = String(ownerName || '').trim();
    const cleanGarage = String(garageName || '').trim();
    const cleanEmail = String(ownerEmail || '').trim().toLowerCase();

    if (cleanOwner.length < 2) {
      return { ok: false, field: 'ownerName', error: 'Please enter the Owner Name.' };
    }
    if (cleanGarage.length < 2) {
      return { ok: false, field: 'garageName', error: 'Please enter the Garage Name.' };
    }
    if (!cleanEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
      return { ok: false, field: 'ownerEmail', error: 'Please enter a valid Owner Gmail Address.' };
    }

    const client = this.getActiveClient();
    if (!client) {
      return { ok: false, error: 'Supabase client is not initialized.' };
    }

    // 1. Create database record via Superadmin-protected RPC (with RLS-protected table fallback)
    let createdRecord = null;
    try {
      const { data: rpcRow, error: rpcErr } = await client.rpc('superadmin_create_garage_owner', {
        p_owner_name: cleanOwner,
        p_garage_name: cleanGarage,
        p_owner_email: cleanEmail
      });

      if (!rpcErr && rpcRow) {
        createdRecord = rpcRow;
      } else if (rpcErr) {
        const errCode = String(rpcErr.code || '');
        const errMsg = String(rpcErr.message || '');
        if (errCode === '23505' || errMsg.toLowerCase().includes('duplicate')) {
          return { ok: false, field: 'ownerEmail', error: 'An owner account with this Gmail address already exists.' };
        }
        if (errCode === '42501') {
          return { ok: false, error: 'Unauthorized: Active Superadmin session required in Supabase.' };
        }
        // Try direct RLS-protected insert if RPC is not deployed yet
        const { data: insRow, error: insErr } = await client
          .from('garage_owner_accounts')
          .insert({
            owner_name: cleanOwner,
            garage_name: cleanGarage,
            owner_email: cleanEmail,
            status: 'Setup Pending'
          })
          .select('id, owner_name, garage_name, owner_email, status, invited_at, created_at')
          .single();

        if (insErr) {
          const insCode = String(insErr.code || '');
          if (insCode === 'PGRST205' || insCode === '42P01') {
            return {
              ok: false,
              migrationRequired: true,
              error: 'Database migration required: Run GarageFlow_Superadmin_Migration.sql in Supabase SQL Editor first.'
            };
          }
          if (insCode === '23505') {
            return { ok: false, field: 'ownerEmail', error: 'An owner account with this Gmail address already exists.' };
          }
          return { ok: false, error: insErr.message || 'Failed to save Garage Owner record.' };
        }
        createdRecord = insRow;
      }
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : 'Network error creating owner record.' };
    }

    // 2. Trigger Supabase Auth email setup workflow (no password created by Superadmin)
    let emailSent = false;
    let emailNote = '';
    try {
      const redirectUrl =
        typeof window !== 'undefined' && window.location && /^https?:/.test(window.location.protocol)
          ? `${window.location.origin}${window.location.pathname}?setup_owner=1`
          : undefined;
      const { error: otpErr } = await client.auth.signInWithOtp({
        email: cleanEmail,
        options: {
          shouldCreateUser: true,
          emailRedirectTo: redirectUrl,
          data: {
            owner_name: cleanOwner,
            garage_name: cleanGarage
          }
        }
      });
      if (!otpErr) {
        emailSent = true;
        emailNote = 'Account setup email sent via Supabase Auth.';
      } else {
        emailNote = `Owner record saved, but Supabase Auth email could not be dispatched (${otpErr.message}). Check Supabase Auth Email/SMTP settings.`;
      }
    } catch (otpCatch) {
      emailNote = 'Owner record saved, but Supabase Auth email dispatch requires live connectivity and SMTP configuration.';
    }

    return {
      ok: true,
      owner: createdRecord,
      emailSent,
      emailNote
    };
  },

  async resendOwnerSetupEmail(owner) {
    const client = this.getActiveClient();
    if (!client || !owner || !owner.owner_email) {
      return { ok: false, error: 'Unable to send setup email right now.' };

    try {
      const redirectUrl =
        typeof window !== 'undefined' && window.location && /^https?:/.test(window.location.protocol)
          ? `${window.location.origin}${window.location.pathname}?setup_owner=1`
          : undefined;
      const { error } = await client.auth.signInWithOtp({

        options: {
          shouldCreateUser: true,
          emailRedirectTo: redirectUrl
        }
      });
      if (error) {
        return { ok: false, error: error.message || 'Failed to send setup email.' };
      }
      return { ok: true };
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : 'Network error sending email.' };
    }
  },

  async updateGarageOwner(ownerId, { ownerName, garageName }) {
    const cleanOwner = String(ownerName || '').trim();
    const cleanGarage = String(garageName || '').trim();
    if (cleanOwner.length < 2) return { ok: false, error: 'Owner Name must be at least 2 characters.' };
    if (cleanGarage.length < 2) return { ok: false, error: 'Garage Name must be at least 2 characters.' };

    const client = this.getActiveClient();
    if (!client || !ownerId) return { ok: false, error: 'Unable to update owner right now.' };

        .from('garage_owner_accounts')
        .update({
          owner_name: cleanOwner,
          garage_name: cleanGarage,

        })
        .eq('id', ownerId)
        .select('id, owner_name, garage_name, owner_email, status, invited_at, activated_at, created_at')
        .single();
      if (error) return { ok: false, error: error.message || 'Failed to update owner details.' };
      return { ok: true, owner: data };
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : 'Network error updating owner details.' };

  async setGarageOwnerStatus(ownerId, newStatus) {

    try {
      const { data, error } = await client
        .from('garage_owner_accounts')
        .update({
          status: newStatus,
          updated_at: new Date().toISOString()
        })
        .eq('id', ownerId)
        .select('id, owner_name, garage_name, owner_email, status, invited_at, activated_at, created_at')
        .single();
      if (error) return { ok: false, error: error.message || 'Failed to update owner status.' };
      return { ok: true, owner: data };
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : 'Network error updating owner status.' };
    }
  },

  async fetchPlatformSettings() {
    const client = this.getActiveClient();
    if (!client) return { ok: false, settings: { ...this._platformSettingsCache } };
    try {
      const { data, error } = await client
        .from('superadmin_platform_settings')
        .select('*')
        .eq('id', 1)
        .maybeSingle();
      if (!error && data) {
        this._platformSettingsCache = { ...this._platformSettingsCache, ...data };
        return { ok: true, settings: { ...this._platformSettingsCache } };
      }
      return { ok: false, settings: { ...this._platformSettingsCache }, error: error ? error.message : '' };
    } catch (err) {
      return { ok: false, settings: { ...this._platformSettingsCache } };
    }
  },

  async savePlatformSettings(patch) {
    this._platformSettingsCache = { ...this._platformSettingsCache, ...patch };
    const client = this.getActiveClient();
    if (!client) return { ok: false, error: 'Supabase client not initialized.' };
    try {
      const { error } = await client
        .from('superadmin_platform_settings')
        .update({
          ...patch,
          updated_at: new Date().toISOString()
        })
        .eq('id', 1);
      if (error) {
        return { ok: false, error: error.message || 'Could not persist settings to Supabase yet.' };
      }
      return { ok: true, settings: { ...this._platformSettingsCache } };
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : 'Network error saving settings.' };
    }
  }
};

  /**
   * Provisions/loads the authenticated Owner's garage and hydrates ALL 12 tables
   * strictly filtered by garage_id. Never mixes with localStorage demo data.
   */
  async hydrateForOwner(client, ownerInfo = {}) {
    if (!client) {
      return { ok: false, error: 'Supabase client is not initialized.' };
    }

    // 1. Ensure/fetch tenant garage row via SECURITY DEFINER RPC
    let garageRow = null;
    try {
      const { data: gData, error: gErr } = await client.rpc('ensure_owner_garage');
      if (!gErr && gData) {
        garageRow = Array.isArray(gData) ? gData[0] : gData;
      } else if (gErr) {
        // Fallback: direct RLS-protected SELECT on garages
        const { data: gSel } = await client.from('garages').select('*').limit(1).maybeSingle();
        if (gSel) garageRow = gSel;
      }
    } catch (e) {
      // Fall back to empty state if Phase 1-5 SQL isn't reachable
    }

    const freshData = this.createEmptyTenantData(garageRow || {}, ownerInfo);
    if (!garageRow || !garageRow.id) {
      return { ok: true, garageId: null, data: freshData, partial: true };
    }

    const garageId = garageRow.id;

    // 2. Fetch all tenant tables in parallel (strictly scoped by garage_id + RLS)
    const [
      invSetRes,
      notifSetRes,
      waRes,
      staffRes,
      custRes,
      vehRes,
      jobsRes,
      sjsRes,
      invRes,
      invItemsRes,
      invPayRes
    ] = await Promise.all([
      client.from('invoice_settings').select('*').eq('garage_id', garageId).maybeSingle(),
      client.from('notification_settings').select('*').eq('garage_id', garageId).maybeSingle(),
      client.from('whatsapp_integrations').select('*').eq('garage_id', garageId).maybeSingle(),
      client.from('staff_accounts').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('customers').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('vehicles').select('*').eq('garage_id', garageId).order('created_at', { ascending: true }),
      client.from('service_jobs').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('service_job_staff').select('*').eq('garage_id', garageId),
      client.from('invoices').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('invoice_items').select('*').eq('garage_id', garageId).order('sort_order', { ascending: true }),
      client.from('invoice_payments').select('*').eq('garage_id', garageId).order('paid_at', { ascending: false })
    ]);

    // Map Settings
    if (invSetRes && invSetRes.data) {
      const s = invSetRes.data;
      freshData.invoiceSettings = {
        ...freshData.invoiceSettings,
        invoicePrefix: s.invoice_prefix || 'INV-',
        invoiceFormat: s.number_format || 'INV-001',
        currentInvoiceSeq: Number(s.next_sequence) || 1,
        gstEnabled: Boolean(s.gst_enabled),
        gstin: s.gstin || '',
        defaultTaxRate: Number(s.default_tax_rate) || 0,
        upiId: s.upi_id || '',
        upiPayeeName: s.upi_payee_name || freshData.businessProfile.displayName,
        bankDetails: s.bank_details || '',
        termsAndNotes: s.terms_and_notes || '',
        showLogoOnInvoice: s.show_logo_on_invoice !== false
      };
      freshData.tenant.nextInvoiceSeq = Number(s.next_sequence) || 1;
    }

    // Load strictly owner-scoped Branding & Payment assets (Logo, Signature, QR) from private garage-assets bucket + local cache
    try {
      const hydratedAssets = await this.loadGarageAssets(garageId);
      if (hydratedAssets.logoDataUrl) {
        freshData.invoiceSettings.logoDataUrl = hydratedAssets.logoDataUrl;
        freshData.businessProfile.logoDataUrl = hydratedAssets.logoDataUrl;
      }
      if (hydratedAssets.signatureDataUrl) {
        freshData.invoiceSettings.signatureDataUrl = hydratedAssets.signatureDataUrl;
      }
      if (hydratedAssets.qrCodeDataUrl) {
        freshData.invoiceSettings.qrCodeDataUrl = hydratedAssets.qrCodeDataUrl;
        freshData.invoiceSettings.qrVerified = true;
        freshData.invoiceSettings.qrStatusText = 'QR code verified and ready for invoices.';
      }
    } catch (assetErr) {}

    if (notifSetRes && notifSetRes.data) {
      const n = notifSetRes.data;
      freshData.notificationSettings = {
        newServiceAlerts: n.notify_new_service !== false,
        serviceReadyAlerts: n.notify_status_ready !== false,
        paymentReceivedAlerts: n.notify_payment_received !== false,
        pendingDuesAlerts: n.notify_pending_dues !== false,
        staffRequestAlerts: n.notify_staff_requests !== false
      };
    }

    if (waRes && waRes.data) {
      const w = waRes.data;
      freshData.whatsappIntegration = {
        status: w.connection_status || 'Not Connected',
        businessPhone: w.business_phone || '',
        displayName: w.display_name || freshData.businessProfile.displayName,
        autoSendServiceUpdates: Boolean(w.auto_send_service_updates),
        autoSendInvoices: Boolean(w.auto_send_invoices)
      };
    }

    // Map Staff
    const staffRows = (staffRes && Array.isArray(staffRes.data)) ? staffRes.data : [];
    const staffByDbId = new Map();
    freshData.staff = staffRows.map((row, idx) => {
      const code = row.staff_code || `STF-${101 + idx}`;
      const mapped = {
        id: code,
        dbId: row.id,
        authUserId: row.auth_user_id || null,
        name: row.full_name,
        initials: getInitials(row.full_name),
        role: row.designation || 'Mechanic',
        phone: row.phone || '',
        email: row.email || '',
        approvedEmail: row.approved_email || row.email || '',
        address: row.address || '',
        joiningDateIso: row.joining_date ? String(row.joining_date).slice(0, 10) : '',
        joiningDate: row.joining_date ? parseSelectedDateMeta(String(row.joining_date).slice(0, 10)).formattedShort : '',
        enableLogin: Boolean(row.enable_login),
        approvalStatus: row.approval_status || 'pending',
        status: row.account_status || 'Pending Approval',
        accessStatus: row.account_status || 'Pending Approval',
        passwordSetAt: row.password_set_at || null,
        completedJobsCount: 0,
        permissions: Array.isArray(row.permitted_sections) && row.permitted_sections.length
          ? row.permitted_sections
          : ['Home', 'Service Tracking', 'Customer']
      };
      staffByDbId.set(row.id, mapped);
      return mapped;
    });

    // Map Vehicles grouped by customer UUID
    const vehRows = (vehRes && Array.isArray(vehRes.data)) ? vehRes.data : [];
    const vehByCustomerDbId = new Map();
    const vehByDbId = new Map();
    vehRows.forEach((v) => {
      const mappedV = {
        id: v.id,
        dbId: v.id,
        type: v.vehicle_type || 'Car',
        regNumber: v.reg_number || '',
        brand: v.brand || '',
        model: v.model || '',
        year: v.model_year || '',
        notes: v.notes || ''
      };
      vehByDbId.set(v.id, mappedV);
      if (!vehByCustomerDbId.has(v.customer_id)) vehByCustomerDbId.set(v.customer_id, []);
      vehByCustomerDbId.get(v.customer_id).push(mappedV);
    });

    // Map Customers
    const custRows = (custRes && Array.isArray(custRes.data)) ? custRes.data : [];
    const custByDbId = new Map();
    let maxCustNum = 0;
    freshData.customers = custRows.map((c, idx) => {
      const code = c.customer_code || `CUS-${String(custRows.length - idx).padStart(3, '0')}`;
      const numMatch = String(code).match(/(\d+)$/);
      if (numMatch) maxCustNum = Math.max(maxCustNum, parseInt(numMatch[1], 10));
      const mappedC = normalizeCustomer({
        id: code,
        dbId: c.id,
        name: c.full_name,
        initials: getInitials(c.full_name),
        phone: c.phone || '',
        email: c.email || '',
        address: c.address || '',
        totalVisits: 0,
        lastServiceDate: 'No visits yet',
        currentJobId: null,
        vehicles: vehByCustomerDbId.get(c.id) || [],
        serviceHistory: []
      });
      custByDbId.set(c.id, mappedC);
      return mappedC;
    });
    freshData.tenant.nextCustomerSeq = Math.max(maxCustNum + 1, freshData.customers.length + 1);

    // Map Service Job Staff join table
    const sjsRows = (sjsRes && Array.isArray(sjsRes.data)) ? sjsRes.data : [];
    const sjsByJobDbId = new Map();
    sjsRows.forEach((r) => {
      if (!sjsByJobDbId.has(r.job_id)) sjsByJobDbId.set(r.job_id, []);
      sjsByJobDbId.get(r.job_id).push(r.staff_id);
    });

    // Map Service Jobs
    const jobRows = (jobsRes && Array.isArray(jobsRes.data)) ? jobsRes.data : [];
    const jobByDbId = new Map();
    let maxJobNum = 1000;
    freshData.jobs = jobRows.map((j, idx) => {
      const code = j.job_code || `JOB-${1001 + (jobRows.length - 1 - idx)}`;
      const numMatch = String(code).match(/(\d+)$/);
      if (numMatch) maxJobNum = Math.max(maxJobNum, parseInt(numMatch[1], 10));
      const cust = custByDbId.get(j.customer_id);
      const veh = j.vehicle_id ? vehByDbId.get(j.vehicle_id) : null;
      const assignedDbIds = sjsByJobDbId.get(j.id) || (j.assigned_staff_id ? [j.assigned_staff_id] : []);
      const assignedStaffObjs = assignedDbIds.map((sid) => staffByDbId.get(sid)).filter(Boolean);
      const primaryStaff = assignedStaffObjs[0] || null;
      const createdShort = j.created_at ? parseSelectedDateMeta(String(j.created_at).slice(0, 10)).formattedShort : '';

      const mappedJ = {
        id: code,
        dbId: j.id,
        customerId: cust ? cust.id : '',
        customerDbId: j.customer_id,
        customerName: cust ? cust.name : 'Customer',
        customerPhone: cust ? cust.phone : '',
        vehicleId: veh ? veh.id : (j.vehicle_id || ''),
        vehicleNumber: j.vehicle_number_snapshot || (veh ? veh.regNumber : ''),
        vehicleModel: j.vehicle_model_snapshot || (veh ? `${veh.brand} ${veh.model}`.trim() : ''),
        vehicleType: j.vehicle_type_snapshot || (veh ? veh.type : 'Car'),
        complaint: j.complaint || '',
        inspectionNotes: j.service_notes || '',
        odometer: j.odometer_km !== null && j.odometer_km !== undefined ? String(j.odometer_km) : '',
        assignedStaffIds: assignedStaffObjs.map((s) => s.id),
        assignedStaffId: primaryStaff ? primaryStaff.id : '',
        assignedStaff: assignedStaffObjs.map((s) => s.name).join(', ') || 'Unassigned',
        assignedStaffShort: primaryStaff
          ? assignedStaffObjs.length > 1
            ? `${primaryStaff.name.split(' ')[0]} +${assignedStaffObjs.length - 1}`
            : primaryStaff.name.split(' ')[0]
          : 'Owner',
        assignedStaffInitials: primaryStaff ? primaryStaff.initials : 'GF',
        assignedStaffRole: primaryStaff ? primaryStaff.role : 'Owner',
        status: j.status || 'Received',
        receivedDate: createdShort,
        elapsedTime: createdShort || 'Recent',
        expectedDelivery: j.status === 'Ready' ? 'Ready for pickup' : 'Scheduled',
        invoiceId: null
      };
      jobByDbId.set(j.id, mappedJ);

      if (cust) {
        cust.totalVisits += 1;
        if (!cust.currentJobId) cust.currentJobId = code;
        if (cust.lastServiceDate === 'No visits yet' && createdShort) cust.lastServiceDate = createdShort;
        cust.serviceHistory.push({
          visitNumber: cust.totalVisits,
          jobId: code,
          vehicleReg: mappedJ.vehicleNumber,
          vehicleModel: mappedJ.vehicleModel,
          date: createdShort,
          description: mappedJ.complaint,
          status: mappedJ.status,
          amount: Number(j.estimated_amount) || 0,
          invoiceId: null
        });
      }
      return mappedJ;
    });
    freshData.tenant.nextJobSeq = Math.max(maxJobNum + 1, 1001);

    // Map Invoices, Items & Payments
    const itemsByInv = new Map();
    ((invItemsRes && Array.isArray(invItemsRes.data)) ? invItemsRes.data : []).forEach((it) => {
      if (!itemsByInv.has(it.invoice_id)) itemsByInv.set(it.invoice_id, []);
      itemsByInv.get(it.invoice_id).push({
        dbId: it.id,
        description: it.description,
        qty: Number(it.quantity) || 1,
        rate: Number(it.unit_rate) || 0,
        amount: Number(it.line_total) || 0
      });
    });

    const paysByInv = new Map();
    ((invPayRes && Array.isArray(invPayRes.data)) ? invPayRes.data : []).forEach((p, idx) => {
      if (!paysByInv.has(p.invoice_id)) paysByInv.set(p.invoice_id, []);
      paysByInv.get(p.invoice_id).push({
        id: `PAY-${idx + 1}`,
        dbId: p.id,
        date: p.paid_at ? parseSelectedDateMeta(String(p.paid_at).slice(0, 10)).formattedShort : '',
        amount: Number(p.amount) || 0,
        method: p.payment_method || 'Cash',
        reference: p.reference_note || '',
        notes: p.reference_note || ''
      });
    });

    const invRows = (invRes && Array.isArray(invRes.data)) ? invRes.data : [];
    freshData.invoices = invRows.map((inv) => {
      const cust = custByDbId.get(inv.customer_id);
      const job = inv.job_id ? jobByDbId.get(inv.job_id) : null;
      if (job) job.invoiceId = inv.invoice_number;
      return {
        id: inv.invoice_number,
        dbId: inv.id,
        customerId: cust ? cust.id : '',
        customerName: cust ? cust.name : 'Customer',
        customerPhone: cust ? cust.phone : '',
        vehicleNumber: job ? job.vehicleNumber : (cust && cust.vehicles[0] ? cust.vehicles[0].regNumber : ''),
        vehicleModel: job ? job.vehicleModel : (cust && cust.vehicles[0] ? `${cust.vehicles[0].brand} ${cust.vehicles[0].model}`.trim() : ''),
        vehicleType: job ? job.vehicleType : (cust && cust.vehicles[0] ? cust.vehicles[0].type : 'Car'),
        jobId: job ? job.id : '',
        date: inv.invoice_date ? parseSelectedDateMeta(String(inv.invoice_date)).formattedLong : '',
        discount: Number(inv.discount_amount) || 0,
        items: itemsByInv.get(inv.id) || [],
        payments: paysByInv.get(inv.id) || []
      };
    });

    return { ok: true, garageId, garageRow, data: freshData };
  },


  /**
   * Step 5: Hydrates a 100% isolated, non-financial workspace strictly for an Active Staff member.
   * Reads ONLY permitted tables/views (staff_garage_overview, staff_directory_view, customers,
   * vehicles, service_jobs, service_job_staff). Never queries invoices, payments, or owner settings.
   */
  async hydrateForStaff(client, staffRow) {
    if (!client || !staffRow || !staffRow.garage_id) {
      return { ok: false, error: 'Missing active staff garage context.' };
    }
    const garageId = staffRow.garage_id;

    const [garageRes, peerStaffRes, custRes, vehRes, jobsRes, sjsRes] = await Promise.all([
      client.from('staff_garage_overview').select('*').eq('garage_id', garageId).maybeSingle(),
      client.from('staff_directory_view').select('*').eq('garage_id', garageId),
      client.from('customers').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('vehicles').select('*').eq('garage_id', garageId).order('created_at', { ascending: true }),
      client.from('service_jobs').select('*').eq('garage_id', garageId).order('created_at', { ascending: false }),
      client.from('service_job_staff').select('*').eq('garage_id', garageId)
    ]);

    const gOverview = (garageRes && garageRes.data) ? garageRes.data : {};
    const freshData = this.createEmptyTenantData(
      {
        id: garageId,
        garage_name: gOverview.garage_name || 'GarageFlow Workshop',
        display_name: gOverview.display_name || gOverview.garage_name || 'GarageFlow Workshop',
        business_hours: gOverview.business_hours || '9:00 AM - 7:30 PM',
        working_days: gOverview.working_days || 'Mon - Sat',
        logo_storage_path: gOverview.logo_storage_path || ''
      },
      { owner_name: staffRow.full_name || 'Staff' }
    );

    // Map active peer staff from restricted staff_directory_view (no sensitive fields)
    const peerRows = (peerStaffRes && Array.isArray(peerStaffRes.data)) ? peerStaffRes.data : [];
    const staffByDbId = new Map();
    const myCode = staffRow.staff_code || 'STF-101';
    const selfMapped = {
      id: myCode,
      dbId: staffRow.id,
      authUserId: staffRow.auth_user_id || null,
      name: staffRow.full_name,
      initials: getInitials(staffRow.full_name),
      role: staffRow.designation || 'Mechanic',
      phone: staffRow.phone || '',
      email: staffRow.email || '',
      approvedEmail: staffRow.approved_email || staffRow.email || '',
      status: staffRow.account_status || 'Active',
      accessStatus: staffRow.account_status || 'Active',
      approvalStatus: staffRow.approval_status || 'approved',
      enableLogin: true,
      completedJobsCount: 0,
      permissions: ['Home', 'Service Tracking', 'Customer']
    };
    staffByDbId.set(staffRow.id, selfMapped);

    const mappedPeers = [];
    peerRows.forEach((p, idx) => {
      if (p.id === staffRow.id) {
        mappedPeers.push(selfMapped);
        return;
      }
      const peerObj = {
        id: `STF-${200 + idx}`,
        dbId: p.id,
        name: p.full_name,
        initials: getInitials(p.full_name),
        role: p.designation || 'Mechanic',
        phone: '',
        email: '',
        status: p.account_status || 'Active',
        accessStatus: p.account_status || 'Active',
        permissions: ['Home', 'Service Tracking', 'Customer']
      };
      staffByDbId.set(p.id, peerObj);
      mappedPeers.push(peerObj);
    });
    freshData.staff = mappedPeers.length > 0 ? mappedPeers : [selfMapped];

    // Map Vehicles
    const vehRows = (vehRes && Array.isArray(vehRes.data)) ? vehRes.data : [];
    const vehByCustomerDbId = new Map();
    const vehByDbId = new Map();
    vehRows.forEach((v) => {
      const mappedV = {
        id: v.id,
        dbId: v.id,
        type: v.vehicle_type || 'Car',
        regNumber: v.reg_number || '',
        brand: v.brand || '',
        model: v.model || '',
        year: v.model_year || '',
        notes: v.notes || ''
      };
      vehByDbId.set(v.id, mappedV);
      if (!vehByCustomerDbId.has(v.customer_id)) vehByCustomerDbId.set(v.customer_id, []);
      vehByCustomerDbId.get(v.customer_id).push(mappedV);
    });

    // Map Customers
    const custRows = (custRes && Array.isArray(custRes.data)) ? custRes.data : [];
    const custByDbId = new Map();
    let maxCustNum = 0;
    freshData.customers = custRows.map((c, idx) => {
      const code = c.customer_code || `CUS-${String(custRows.length - idx).padStart(3, '0')}`;
      const numMatch = String(code).match(/(\d+)$/);
      if (numMatch) maxCustNum = Math.max(maxCustNum, parseInt(numMatch[1], 10));
      const mappedC = normalizeCustomer({
        id: code,
        dbId: c.id,
        name: c.full_name,
        initials: getInitials(c.full_name),
        phone: c.phone || '',
        email: c.email || '',
        address: c.address || '',
        totalVisits: 0,
        lastServiceDate: 'No visits yet',
        currentJobId: null,
        vehicles: vehByCustomerDbId.get(c.id) || [],
        serviceHistory: []
      });
      custByDbId.set(c.id, mappedC);
      return mappedC;
    });
    freshData.tenant.nextCustomerSeq = Math.max(maxCustNum + 1, freshData.customers.length + 1);

    // Map Service Job Staff
    const sjsRows = (sjsRes && Array.isArray(sjsRes.data)) ? sjsRes.data : [];
    const sjsByJobDbId = new Map();
    sjsRows.forEach((r) => {
      if (!sjsByJobDbId.has(r.job_id)) sjsByJobDbId.set(r.job_id, []);
      sjsByJobDbId.get(r.job_id).push(r.staff_id);
    });

    // Map Service Jobs
    const jobRows = (jobsRes && Array.isArray(jobsRes.data)) ? jobsRes.data : [];
    let maxJobNum = 1000;
    freshData.jobs = jobRows.map((j, idx) => {
      const code = j.job_code || `JOB-${1001 + (jobRows.length - 1 - idx)}`;
      const numMatch = String(code).match(/(\d+)$/);
      if (numMatch) maxJobNum = Math.max(maxJobNum, parseInt(numMatch[1], 10));
      const cust = custByDbId.get(j.customer_id);
      const veh = j.vehicle_id ? vehByDbId.get(j.vehicle_id) : null;
      const assignedDbIds = sjsByJobDbId.get(j.id) || (j.assigned_staff_id ? [j.assigned_staff_id] : []);
      const assignedStaffObjs = assignedDbIds.map((sid) => staffByDbId.get(sid)).filter(Boolean);
      const primaryStaff = assignedStaffObjs[0] || null;
      const createdShort = j.created_at ? parseSelectedDateMeta(String(j.created_at).slice(0, 10)).formattedShort : '';

      const mappedJ = {
        id: code,
        dbId: j.id,
        customerId: cust ? cust.id : '',
        customerDbId: j.customer_id,
        customerName: cust ? cust.name : 'Customer',
        customerPhone: cust ? cust.phone : '',
        vehicleId: veh ? veh.id : (j.vehicle_id || ''),
        vehicleNumber: j.vehicle_number_snapshot || (veh ? veh.regNumber : ''),
        vehicleModel: j.vehicle_model_snapshot || (veh ? `${veh.brand} ${veh.model}`.trim() : ''),
        vehicleType: j.vehicle_type_snapshot || (veh ? veh.type : 'Car'),
        complaint: j.complaint || '',
        inspectionNotes: j.service_notes || '',
        odometer: j.odometer_km !== null && j.odometer_km !== undefined ? String(j.odometer_km) : '',
        assignedStaffIds: assignedStaffObjs.map((s) => s.id),
        assignedStaffId: primaryStaff ? primaryStaff.id : '',
        assignedStaff: assignedStaffObjs.map((s) => s.name).join(', ') || 'Unassigned',
        assignedStaffShort: primaryStaff
          ? assignedStaffObjs.length > 1
            ? `${primaryStaff.name.split(' ')[0]} +${assignedStaffObjs.length - 1}`
            : primaryStaff.name.split(' ')[0]
          : 'Staff',
        assignedStaffInitials: primaryStaff ? primaryStaff.initials : 'GF',
        assignedStaffRole: primaryStaff ? primaryStaff.role : 'Staff',
        status: j.status || 'Received',
        receivedDate: createdShort,
        elapsedTime: createdShort || 'Recent',
        expectedDelivery: j.status === 'Ready' ? 'Ready for pickup' : 'Scheduled',
        invoiceId: null
      };

      if (cust) {
        cust.totalVisits += 1;
        if (!cust.currentJobId) cust.currentJobId = code;
        if (cust.lastServiceDate === 'No visits yet' && createdShort) cust.lastServiceDate = createdShort;
        cust.serviceHistory.push({
          visitNumber: cust.totalVisits,
          jobId: code,
          vehicleReg: mappedJ.vehicleNumber,
          vehicleModel: mappedJ.vehicleModel,
          date: createdShort,
          description: mappedJ.complaint,
          status: mappedJ.status,
          amount: 0,
          invoiceId: null
        });
      }
      return mappedJ;
    });
    freshData.tenant.nextJobSeq = Math.max(maxJobNum + 1, 1001);
    freshData.invoices = [];

    return { ok: true, garageId, staffCode: myCode, data: freshData };
  },

  // --- Write-Through Helpers (run automatically for live Supabase sessions) ---
  async syncCustomer(customer, isUpdate = false) {
    if (!this.isLiveTenantSession() || !customer) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    try {
      if (isUpdate && customer.dbId) {
        await client.from('customers').update({
          full_name: customer.name,
          phone: customer.phone,
          email: customer.email || '',
          address: customer.address || ''
        }).eq('id', customer.dbId).eq('garage_id', garageId);
      } else {
        const { data, error } = await client.from('customers').insert({
          garage_id: garageId,
          customer_code: customer.id,
          full_name: customer.name,
          phone: customer.phone,
          email: customer.email || '',
          address: customer.address || ''
        }).select('id').single();
        if (!error && data && data.id) {
          customer.dbId = data.id;
          for (const v of (customer.vehicles || [])) {
            await this.syncVehicle(customer, v);
          }
        }
      }
    } catch (e) {
      showToast('Warning: Could not sync customer to Supabase.', 'warning');
    }
  },

  async syncVehicle(customer, vehicle) {
    if (!this.isLiveTenantSession() || !customer || !customer.dbId || !vehicle) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    try {
      const { data, error } = await client.from('vehicles').insert({
        garage_id: garageId,
        customer_id: customer.dbId,
        vehicle_type: ['Car', 'Bike', 'Scooter', 'Other'].includes(vehicle.type) ? vehicle.type : 'Car',
        reg_number: vehicle.regNumber,
        brand: vehicle.brand || '',
        model: vehicle.model || '',
        model_year: vehicle.year || '',
        notes: vehicle.notes || ''
      }).select('id').single();
      if (!error && data && data.id) {
        vehicle.dbId = data.id;
        vehicle.id = data.id;
      }
    } catch (e) {
      showToast('Warning: Could not sync vehicle to Supabase.', 'warning');
    }
  },

  async syncServiceJob(job, customer) {
    if (!this.isLiveTenantSession() || !job || !customer || !customer.dbId) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    const matchedVeh = (customer.vehicles || []).find((v) => v.id === job.vehicleId || v.regNumber === job.vehicleNumber);
    const primaryStaff = AppState.data.staff.find((s) => s.id === job.assignedStaffId);
    const odoNum = parseInt(String(job.odometer || '').replace(/\D/g, ''), 10);
    try {
      const { data, error } = await client.from('service_jobs').insert({
        garage_id: garageId,
        job_code: job.id,
        customer_id: customer.dbId,
        vehicle_id: matchedVeh && matchedVeh.dbId ? matchedVeh.dbId : null,
        assigned_staff_id: primaryStaff && primaryStaff.dbId ? primaryStaff.dbId : null,
        vehicle_number_snapshot: job.vehicleNumber || '',
        vehicle_model_snapshot: job.vehicleModel || '',
        vehicle_type_snapshot: job.vehicleType || 'Car',
        complaint: job.complaint || '',
        service_notes: job.inspectionNotes || '',
        odometer_km: !isNaN(odoNum) ? odoNum : null,
        status: job.status || 'Received'
      }).select('id').single();
      if (!error && data && data.id) {
        job.dbId = data.id;
        const staffRows = (job.assignedStaffIds || [])
          .map((sid) => AppState.data.staff.find((s) => s.id === sid))
          .filter((s) => s && s.dbId)
          .map((s) => ({ garage_id: garageId, job_id: data.id, staff_id: s.dbId }));
        if (staffRows.length > 0) {
          await client.from('service_job_staff').insert(staffRows);
        }
      }
    } catch (e) {
      showToast('Warning: Could not sync service job to Supabase.', 'warning');
    }
  },

  async syncJobStatus(job) {
    if (!this.isLiveTenantSession() || !job || !job.dbId) return;
    const client = this.getClient();
    try {
      await client.from('service_jobs').update({
        status: job.status,
        completed_at: job.status === 'Ready' ? new Date().toISOString() : null
      }).eq('id', job.dbId).eq('garage_id', AppState.user.garageId);
    } catch (e) {
      showToast('Warning: Could not update job status in Supabase.', 'warning');
    }
  },

  async syncStaffMember(staff, isUpdate = false) {
    if (!this.isLiveTenantSession() || !staff) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    const approvalVal = staff.approvalStatus === 'approved' ? 'approved' : staff.approvalStatus === 'rejected' ? 'rejected' : 'pending';
    const accStatus = ['Pending Approval', 'Approved – Setup Pending', 'Active', 'Suspended'].includes(staff.status)
      ? staff.status
      : 'Pending Approval';
    try {
      if (isUpdate && staff.dbId) {
        await client.from('staff_accounts').update({
          full_name: staff.name,
          designation: staff.role || 'Mechanic',
          phone: staff.phone || '',
          email: String(staff.email || '').toLowerCase(),
          approved_email: String(staff.approvedEmail || staff.email || '').toLowerCase(),
          address: staff.address || '',
          joining_date: staff.joiningDateIso || getLocalTodayIso(),
          enable_login: Boolean(staff.enableLogin),
          approval_status: approvalVal,
          account_status: accStatus
        }).eq('id', staff.dbId).eq('garage_id', garageId);
      } else {
        const { data, error } = await client.from('staff_accounts').insert({
          garage_id: garageId,
          staff_code: staff.id,
          full_name: staff.name,
          designation: staff.role || 'Mechanic',
          phone: staff.phone || '',
          email: String(staff.email || '').toLowerCase(),
          approved_email: String(staff.approvedEmail || staff.email || '').toLowerCase(),
          address: staff.address || '',
          joining_date: staff.joiningDateIso || getLocalTodayIso(),
          enable_login: Boolean(staff.enableLogin),
          approval_status: approvalVal,
          account_status: accStatus
        }).select('id').single();
        if (!error && data && data.id) {
          staff.dbId = data.id;
        }
      }
    } catch (e) {
      showToast('Warning: Could not sync staff member to Supabase.', 'warning');
    }
  },

  async syncInvoice(invoice, customer) {
    if (!this.isLiveTenantSession() || !invoice || !customer || !customer.dbId) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    const subtotal = (invoice.items || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const discount = Number(invoice.discount) || 0;
    const total = Math.max(0, subtotal - discount);
    const paid = (invoice.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const payStatus = paid >= total && total > 0 ? 'Paid' : paid > 0 ? 'Partially Paid' : 'Unpaid';
    const linkedJob = invoice.jobId ? AppState.getJobById(invoice.jobId) : null;
    try {
      const { data, error } = await client.from('invoices').insert({
        garage_id: garageId,
        invoice_number: invoice.id,
        customer_id: customer.dbId,
        job_id: linkedJob && linkedJob.dbId ? linkedJob.dbId : null,
        subtotal,
        discount_amount: discount,
        total_amount: total,
        paid_amount: paid,
        payment_status: payStatus
      }).select('id').single();
      if (!error && data && data.id) {
        invoice.dbId = data.id;
        const itemRows = (invoice.items || []).map((it, idx) => ({
          garage_id: garageId,
          invoice_id: data.id,
          sort_order: idx,
          description: it.description,
          quantity: Number(it.qty) || 1,
          unit_rate: Number(it.rate) || 0,
          line_total: Number(it.amount) || 0
        }));
        if (itemRows.length > 0) await client.from('invoice_items').insert(itemRows);
        for (const p of (invoice.payments || [])) {
          await client.from('invoice_payments').insert({
            garage_id: garageId,
            invoice_id: data.id,
            amount: Number(p.amount) || 0,
            payment_method: ['Cash', 'UPI', 'Card', 'Bank Transfer', 'Other'].includes(p.method) ? p.method : 'Cash',
            reference_note: p.notes || p.reference || ''
          });
        }
        await client.from('invoice_settings').update({
          next_sequence: AppState.data.tenant.nextInvoiceSeq || 1
        }).eq('garage_id', garageId);
      }
    } catch (e) {
      showToast('Warning: Could not sync invoice to Supabase.', 'warning');
    }
  },

  async syncInvoiceUpdate(invoice) {
    if (!this.isLiveTenantSession() || !invoice || !invoice.dbId) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    const subtotal = (invoice.items || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const discount = Number(invoice.discount) || 0;
    const total = Math.max(0, subtotal - discount);
    const paid = (invoice.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const payStatus = paid >= total && total > 0 ? 'Paid' : paid > 0 ? 'Partially Paid' : 'Unpaid';
    try {
      await client
        .from('invoices')
        .update({
          subtotal,
          discount_amount: discount,
          total_amount: total,
          paid_amount: paid,
          payment_status: payStatus
        })
        .eq('id', invoice.dbId)
        .eq('garage_id', garageId);

      // Replace only invoice_items for this existing invoice; never touch invoice_payments
      await client
        .from('invoice_items')
        .delete()
        .eq('invoice_id', invoice.dbId)
        .eq('garage_id', garageId);

      const itemRows = (invoice.items || []).map((it, idx) => ({
        garage_id: garageId,
        invoice_id: invoice.dbId,
        sort_order: idx,
        description: it.description,
        quantity: Number(it.qty) || 1,
        unit_rate: Number(it.rate) || 0,
        line_total: Number(it.amount) || 0
      }));
      if (itemRows.length > 0) {
        await client.from('invoice_items').insert(itemRows);
      }
    } catch (e) {
      showToast('Warning: Could not sync updated invoice to Supabase.', 'warning');
    }
  },

  async syncPayment(invoice, payment) {
    if (!this.isLiveTenantSession() || !invoice || !invoice.dbId || !payment) return;
    const client = this.getClient();
    const garageId = AppState.user.garageId;
    const subtotal = (invoice.items || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const total = Math.max(0, subtotal - (Number(invoice.discount) || 0));
    const paid = (invoice.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const payStatus = paid >= total && total > 0 ? 'Paid' : paid > 0 ? 'Partially Paid' : 'Unpaid';
    try {
      await client.from('invoice_payments').insert({
        garage_id: garageId,
        invoice_id: invoice.dbId,
        amount: Number(payment.amount) || 0,
        payment_method: ['Cash', 'UPI', 'Card', 'Bank Transfer', 'Other'].includes(payment.method) ? payment.method : 'Cash',
        reference_note: payment.reference || payment.notes || ''
      });
      await client.from('invoices').update({
        paid_amount: paid,
        payment_status: payStatus
      }).eq('id', invoice.dbId).eq('garage_id', garageId);
    } catch (e) {
      showToast('Warning: Could not sync payment to Supabase.', 'warning');
    }
  },

  async syncBusinessProfile(bp) {
    if (!this.isLiveTenantSession() || !bp) return;
    const client = this.getClient();
    try {
      await client.from('garages').update({
        garage_name: bp.garageName || '',
        display_name: bp.displayName || bp.garageName || '',
        owner_name: bp.ownerName || '',
        business_phone: bp.phone || '',
        email: bp.email || '',
        address: bp.address || '',
        pin_code: bp.pinCode || '',
        business_type: bp.businessType || '',
        business_hours: bp.businessHours || '',
        working_days: bp.workingDays || ''
      }).eq('id', AppState.user.garageId);
    } catch (e) {}
  },

  getAssetCacheKey(garageId) {
    const gid = String(garageId || (AppState.user && AppState.user.garageId) || (AppState.data && AppState.data.tenant && AppState.data.tenant.id) || '').trim();
    return gid ? `garageflow_owner_assets_${gid}` : '';
  },

  readOwnerAssetCache(garageId) {
    const key = this.getAssetCacheKey(garageId);
    if (!key) return {};
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  },

  writeOwnerAssetCache(garageId, partial) {
    const key = this.getAssetCacheKey(garageId);
    if (!key) return;
    try {
      const current = this.readOwnerAssetCache(garageId);
      const next = { ...current, ...partial };
      localStorage.setItem(key, JSON.stringify(next));
    } catch (e) {}
  },

  async dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl || '').split(',');
    if (parts.length < 2) return null;
    const mimeMatch = parts[0].match(/data:([^;]+);base64/i);
    const mime = mimeMatch ? mimeMatch[1] : 'image/png';
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  },

  async blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  },

  async syncGarageAsset(assetKind, dataUrl) {
    const garageId = (AppState.user && AppState.user.garageId) || (AppState.data && AppState.data.tenant && AppState.data.tenant.id) || '';
    if (!garageId) return;
    const fieldMap = { logo: 'logoDataUrl', signature: 'signatureDataUrl', qr: 'qrCodeDataUrl' };
    const cacheField = fieldMap[assetKind];
    if (cacheField) {
      this.writeOwnerAssetCache(garageId, { [cacheField]: dataUrl || null });
    }
    if (!this.isLiveTenantSession()) return;
    const client = this.getClient();
    const storagePath = `${garageId}/${assetKind}.png`;
    try {
      if (dataUrl) {
        const blob = await this.dataUrlToBlob(dataUrl);
        if (blob) {
          await client.storage.from('garage-assets').upload(storagePath, blob, {
            upsert: true,
            contentType: blob.type || 'image/png'
          });
          if (assetKind === 'logo') {
            await client.from('garages').update({ logo_storage_path: storagePath }).eq('id', garageId);
          }
        }
      } else {
        await client.storage.from('garage-assets').remove([storagePath]);
        if (assetKind === 'logo') {
          await client.from('garages').update({ logo_storage_path: null }).eq('id', garageId);
        }
      }
    } catch (e) {}
  },

  async loadGarageAssets(garageId) {
    const result = {
      logoDataUrl: null,
      signatureDataUrl: null,
      qrCodeDataUrl: null
    };
    const cached = this.readOwnerAssetCache(garageId);
    if (cached.logoDataUrl) result.logoDataUrl = cached.logoDataUrl;
    if (cached.signatureDataUrl) result.signatureDataUrl = cached.signatureDataUrl;
    if (cached.qrCodeDataUrl) result.qrCodeDataUrl = cached.qrCodeDataUrl;

    if (!this.isLiveTenantSession() || !garageId) return result;
    const client = this.getClient();
    const kinds = [
      { kind: 'logo', key: 'logoDataUrl' },
      { kind: 'signature', key: 'signatureDataUrl' },
      { kind: 'qr', key: 'qrCodeDataUrl' }
    ];
    await Promise.all(
      kinds.map(async ({ kind, key }) => {
        try {
          const { data, error } = await client.storage.from('garage-assets').download(`${garageId}/${kind}.png`);
          if (!error && data) {
            const dUrl = await this.blobToDataUrl(data);
            if (dUrl) result[key] = dUrl;
          }
        } catch (e) {}
      })
    );
    this.writeOwnerAssetCache(garageId, result);
    return result;
  },

  async syncInvoiceSettings(cfg, changedPayload = null) {
    if (!cfg) return;
    if (changedPayload) {
      if (Object.prototype.hasOwnProperty.call(changedPayload, 'logoDataUrl')) {
        this.syncGarageAsset('logo', changedPayload.logoDataUrl);
      }
      if (Object.prototype.hasOwnProperty.call(changedPayload, 'signatureDataUrl')) {
        this.syncGarageAsset('signature', changedPayload.signatureDataUrl);
      }
      if (Object.prototype.hasOwnProperty.call(changedPayload, 'qrCodeDataUrl')) {
        this.syncGarageAsset('qr', changedPayload.qrCodeDataUrl);
      }
    }
    if (!this.isLiveTenantSession()) return;
    const client = this.getClient();
    try {
      await client.from('invoice_settings').update({
        invoice_prefix: cfg.invoicePrefix || 'INV-',
        number_format: cfg.invoiceFormat || 'INV-001',
        next_sequence: Math.max(1, Number(cfg.currentInvoiceSeq) || 1),
        gst_enabled: Boolean(cfg.gstEnabled),
        gstin: cfg.gstin || '',
        default_tax_rate: Number(cfg.defaultTaxRate) || 0,
        upi_id: cfg.upiId || '',
        upi_payee_name: cfg.upiPayeeName || '',
        bank_details: cfg.bankDetails || '',
        terms_and_notes: cfg.termsAndNotes || '',
        show_logo_on_invoice: cfg.showLogoOnInvoice !== false
      }).eq('garage_id', AppState.user.garageId);
    } catch (e) {}
  },

  async syncNotificationSettings(ns) {
    if (!this.isLiveTenantSession() || !ns) return;
    const client = this.getClient();
    try {
      await client.from('notification_settings').update({
        notify_new_service: ns.newServiceAlerts !== false,
        notify_status_ready: ns.serviceReadyAlerts !== false,
        notify_payment_received: ns.paymentReceivedAlerts !== false,
        notify_pending_dues: ns.pendingDuesAlerts !== false,
        notify_staff_requests: ns.staffRequestAlerts !== false
      }).eq('garage_id', AppState.user.garageId);
    } catch (e) {}
  }
};

// ==========================================================================
// GarageFlow — Supabase Authentication, PostgreSQL & Email Invitation Service
// ==========================================================================
const SUPABASE_CFG_KEY = 'garageflow_supabase_config_v1';

const SupabaseService = {
  client: null,
  _mockAuthVault: new Map(), // Ephemeral in-memory test vault when testing without external internet

  getConfig() {
    try {
      const raw = localStorage.getItem(SUPABASE_CFG_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          supabaseUrl: String(parsed.supabaseUrl || '').trim(),
          supabaseAnonKey: String(parsed.supabaseAnonKey || '').trim(),
          publicAppUrl: String(parsed.publicAppUrl || '').trim()
        };
      }
    } catch (e) {
      // Ignore storage errors
    }
    return {
      supabaseUrl: (window.GARAGEFLOW_SUPABASE_CONFIG && window.GARAGEFLOW_SUPABASE_CONFIG.supabaseUrl) || '',
      supabaseAnonKey: (window.GARAGEFLOW_SUPABASE_CONFIG && window.GARAGEFLOW_SUPABASE_CONFIG.supabaseAnonKey) || '',
      publicAppUrl: (window.GARAGEFLOW_SUPABASE_CONFIG && window.GARAGEFLOW_SUPABASE_CONFIG.publicAppUrl) || ''
    };
  },

  saveConfig({ supabaseUrl, supabaseAnonKey, publicAppUrl }) {
    const cleanUrl = String(supabaseUrl || '').trim().replace(/\/+$/, '');
    const cleanKey = String(supabaseAnonKey || '').trim();
    const cleanAppUrl = String(publicAppUrl || '').trim();

    // Security check: Reject service_role keys in frontend code (Step 5 Rule 8)
    if (cleanKey.split('.').length === 3) {
      try {
        const payloadJson = atob(cleanKey.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'));
        if (payloadJson.includes('"service_role"')) {
          return {
            ok: false,
            error: 'Security Violation: Never enter your SUPABASE_SERVICE_ROLE_KEY in the frontend browser. Please use your public anon key only.'
          };
        }
      } catch (e) {
        // Ignore base64 decode errors
      }
    }

    try {
      localStorage.setItem(
        SUPABASE_CFG_KEY,
        JSON.stringify({
          supabaseUrl: cleanUrl,
          supabaseAnonKey: cleanKey,
          publicAppUrl: cleanAppUrl
        })
      );
    } catch (e) {
      // Ignore storage errors
    }
    this.client = null;
    this.getClient();
    return { ok: true };
  },

  isConfigured() {
    if (SuperadminService && SuperadminService.getActiveClient()) return true;
    const cfg = this.getConfig();
    return Boolean(cfg.supabaseUrl && cfg.supabaseAnonKey && /^https:\/\/.+\.supabase\.co/i.test(cfg.supabaseUrl));
  },

  getClient() {
    const active = SuperadminService && SuperadminService.getActiveClient();
    if (active) return active;
    if (this.client) return this.client;
    const cfg = this.getConfig();
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return null;
    if (typeof window !== 'undefined' && window.supabase && typeof window.supabase.createClient === 'function') {
      this.client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
        auth: {
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      });
    }
    return this.client;
  },

  buildAccountSetupUrl(staff) {
    let baseUrl = '';
    if (typeof window !== 'undefined' && window.location && /^https?:/.test(window.location.protocol)) {
      baseUrl = `${window.location.origin}${window.location.pathname}`;
    } else {
      const cfg = this.getConfig();
      baseUrl = cfg.publicAppUrl || (typeof window !== 'undefined' ? window.location.href.split('?')[0].split('#')[0] : '');
    }
    const tokenNonce = 'inv_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
    staff.invitationToken = tokenNonce;
    staff.invitationExpiresAt = Date.now() + 24 * 60 * 60 * 1000; // 24h validity
    staff.invitationUsed = false;
    const targetStaffId = staff.dbId || staff.id;
    return `${baseUrl}?setup_staff=1&email=${encodeURIComponent(staff.email)}&staff_id=${encodeURIComponent(targetStaffId)}`;
  },

  /**
   * Step 2: Initiates a real Supabase Auth email invitation to the approved Staff member.
   * Never claims an email was sent unless Supabase confirms delivery initiation.
   */
  async sendStaffInvitationEmail(staff) {
    const client = this.getClient();

    if (!client) {
      const fallbackUrl = this.buildAccountSetupUrl(staff);
      return {
        ok: false,
        emailSent: false,
        setupUrl: fallbackUrl,
        error: 'Supabase client is not initialized. Check your internet connection.'
      };
    }

    // Ensure staff_accounts row is synced in Supabase first so staff.dbId (UUID) exists for the setup link
    if (TenantDataService.isLiveTenantSession()) {
      await TenantDataService.syncStaffMember(staff, Boolean(staff.dbId));
    }

    const redirectTo = this.buildAccountSetupUrl(staff);

    try {
      const targetEmail = String(staff.approvedEmail || staff.email || '').trim().toLowerCase();
      const { error: otpError } = await client.auth.signInWithOtp({
        email: targetEmail,
        options: {
          shouldCreateUser: true,
          emailRedirectTo: redirectTo,
          data: {
            staff_id: staff.dbId || staff.id,
            full_name: staff.name,
            role: 'staff',
            designation: staff.role
          }
        }
      });

      if (otpError) {
        return {
          ok: false,
          emailSent: false,
          setupUrl: redirectTo,
          error: `Supabase email error: ${otpError.message}`
        };
      }

      staff.invitationSentAt = new Date().toISOString();
      return {
        ok: true,
        emailSent: true,
        deliveryMethod: 'supabase_auth_otp',
        setupUrl: redirectTo,
        message: `Invitation email sent via Supabase Auth to ${targetEmail}.`
      };
      try {
        await client.from('staff_accounts').upsert(
          {
            id: staff.id,
            name: staff.name,
            email: staff.email.toLowerCase(),
            phone: staff.phone,
            role: staff.role,
            approval_status: 'approved',
            account_status: 'Approved – Setup Pending',
            invitation_sent_at: new Date().toISOString()
          },
          { onConflict: 'email' }
        );
      } catch (dbErr) {
        // Non-fatal if table migration hasn't been executed yet
      }

      staff.invitationSentAt = new Date().toISOString();
      return {
        ok: true,
        emailSent: true,
        deliveryMethod: 'supabase_auth_email_link',
        setupUrl: redirectTo,
        message: `Supabase Auth initiated invitation email to ${staff.email}. Check Gmail Inbox and Spam.`
      };
    } catch (err) {
      return {
        ok: false,
        emailSent: false,
        setupUrl: redirectTo,
        error: `Network or Supabase connection error: ${err && err.message ? err.message : 'Unable to reach Supabase.'}`
      };
    }
  },

  /**
   * Step 3: Verifies the invitation link parameters and Supabase Auth session
   */
  async verifyInvitationSession(params = {}) {
    const client = this.getClient();
    let invitedEmail = String(params.email || '').trim().toLowerCase();
    const staffId = String(params.staffId || '').trim();
    const inviteToken = String(params.inviteToken || '').trim();

    // Check URL query/hash for Supabase token_hash, code, or access_token
    if (typeof window !== 'undefined' && client) {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const tokenHash = urlParams.get('token_hash');
        const type = urlParams.get('type') || 'invite';
        const errorDesc = urlParams.get('error_description');

        if (errorDesc) {
          if (errorDesc.toLowerCase().includes('expired')) {
            return { ok: false, code: 'expired_link', error: 'This invitation link has expired. Please ask your Garage Admin to resend the invitation.' };
          }
          return { ok: false, code: 'invalid_link', error: decodeURIComponent(errorDesc.replace(/\+/g, ' ')) };
        }

        if (tokenHash) {
          const { data, error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: type === 'recovery' ? 'recovery' : type === 'magiclink' ? 'magiclink' : 'invite'
          });
          if (error) {
            return {
              ok: false,
              code: error.message.toLowerCase().includes('expired') ? 'expired_link' : 'invalid_link',
              error: `Invitation link verification failed: ${error.message}`
            };
          }
          if (data && data.user && data.user.email) {
            invitedEmail = data.user.email.toLowerCase();
          }
        } else {
          const authCode = urlParams.get('code');
          if (authCode && typeof client.auth.exchangeCodeForSession === 'function') {
            await client.auth.exchangeCodeForSession(authCode);
          }
          let { data: sessionData } = await client.auth.getSession();
          if (!sessionData || !sessionData.session) {
            await new Promise((r) => setTimeout(r, 450));
            const retry = await client.auth.getSession();
            sessionData = retry.data;
          }
          if (sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.email) {
            const sessionEmail = sessionData.session.user.email.toLowerCase();
            if (invitedEmail && invitedEmail !== sessionEmail) {
              return {
                ok: false,
                code: 'email_mismatch',
                error: `Email mismatch: This invitation link belongs to ${sessionEmail}, not ${invitedEmail}.`
              };
            }
            invitedEmail = sessionEmail;
            const metaStaffId = (sessionData.session.user.user_metadata && sessionData.session.user.user_metadata.staff_id) || '';
            const resolvedDbId = staffId || metaStaffId;
            if (resolvedDbId) {
              return {
                ok: true,
                email: sessionEmail,
                staff: {
                  id: resolvedDbId,
                  dbId: resolvedDbId,
                  name: (sessionData.session.user.user_metadata && sessionData.session.user.user_metadata.full_name) || sessionEmail,
                  email: sessionEmail,
                  approvedEmail: sessionEmail,
                  status: 'Approved – Setup Pending',
                  approvalStatus: 'approved',
                  enableLogin: true
                }
              };
            }
          }
        }
      } catch (e) {
        return { ok: false, code: 'network_error', error: 'Network error while verifying your invitation with Supabase.' };
      }
    }

    // Locate the matching local Staff record (preview/offline fallback)
    const staffRecord = AppState.data.staff.find(
      (s) =>
        (invitedEmail && (s.email.toLowerCase() === invitedEmail || (s.approvedEmail && s.approvedEmail.toLowerCase() === invitedEmail))) ||
        (staffId && (s.id === staffId || s.dbId === staffId))
    );

    if (!staffRecord) {
      return {
        ok: false,
        code: 'invalid_link',

            .select('id, owner_name, garage_name, owner_email, status')
            .eq('auth_user_id', data.user.id)
            .maybeSingle();
          if (tblRow) {
            ownerStatus = String(tblRow.status || '');
            if (tblRow.status === 'Active') {
              ownerInfo = {
                owner_id: tblRow.id,
                owner_name: tblRow.owner_name,
                garage_name: tblRow.garage_name,
                owner_email: tblRow.owner_email,
                status: tblRow.status
              };
            }
          }
        } catch (tblCatch) {
          // Ignore fallback errors
        }
      }

      if (!ownerInfo) {
        try {
          await activeClient.auth.signOut();
        } catch (soErr) {
          // Ignore sign-out errors
        }
        if (ownerStatus === 'Setup Pending') {
          return {
            ok: false,
            field: 'email',
            error: 'Your owner account is still Setup Pending. Please click the setup link in your Gmail to set your password first.'
          };
        }
        if (ownerStatus === 'Suspended') {
          return {
            ok: false,
            field: 'email',
            error: 'This Garage Owner account has been Suspended. Contact Superadmin.'
          };
        }
        return {
          ok: false,
          field: 'email',
          error: 'Access denied: This account is not registered as an active Garage Owner.'
        };
      }

      // Step 4: Hydrate a 100% isolated, clean workspace strictly from this Owner's Supabase garage_id
      // (Never shows old demo localStorage records or another owner's data!)
      const hydrated = await TenantDataService.hydrateForOwner(activeClient, ownerInfo);
      this.data = hydrated.data || TenantDataService.createEmptyTenantData({}, ownerInfo);
      // Force zero demo records if somehow anything lingered
      if (!hydrated.garageId) {
        this.data.customers = [];
        this.data.jobs = [];
        this.data.staff = [];
        this.data.invoices = [];
      }

      this.user = {
        role: 'admin',
        isSupabaseLive: true,
        garageId: hydrated.garageId || null,
        authUserId: data.user.id,
        ownerAccountId: ownerInfo.owner_id || null,
        label: 'Owner / Admin',
        name: ownerInfo.owner_name || data.user.email,
        garageName: ownerInfo.garage_name || this.data.businessProfile.garageName,
        email: ownerInfo.owner_email || data.user.email,
        permissions: ['Home', 'Service Tracking', 'Customer', 'Payments', 'Settings', 'Staff Management']
      };
      this.notify();
      return { ok: true, user: this.user };
    } catch (err) {
      return {
        ok: false,
        field: 'password',
        error: `Authentication error: ${err && err.message ? err.message : 'Unable to reach Supabase Auth.'}`
      };
    }
  },

  logout() {
    const wasLive = Boolean(this.user && this.user.isSupabaseLive);
    const activeClient = SuperadminService.getActiveClient();
    if (activeClient && activeClient.auth && typeof activeClient.auth.signOut === 'function') {
      activeClient.auth.signOut().catch(() => {});
    }
    this.user = null;
    this.currentRoute = 'login';
    if (wasLive) {
      // Wipe in-memory live tenant records so another user on the same device never sees them
      this.data = loadPersistedData();
    }
    this.listeners.forEach((fn) => fn(this));
