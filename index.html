<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GarageFlow — Garage Management System</title>
  <style>
/* ==========================================================================
   GarageFlow — Core Design System & Base Styles (style.css)
   Mobile-first typography, design tokens, and strict overflow prevention
   ========================================================================== */

:root {
  /* Brand & Semantic Colors */
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-light: #eff6ff;
  --color-primary-border: #bfdbfe;
  --color-primary-glow: rgba(37, 99, 235, 0.18);

  --color-success: #16a34a;
  --color-success-light: #ecfdf5;
  --color-success-border: #bbf7d0;

  --color-warning: #ea580c;
  --color-warning-amber: #f59e0b;
  --color-warning-light: #fff7ed;
  --color-warning-border: #fed7aa;

  --color-danger: #dc2626;
  --color-danger-light: #fef2f2;
  --color-danger-border: #fecaca;

  /* Neutral & Surface Colors */
  --color-background: #f4f7fe;
  --color-surface: #ffffff;
  --color-surface-subtle: #f8fafc;
  --color-surface-blue: #f0f5ff;
  --color-text: #0f172a;
  --color-text-secondary: #334155;
  --color-muted: #64748b;
  --color-light-muted: #94a3b8;
  --color-border: #e2e8f0;
  --color-border-subtle: #edf2f7;

  /* Mobile-First Typography Scale (Section 6 Guidelines) */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  --text-xs: 0.75rem;      /* 12px - small labels */
  --text-sm: 0.875rem;     /* 14px - secondary information */
  --text-base: 1rem;       /* 16px - body text & buttons */
  --text-lg: 1.125rem;     /* 18px - card headings */
  --text-xl: 1.25rem;      /* 20px - prominent card headings */
  --text-2xl: 1.375rem;    /* 22px - section headings */
  --text-3xl: 1.75rem;     /* 28px - main page headings on mobile */

  /* Border Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-input: 14px;
  --radius-card: 20px;
  --radius-modal: 24px;
  --radius-pill: 9999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
  --shadow-card: 0 4px 16px rgba(37, 99, 235, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 10px 25px -5px rgba(37, 99, 235, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
  --shadow-button: 0 4px 12px rgba(37, 99, 235, 0.26);
  --shadow-modal: 0 -8px 32px rgba(15, 23, 42, 0.16);

  /* Spacing & Layout */
  --space-1: 0.25rem;   /* 4px */
  --space-2: 0.5rem;    /* 8px */
  --space-3: 0.75rem;   /* 12px */
  --space-4: 1rem;      /* 16px */
  --space-5: 1.25rem;   /* 20px */
  --space-6: 1.5rem;    /* 24px */
  --space-8: 2rem;      /* 32px */

  --page-padding-x: clamp(14px, 4.2vw, 20px);
  --sidebar-width: 264px;
  --bottom-nav-height: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 240ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
  overflow-x: hidden;
  width: 100%;
}

body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  background-color: var(--color-background);
  color: var(--color-text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}

svg {
  display: block;
  flex-shrink: 0;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  touch-action: manipulation;
}

a {
  color: var(--color-primary);
  text-decoration: none;
}

ul, ol {
  list-style: none;
}

/* Focus Accessibility */
:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

/* App Shell Layout */
.app-shell {
  display: flex;
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--color-background);
  overflow-x: hidden;
}

/* Fixed non-scrolling mobile viewport shell for the Login Screen */
.app-shell.auth-layout {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  width: 100%;
  height: var(--vvh, 100vh);
  height: var(--vvh, 100dvh);
  min-height: 0;
  max-height: var(--vvh, 100dvh);
  overflow: hidden;
  overscroll-behavior: none;
  background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 50%, #f5f8ff 100%);
  padding: 0;
}

.app-shell.auth-layout #screen-outlet {
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#screen-outlet {
  width: 100%;
  min-width: 0;
}

.app-main {
  flex: 1;
  width: 100%;
  min-width: 0;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 28px);
  display: flex;
  flex-direction: column;
}

.page-container {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-4) var(--page-padding-x);
}

/* Typography System */
.eyebrow {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-muted);
  margin-bottom: 2px;
}

.page-greeting {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-text-secondary);
  line-height: 1.3;
}

.page-title {
  font-size: clamp(1.65rem, 5vw, 2rem); /* 26.4px - 32px */
  font-weight: 800;
  color: var(--color-text);
  letter-spacing: -0.02em;
  line-height: 1.2;
  overflow-wrap: break-word;
}

.page-subtitle {
  font-size: var(--text-sm); /* 14px */
  color: var(--color-muted);
  margin-top: 3px;
  line-height: 1.4;
}

.section-title {
  font-size: clamp(1.2rem, 3.8vw, 1.4rem); /* 19.2px - 22.4px */
  font-weight: 800;
  color: var(--color-text);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  line-height: 1.3;
}

.card-title {
  font-size: var(--text-lg); /* 18px */
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.3;
}

.text-muted { color: var(--color-muted); }
.text-primary { color: var(--color-primary); }
.text-success { color: var(--color-success); }
.text-warning { color: var(--color-warning); }
.text-danger { color: var(--color-danger); }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.break-anywhere { overflow-wrap: anywhere; word-break: break-word; }

/* Print Styles for Bill Details */
@media print {
  body {
    background: #ffffff !important;
  }
  .sidebar-nav,
  .bottom-nav,
  .no-print,
  .top-icon-actions,
  .invoice-action-buttons,
  .toast-container {
    display: none !important;
  }
  .app-main {
    padding: 0 !important;
  }
  .page-container {
    max-width: 100% !important;
    padding: 0 !important;
  }
  .card {
    box-shadow: none !important;
    border: 1px solid #cbd5e1 !important;
    break-inside: avoid;
  }
}


/* ==========================================================================
   GarageFlow — Reusable UI Components & Screen Layouts (components.css)
   Covers all 11 reference screens, 1-row 3-card dashboard, invoice preview,
   Settings, Business Profile, WhatsApp Integration & Logout Confirmation
   ========================================================================== */

/* 1. Cards & Surfaces */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-card);
  border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-card);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
  width: 100%;
  max-width: 100%;
  min-width: 0;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.card-interactive {
  cursor: pointer;
}

.card-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-elevated);
  border-color: var(--color-primary-border);
}

.card-subtle {
  background: var(--color-surface-blue);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  border: 1px solid #dbeafe;
  min-width: 0;
}

.info-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #eaf1ff;
  border: 1px solid #dbeafe;
  border-radius: 14px;
  padding: 11px 14px;
  margin-bottom: var(--space-4);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  line-height: 1.4;
}

/* 2. Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 0.9375rem;
  line-height: 1.25;
  border-radius: var(--radius-input);
  padding: 0.72rem 1rem;
  min-height: 44px;
  transition: all var(--transition-fast);
  text-align: center;
  user-select: none;
  max-width: 100%;
}

.btn svg {
  flex-shrink: 0;
}

.btn-primary {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: var(--shadow-button);
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
  transform: translateY(-1px);
}

.btn-primary:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-pill {
  border-radius: var(--radius-pill);
}

.btn-block {
  width: 100%;
}

.btn-lg {
  padding: 0.88rem 1.25rem;
  font-size: 1rem;
  font-weight: 700;
  border-radius: var(--radius-pill);
  min-height: 50px;
}

.btn-outline {
  background: var(--color-surface);
  color: var(--color-primary);
  border: 1.5px solid var(--color-primary-border);
}

.btn-outline:hover {
  background: var(--color-primary-light);
  border-color: var(--color-primary);
}

.btn-neutral-outline {
  background: var(--color-surface);
  color: var(--color-text-secondary);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-pill);
  font-weight: 700;
}

.btn-neutral-outline:hover {
  background: var(--color-surface-subtle);
  color: var(--color-text);
}

.btn-soft-blue {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border: 1px solid var(--color-primary-border);
}

.btn-soft-blue:hover {
  background: #dbeafe;
}

.btn-whatsapp {
  background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
  color: #ffffff;
  border-radius: var(--radius-pill);
  padding: 0.65rem 1.1rem;
  min-height: 44px;
  font-size: var(--text-sm);
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
  flex-shrink: 0;
}

.btn-whatsapp:hover {
  background: #15803d;
}

.btn-whatsapp-soft {
  background: var(--color-success-light);
  color: var(--color-success);
  border: 1.5px solid var(--color-success-border);
  font-weight: 700;
}

.btn-danger-outline {
  background: var(--color-danger-light);
  color: var(--color-danger);
  border: 1.5px solid var(--color-danger-border);
  border-radius: var(--radius-pill);
  font-weight: 700;
}

.btn-danger-outline:hover {
  background: #fee2e2;
}

.btn-danger-solid {
  background: var(--color-danger);
  color: #ffffff;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.28);
}

.btn-danger-solid:hover {
  background: #b91c1c;
}

.btn-cancel-neutral {
  background: #f1f5f9;
  color: var(--color-text);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  font-weight: 700;
}

.btn-cancel-neutral:hover {
  background: #e2e8f0;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--color-surface-blue);
  color: var(--color-text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border: 1px solid #dbeafe;
  flex-shrink: 0;
  transition: background var(--transition-fast);
}

.icon-btn:hover {
  background: #dbeafe;
  color: var(--color-primary);
}

.icon-btn-sm {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.icon-btn-sm:hover {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border-color: var(--color-primary-border);
}

.icon-btn-danger {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--color-danger-light);
  color: var(--color-danger);
  border: 1px solid var(--color-danger-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.icon-btn-danger:hover {
  background: #fee2e2;
}

.notification-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  background: var(--color-danger);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--color-surface);
}

/* 3. Status Badges & Dots */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0.22rem 0.65rem;
  font-size: var(--text-xs);
  font-weight: 700;
  border-radius: var(--radius-pill);
  line-height: 1.2;
  white-space: nowrap;
  flex-shrink: 0;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.dot-green { background: var(--color-success); }
.dot-orange { background: var(--color-warning); }
.dot-red { background: var(--color-danger); }
.dot-gray { background: #475569; }

.badge-primary, .badge-in-progress {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border: 1px solid var(--color-primary-border);
}

.badge-success, .badge-ready, .badge-paid, .badge-active, .badge-received {
  background: var(--color-success-light);
  color: var(--color-success);
  border: 1px solid var(--color-success-border);
}

.badge-warning, .badge-pending, .badge-partial, .badge-awaiting {
  background: var(--color-warning-light);
  color: var(--color-warning);
  border: 1px solid var(--color-warning-border);
}

.badge-danger, .badge-unpaid {
  background: var(--color-danger-light);
  color: var(--color-danger);
  border: 1px solid var(--color-danger-border);
}

.badge-neutral {
  background: #f1f5f9;
  color: var(--color-text-secondary);
  border: 1px solid var(--color-border);
}

/* 4. Top Page Header */
.top-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: var(--space-4);
  width: 100%;
}

.top-header-main {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  width: 100%;
}

.top-header-left {
  flex: 1;
  min-width: 0;
}

.top-header-meta {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.top-icon-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.date-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding: 0.4rem 0.85rem;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  box-shadow: var(--shadow-xs);
  white-space: nowrap;
}

.subpage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.subpage-header-left {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  flex: 1;
}

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text);
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.back-btn:hover {
  background: var(--color-primary-light);
  color: var(--color-primary);
  border-color: var(--color-primary-border);
}

/* 5. ONE-ROW 3-CARD DASHBOARD & STAFF METRICS (Section 6 & Image 5 Requirement)
   All 3 cards ALWAYS remain in ONE single horizontal row on mobile and desktop! */
.dashboard-row-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: var(--space-4);
  width: 100%;
}

.dashboard-stat-card {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 10px 8px;
  border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 4px;
  min-width: 0;
  transition: transform var(--transition-fast);
}

.dashboard-stat-card.clickable {
  cursor: pointer;
}

.dashboard-stat-card.clickable:hover {
  transform: translateY(-2px);
}

.dashboard-stat-card.tint-blue {
  background: linear-gradient(135deg, #f0f6ff 0%, #e8f1ff 100%);
  border-color: #dbeafe;
}

.dashboard-stat-card.tint-green {
  background: linear-gradient(135deg, #edfcf4 0%, #e2faed 100%);
  border-color: #bbf7d0;
}

.dashboard-stat-card.tint-orange {
  background: linear-gradient(135deg, #fff8f1 0%, #ffedd5 100%);
  border-color: #fed7aa;
}

.dashboard-stat-icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.dashboard-stat-icon.blue { background: var(--color-primary); color: #ffffff; }
.dashboard-stat-icon.green { background: var(--color-success); color: #ffffff; }
.dashboard-stat-icon.orange { background: var(--color-warning-amber); color: #ffffff; }

.dashboard-stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-secondary);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.dashboard-stat-value {
  font-size: clamp(0.95rem, 3.6vw, 1.3rem);
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.15;
  white-space: nowrap;
}

/* Primary 2-Action Bar on Home Dashboard (Section 6) */
.dashboard-primary-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: var(--space-4);
}

/* Summary Grid for Services & Payments */
.summary-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: var(--space-4);
  width: 100%;
}

.metric-card {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-xs);
  min-width: 0;
  transition: transform var(--transition-fast);
}

.metric-card.clickable { cursor: pointer; }
.metric-card.clickable:hover { transform: translateY(-2px); }
.metric-card.tint-blue { background: linear-gradient(135deg, #f0f6ff 0%, #e8f1ff 100%); border-color: #dbeafe; }
.metric-card.tint-green { background: linear-gradient(135deg, #edfcf4 0%, #e2faed 100%); border-color: #bbf7d0; }
.metric-card.tint-orange { background: linear-gradient(135deg, #fff8f1 0%, #ffedd5 100%); border-color: #fed7aa; }

.metric-card-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-width: 0;
  width: 100%;
}

.metric-icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.metric-icon.blue { background: var(--color-primary); color: #ffffff; }
.metric-icon.green { background: var(--color-success); color: #ffffff; }
.metric-icon.orange { background: var(--color-warning-amber); color: #ffffff; }

.metric-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-secondary);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.metric-value {
  font-size: clamp(0.95rem, 3.6vw, 1.25rem);
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.2;
  white-space: nowrap;
}

/* 6. Avatar & Vehicle Badges */
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #ffffff;
  font-weight: 700;
  font-size: var(--text-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
}

.avatar-soft {
  background: #e8f1ff;
  color: var(--color-primary);
  box-shadow: none;
  border: 1px solid #dbeafe;
  font-weight: 800;
}

.avatar-lg {
  width: 54px;
  height: 54px;
  font-size: var(--text-lg);
}

.avatar-xl {
  width: 68px;
  height: 68px;
  font-size: 1.45rem;
}

.avatar-xs {
  width: 26px;
  height: 26px;
  font-size: 11px;
  background: #dbeafe;
  color: var(--color-primary);
  box-shadow: none;
}

.vehicle-icon-box {
  width: 44px;
  height: 40px;
  border-radius: 12px;
  background: var(--color-surface-blue);
  color: #1e40af;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid #dbeafe;
}

/* 7. Vehicle Type Segmented Selector (Image 1: Bike | Scooter | Car) */
.vehicle-type-selector {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: #f0f5ff;
  border: 1px solid #dbeafe;
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
  margin-bottom: var(--space-3);
}

.vehicle-type-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0.55rem 0.4rem;
  border-radius: 9px;
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-text-secondary);
  background: transparent;
  border: 1.5px solid transparent;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.vehicle-type-btn.active {
  background: var(--color-surface);
  color: var(--color-primary);
  border-color: var(--color-primary);
  box-shadow: var(--shadow-xs);
}

.vehicle-entry-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

/* 8. Staff Directory & Staff Profile (Images 3, 4, 5) */
.staff-directory-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  margin-bottom: 12px;
  cursor: pointer;
  transition: transform var(--transition-fast), border-color var(--transition-fast);
}

.staff-directory-card:hover {
  transform: translateY(-2px);
  border-color: var(--color-primary-border);
}

.staff-directory-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.staff-directory-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Toggle Switch (Image 3 Enable Staff Login) */
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 28px;
  flex-shrink: 0;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #cbd5e1;
  transition: 0.2s;
  border-radius: 999px;
}

.toggle-slider::before {
  position: absolute;
  content: "";
  height: 22px;
  width: 22px;
  left: 3px;
  bottom: 3px;
  background-color: #ffffff;
  transition: 0.2s;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

.toggle-switch input:checked + .toggle-slider {
  background-color: var(--color-primary);
}

.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(22px);
}

/* Staff Permission Checkboxes (Strictly 3: Home, Service Tracking, Customer) */
.permissions-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 8px;
}

.permission-chip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 8px 6px;
  border-radius: 10px;
  border: 1.5px solid var(--color-border);
  background: var(--color-surface);
  font-size: 11px;
  font-weight: 700;
  color: var(--color-text-secondary);
  cursor: pointer;
  text-align: center;
  user-select: none;
}

.permission-chip.selected {
  background: var(--color-primary-light);
  border-color: var(--color-primary);
  color: var(--color-primary);
}

/* 9. Customer Card Layout */
.customers-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: var(--space-4);
}

.customer-counts-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.count-pill {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #e9effd;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  white-space: nowrap;
}

.customer-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.customer-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}

.customer-card-identity {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.customer-name-group {
  min-width: 0;
  flex: 1;
}

.customer-name {
  font-size: var(--text-lg);
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.25;
}

.customer-phone {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  margin-top: 3px;
}

.customer-vehicle-panel {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: var(--color-surface-blue);
  border: 1px solid #dbeafe;
  border-radius: 14px;
  padding: 10px 14px;
  min-width: 0;
}

.customer-vehicle-icon {
  color: #1e40af;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding-right: 12px;
  border-right: 1px solid #cbd5e1;
  flex-shrink: 0;
}

.customer-vehicle-details {
  min-width: 0;
  flex: 1;
}

.customer-vehicle-reg {
  font-weight: 800;
  font-size: 0.9375rem;
  color: var(--color-text);
  line-height: 1.25;
}

.customer-vehicle-model {
  font-size: var(--text-xs);
  color: var(--color-muted);
  margin-top: 1px;
}

.customer-progress-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border-subtle);
  border-radius: 14px;
  padding: 10px 12px;
}

.customer-status-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--color-border-subtle);
}

.customer-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  flex-wrap: wrap;
  padding-top: 8px;
  border-top: 1px solid var(--color-border-subtle);
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}

.customer-meta-group {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.customer-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.job-id-pill {
  background: #e9effd;
  color: var(--color-primary-dark);
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  white-space: nowrap;
}

/* 10. Service Tracking & Stepper */
.service-card-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px;
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border-subtle);
  border-radius: 14px;
  margin-bottom: 10px;
}

.service-card-vehicle,
.service-card-customer {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.service-card-customer {
  padding-top: 8px;
  border-top: 1px solid var(--color-border-subtle);
}

.service-stepper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  position: relative;
  margin: 6px 0;
  padding: 2px 0;
  width: 100%;
}

.stepper-line {
  position: absolute;
  top: 13px;
  left: 16.66%;
  right: 16.66%;
  height: 2.5px;
  background: var(--color-border);
  z-index: 1;
}

.stepper-line-fill {
  height: 100%;
  background: var(--color-primary);
  transition: width var(--transition-normal);
}

.stepper-line-fill.fill-green {
  background: var(--color-success);
}

.stepper-step {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-align: center;
  min-width: 0;
}

.stepper-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-surface);
  border: 2px solid #cbd5e1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.stepper-dot.done-blue { background: var(--color-primary); border-color: var(--color-primary); color: #ffffff; }
.stepper-dot.done-green { background: var(--color-success); border-color: var(--color-success); color: #ffffff; }
.stepper-dot.active-blue { background: var(--color-primary); border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2); }

.stepper-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-muted);
  line-height: 1.2;
  white-space: nowrap;
}

.stepper-label.active-blue { color: var(--color-primary); font-weight: 700; }
.stepper-label.active-green { color: var(--color-success); font-weight: 700; }

.segmented-status-control {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding: 4px;
  margin-bottom: var(--space-3);
  box-shadow: var(--shadow-xs);
}

.segment-btn {
  padding: 0.6rem 0.4rem;
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-text-secondary);
  transition: all var(--transition-fast);
  text-align: center;
  white-space: nowrap;
}

.segment-btn.active {
  background: var(--color-primary);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
}

/* 11. Search & Filter Bars */
.search-bar-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
  width: 100%;
}

.search-input-box {
  flex: 1;
  min-width: 0;
  position: relative;
  display: flex;
  align-items: center;
}

.search-input-box svg {
  position: absolute;
  left: 14px;
  color: var(--color-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding: 0.72rem 1rem 0.72rem 2.65rem;
  font-size: var(--text-sm);
  color: var(--color-text);
  box-shadow: var(--shadow-xs);
}

.search-input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-glow);
}

.filter-btn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-secondary);
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.filter-btn:hover, .filter-btn.active {
  border-color: var(--color-primary);
  color: var(--color-primary);
  background: var(--color-primary-light);
}

.filter-pills-row {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  margin-bottom: var(--space-4);
}

.filter-pills {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.filter-pills::-webkit-scrollbar { display: none; }

.filter-pill {
  padding: 0.5rem 0.95rem;
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  font-weight: 700;
  background: #e9effd;
  color: var(--color-text-secondary);
  border: 1px solid transparent;
  white-space: nowrap;
  flex-shrink: 0;
}

.filter-pill.active {
  background: var(--color-primary);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
}

/* 12. Create Bill & Generated Invoice Preview (Images 6 & 7) */
.bill-items-table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--color-border);
  border-radius: 14px;
  margin-bottom: 12px;
}

.bill-items-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-xs);
}

.bill-items-table th {
  background: #e9effd;
  color: var(--color-text);
  font-weight: 700;
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}

.bill-items-table td {
  padding: 8px 6px;
  border-bottom: 1px solid var(--color-border-subtle);
  vertical-align: middle;
}

.bill-items-table tr:last-child td {
  border-bottom: none;
}

.bill-table-input {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  padding: 6px 6px;
  border-radius: 8px;
  font-size: var(--text-xs);
  color: var(--color-text);
  font-weight: 600;
}

.bill-table-input:focus {
  outline: none;
  border-color: var(--color-primary);
  background: var(--color-surface);
}

/* Generated Invoice Document Card (Image 7) */
.invoice-paper-card {
  background: #ffffff;
  border-radius: 20px;
  border: 1.5px solid #dbeafe;
  box-shadow: var(--shadow-elevated);
  padding: 18px 16px;
  margin-bottom: 16px;
}

.invoice-garage-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--color-primary);
  margin-bottom: 12px;
}

.invoice-logo-box {
  padding-right: 12px;
  border-right: 1.5px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.invoice-type-banner {
  background: #0f172a;
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: center;
  padding: 6px 14px;
  border-radius: 8px;
  margin: 0 auto 12px;
  max-width: 290px;
}

.invoice-section-bar {
  background: #e8f1ff;
  color: #0f172a;
  font-size: var(--text-xs);
  font-weight: 800;
  padding: 7px 12px;
  border-radius: 8px 8px 0 0;
}

.invoice-details-table {
  width: 100%;
  font-size: var(--text-xs);
  border-collapse: collapse;
}

.invoice-details-table td {
  padding: 4px 0;
  vertical-align: top;
}

/* 13. Admin Settings, Business Profile & WhatsApp Integration (Images 8, 9, 10) */
.settings-section-label {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #475569;
  margin: 14px 0 8px 4px;
}

.settings-group-card {
  background: var(--color-surface);
  border-radius: 18px;
  border: 1px solid var(--color-border-subtle);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 16px;
}

.settings-row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  width: 100%;
  text-align: left;
  border-bottom: 1px solid var(--color-border-subtle);
  transition: background var(--transition-fast);
}

.settings-row-item:last-child {
  border-bottom: none;
}

.settings-row-item:hover {
  background: var(--color-surface-subtle);
}

.settings-row-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.settings-icon-box {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.settings-icon-box.blue { background: #e8f1ff; color: var(--color-primary); }
.settings-icon-box.green { background: var(--color-success-light); color: var(--color-success); }
.settings-icon-box.red { background: var(--color-danger-light); color: var(--color-danger); }

.wa-steps-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

.wa-step-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  position: relative;
}

.wa-step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #ffffff;
  font-size: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

/* 14. Invoice & Bill Details Layouts */
.invoice-card-layout {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.invoice-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.invoice-card-amounts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 10px 12px;
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border-subtle);
  border-radius: 14px;
}

.invoice-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: var(--text-xs);
  color: var(--color-muted);
}

.bill-header-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bill-meta-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--color-border-subtle);
}

.payment-history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px;
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border-subtle);
  border-radius: 14px;
}

.profile-actions-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.service-history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--color-border-subtle);
  cursor: pointer;
}

.service-history-item:last-child { border-bottom: none; }

/* 15. Forms & Inputs */
.form-group {
  margin-bottom: 14px;
}

.form-row-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.form-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: 5px;
}

.form-label .optional {
  font-weight: 500;
  color: var(--color-muted);
}

.form-label .required {
  color: var(--color-danger);
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon-left {
  position: absolute;
  left: 12px;
  color: var(--color-muted);
  display: inline-flex;
  pointer-events: none;
}

.input-prefix-box {
  position: absolute;
  left: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-text);
  padding-right: 8px;
  border-right: 1px solid var(--color-border);
  pointer-events: none;
}

.input-icon-right {
  position: absolute;
  right: 12px;
  color: var(--color-muted);
  display: inline-flex;
  padding: 4px;
  border-radius: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-input);
  padding: 0.7rem 0.9rem;
  font-size: var(--text-sm);
  color: var(--color-text);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-input.with-left-icon { padding-left: 2.5rem; }
.form-input.with-phone-prefix { padding-left: 5.2rem; }
.form-input.with-right-icon { padding-right: 2.5rem; }
.form-input.readonly-field { background: #eef3fb; color: var(--color-text); font-weight: 700; }

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-glow);
}

.form-input.input-error { border-color: var(--color-danger); }
.form-error-msg { font-size: var(--text-xs); color: var(--color-danger); margin-top: 4px; font-weight: 500; }

/* 16. Login Page Specifics (Fixed 100dvh Mobile Screen & Adaptive Keyboard Layout) */
.login-screen {
  width: 100%;
  max-width: 460px;
  height: 100%;
  max-height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  overflow: hidden;
  overscroll-behavior: none;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--safe-bottom) + 4px);
}

/* 1. Complete Pre-Designed Hero Image rendered directly at natural aspect ratio */
.login-hero-img {
  width: 100%;
  height: auto;
  max-width: 100%;
  flex: 0 0 auto;
  object-fit: contain;
  object-position: center top;
  margin: 0;
  padding: 0;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: transparent;
  display: block;
}

/* 2. Login Form Body starting immediately after the hero image */
.login-form-body {
  display: flex;
  flex-direction: column;
  width: 100%;
  flex: 0 0 auto;
  justify-content: flex-start;
  padding: 2px var(--page-padding-x) 2px;
}

.login-section-block {
  margin-bottom: clamp(3px, 0.75vh, 7px);
}

.login-section-heading {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: clamp(2px, 0.5vh, 5px);
  line-height: 1.15;
}

/* 3. Compact Owner and Staff Selection Cards in One Horizontal Row */
.role-selector-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.role-card {
  position: relative;
  background: #ffffff;
  border: 1.5px solid #e2e8f0;
  border-radius: 12px;
  padding: clamp(4px, 0.75vh, 7px) 8px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 0;
}

.role-card:hover {
  border-color: #93c5fd;
}

.role-card.selected {
  background: #ebf3ff;
  border: 1.8px solid var(--color-primary);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
}

.role-check-badge {
  position: absolute;
  top: 4px;
  right: 5px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #ffffff;
  display: none;
  align-items: center;
  justify-content: center;
}

.role-check-badge svg {
  width: 9px;
  height: 9px;
}

.role-card.selected .role-check-badge {
  display: inline-flex;
}

.role-icon-wrap {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
  margin-bottom: 1px;
}

.role-icon-wrap svg {
  width: 18px;
  height: 18px;
}

.role-card.selected .role-icon-wrap {
  color: var(--color-primary);
}

.role-title {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.15;
}

.role-desc {
  font-size: 9.75px;
  color: var(--color-muted);
  line-height: 1.1;
  white-space: nowrap;
}

/* 4. Compact Login Input Fields */
.login-field-group {
  margin-bottom: clamp(3px, 0.7vh, 6px);
}

.login-field-label {
  display: block;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 2px;
  line-height: 1.15;
}

.login-input {
  height: clamp(30px, 4.2vh, 38px);
  border-radius: 10px;
  background: #ffffff;
  border: 1.5px solid #dbe3ef;
  font-size: 0.8rem;
  padding-top: 0.3rem;
  padding-bottom: 0.3rem;
}

.login-forgot-row {
  text-align: right;
  margin-top: -1px;
  margin-bottom: clamp(3px, 0.7vh, 7px);
}

.login-forgot-link {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--color-primary);
  line-height: 1.15;
}

/* 5. Sign In Button */
.login-submit-btn {
  height: clamp(32px, 4.5vh, 40px);
  min-height: 32px;
  border-radius: 9999px;
  font-size: 0.875rem;
  font-weight: 700;
  margin-bottom: clamp(3px, 0.7vh, 7px);
  padding-top: 0.3rem;
  padding-bottom: 0.3rem;
}

/* 6. Security Information Strip (Single Line) */
.login-security-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: #edf3fc;
  border-radius: 9px;
  padding: clamp(3px, 0.6vh, 6px) 8px;
  font-size: clamp(9.75px, 2.7vw, 11px);
  font-weight: 500;
  color: #334155;
  white-space: nowrap;
  margin-bottom: clamp(2px, 0.6vh, 5px);
}

.login-security-icon {
  color: #16a34a;
  display: inline-flex;
  flex-shrink: 0;
}

.login-security-icon svg {
  width: 13.5px;
  height: 13.5px;
}

/* 7. Contact Information — Strictly One Single Line on Mobile */
.login-help-text {
  text-align: center;
  font-size: clamp(9.25px, 2.6vw, 10.75px);
  color: #475569;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
  line-height: 1.2;
  margin: 0 0 clamp(2px, 0.6vh, 5px);
}

/* 8. Final Footer */
.login-workspace-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #64748b;
  font-size: 10.25px;
  line-height: 1.15;
}

.login-footer-line {
  flex: 1;
  height: 1px;
  background: #cbd5e1;
}

.login-footer-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.login-footer-label svg {
  width: 12px;
  height: 12px;
}

/* 9. Mobile & Tablet Keyboard Behaviour (<= 1024px)
   Immediately hide the entire hero image when Email or Password input is focused */
@media (max-width: 1024px) {
  .login-screen.input-focused {
    justify-content: flex-start;
    padding-top: calc(var(--safe-top) + 10px);
  }

  .login-screen.input-focused .login-hero-img {
    display: none !important;
  }
}

/* Desktop & Laptop (> 1024px): Always display the hero image even when inputs are focused */
@media (min-width: 1025px) {
  .login-screen .login-hero-img {
    display: block !important;
  }
}

/* 17. Navigation (Bottom Mobile Nav & Desktop Sidebar) */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--bottom-nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--color-surface);
  border-top: 1px solid var(--color-border);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  z-index: 40;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-muted);
  position: relative;
  min-width: 0;
}

.bottom-nav-item.active { color: var(--color-primary); font-weight: 700; }
.bottom-nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 42px;
  height: 3px;
  background: var(--color-primary);
  border-radius: 3px 3px 0 0;
}

.sidebar-nav {
  display: none;
  width: var(--sidebar-width);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  flex-direction: column;
  justify-content: space-between;
  padding: var(--space-5) var(--space-4);
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
}

.sidebar-menu { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-6); }
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0.8rem 1rem;
  border-radius: 12px;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-text-secondary);
  width: 100%;
  text-align: left;
}
.sidebar-link:hover { background: var(--color-surface-blue); color: var(--color-primary); }
.sidebar-link.active { background: var(--color-primary); color: #ffffff; box-shadow: var(--shadow-button); }

/* 18. Modals & Centered Logout Confirmation (Image 11) */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-backdrop.modal-centered {
  align-items: center;
  padding: var(--space-4);
}

.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-sheet {
  background: var(--color-surface);
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  max-height: 92dvh;
  overflow-y: auto;
  border-radius: var(--radius-modal) var(--radius-modal) 0 0;
  padding: var(--space-4) var(--page-padding-x) calc(var(--space-6) + var(--safe-bottom));
  box-shadow: var(--shadow-modal);
  transform: translateY(24px);
  transition: transform var(--transition-normal);
}

.modal-sheet.modal-dialog-card {
  max-width: 380px;
  border-radius: 24px;
  padding: 24px 20px;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.22);
}

.modal-backdrop.open .modal-sheet {
  transform: translateY(0);
}

.modal-handle {
  width: 48px;
  height: 5px;
  background: #cbd5e1;
  border-radius: 999px;
  margin: 0 auto 12px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: var(--space-4);
}

.modal-title { font-size: var(--text-xl); font-weight: 800; color: var(--color-text); }

/* Logout Confirmation Popup Styling (Section 14) */
.logout-confirm-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.logout-icon-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #fecaca;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}

.logout-confirm-title {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: 6px;
}

.logout-confirm-subtitle {
  font-size: var(--text-sm);
  color: var(--color-muted);
  margin-bottom: 20px;
}

.logout-confirm-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
}

/* Payment Method Selector & Progress Bar */
.amount-pay-row { display: flex; flex-direction: column; gap: 10px; }
.payment-methods-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.method-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0.7rem 0.5rem;
  border-radius: 12px;
  border: 1.5px solid var(--color-border);
  background: var(--color-surface);
  font-size: var(--text-xs);
  font-weight: 700;
  color: var(--color-text-secondary);
}
.method-btn.selected { background: var(--color-primary-light); border-color: var(--color-primary); color: var(--color-primary); }

.progress-track { width: 100%; height: 10px; background: #e2e8f0; border-radius: var(--radius-pill); overflow: hidden; margin: var(--space-3) 0 6px; }
.progress-fill { height: 100%; background: var(--color-success); border-radius: var(--radius-pill); transition: width var(--transition-normal); }

/* Toast Notification */
.toast-container {
  position: fixed;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: #0f172a;
  color: #ffffff;
  padding: 0.85rem 1.1rem;
  border-radius: 14px;
  box-shadow: var(--shadow-elevated);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-sm);
  font-weight: 500;
  max-width: 400px;
  width: 100%;
  pointer-events: auto;
  animation: slideInToast 0.22s ease-out;
}

.toast.toast-success { border-left: 4px solid var(--color-success); }
.toast.toast-warning { border-left: 4px solid var(--color-warning-amber); }
.toast.toast-danger { border-left: 4px solid var(--color-danger); }

@keyframes slideInToast {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.empty-state {
  text-align: center;
  padding: var(--space-8) var(--space-4);
  color: var(--color-muted);
}


/* ==========================================================================
   GarageFlow — Responsive Breakpoints (responsive.css)
   Preserves 1-row 3-card dashboard across all mobile viewports
   ========================================================================== */

/* Ultra-narrow screens (<= 359px) */
@media (max-width: 359px) {
  .customer-counts-row {
    grid-template-columns: 1fr;
  }
  .stepper-label {
    font-size: 10px;
  }
  .dashboard-stat-card {
    padding: 8px 4px;
  }
  .dashboard-stat-label {
    font-size: 10px;
  }
}

/* Large Mobile & Phablet (>= 481px) */
@media (min-width: 481px) {
  .demo-autofill-grid,
  .profile-actions-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .amount-pay-row {
    flex-direction: row;
    align-items: stretch;
  }

  .amount-pay-row .input-wrapper {
    flex: 1.35;
  }

  .amount-pay-row .btn {
    flex: 1;
  }

  .payment-methods-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

/* Wide Mobile / Small Tablet (>= 560px) */
@media (min-width: 560px) {
  .filter-pills-row,
  .customers-toolbar {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .service-card-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    align-items: center;
    gap: 14px;
  }

  .service-card-customer {
    padding-top: 0;
    border-top: none;
    padding-left: 14px;
    border-left: 1px solid var(--color-border-subtle);
  }

  .bill-header-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    align-items: center;
    gap: 16px;
  }

  .bill-meta-row {
    grid-template-columns: 1fr;
    padding-top: 0;
    border-top: none;
    padding-left: 16px;
    border-left: 1px solid var(--color-border-subtle);
  }
}

/* Tablet Layout (>= 769px) */
@media (min-width: 769px) {
  .page-container {
    padding: var(--space-6) var(--space-8);
  }

  .modal-backdrop {
    align-items: center;
    padding: var(--space-4);
  }

  .modal-sheet {
    border-radius: var(--radius-modal);
    max-width: 560px;
    padding: var(--space-5) var(--space-6);
  }

  .modal-handle {
    display: none;
  }

  .cards-grid-responsive {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .cards-grid-responsive > .card {
    margin-bottom: 0;
  }
}

/* Laptop & Desktop Layout (>= 1025px) */
@media (min-width: 1025px) {
  .sidebar-nav {
    display: flex;
  }

  .bottom-nav {
    display: none;
  }

  .app-main {
    padding-bottom: var(--space-8);
  }

  .dashboard-columns {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: var(--space-5);
    align-items: start;
  }
}

// ==========================================================================
// GarageFlow — Utility Functions, Invoice Renderer & SVG Icons (js/utils.js)
// ==========================================================================
function formatCurrency(amount) {
  const num = Number(amount) || 0;
  return '₹' + num.toLocaleString('en-IN', {
    maximumFractionDigits: 0
  });
}

/**
 * Formats sequential invoice numbers: INV-01, INV-02 ... INV-99, INV-100, INV-101
 */
function formatInvoiceNumber(seq, formatPattern = null) {
  const n = Math.max(1, Number(seq) || 1);
  const fmt =
    formatPattern ||
    (typeof AppState !== 'undefined' &&
    AppState.data &&
    AppState.data.invoiceSettings &&
    AppState.data.invoiceSettings.invoiceFormat
      ? AppState.data.invoiceSettings.invoiceFormat
      : 'INV-01');
  if (fmt === 'INV-001') return `INV-${String(n).padStart(3, '0')}`;
  if (fmt === 'INVOICE-001') return `INVOICE-${String(n).padStart(3, '0')}`;
  if (fmt === 'INV-{####}') return `INV-${String(n).padStart(4, '0')}`;
  return `INV-${String(n).padStart(2, '0')}`;
}

/**
 * Dynamically calculates invoice subtotal, discount, grand total, paid amount, and pending balance.
 * Supports both { qty, rate } items and legacy { amount } items.
 */
function calculateInvoiceSummary(invoice) {
  const items = (invoice.items || []).map((item) => {
    const qty = Number(item.qty) > 0 ? Number(item.qty) : 1;
    const rate = item.rate !== undefined ? Number(item.rate) || 0 : Number(item.amount) || 0;
    const amount = Math.round(qty * rate);
    return {
      ...item,
      qty,
      rate,
      amount
    };
  });

  const subtotal = items.reduce((sum, item) => sum + item.amount, 0);
  const discount = Math.max(0, Number(invoice.discount) || 0);
  const total = Math.max(0, subtotal - discount);
  const paid = (invoice.payments || []).reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const balance = Math.max(0, total - paid);
  const percentPaid = total > 0 ? Math.min(100, Math.round((paid / total) * 100)) : 100;

  let status = 'Unpaid';
  if (balance === 0 && total > 0) {
    status = 'Paid';
  } else if (paid > 0 && balance > 0) {
    status = 'Partially Paid';
  }

  const latestPayment = invoice.payments && invoice.payments.length > 0 ? invoice.payments[0] : null;

  return {
    items,
    subtotal,
    discount,
    total,
    paid,
    balance,
    percentPaid,
    status,
    latestMethod: latestPayment ? latestPayment.method : 'Cash'
  };
}
function getInitials(name = '') {
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 0 || !parts[0]) return 'GF';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function showToast(message, type = 'success') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const normalizedType = type === 'error' ? 'danger' : type;
  const iconSvg =
    normalizedType === 'danger'
      ? ICONS.alertCircle
      : normalizedType === 'warning'
      ? ICONS.clock
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  const toast = document.createElement('div');
  toast.className = `toast toast-${normalizedType}`;
  toast.setAttribute('role', 'status');
  toast.innerHTML = `
    <div class="toast-left-wrap">
      <span class="toast-status-circle ${normalizedType}">${iconSvg}</span>
      <span class="toast-msg-text">${escapeHtml(message)}</span>
    </div>
    <button type="button" class="toast-close-btn" data-toast-close aria-label="Dismiss notification">
      ${ICONS.close}
    </button>
  `;

  container.appendChild(toast);

  const dismiss = () => {
    if (!toast.isConnected) return;
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-8px)';
    toast.style.transition = 'all 200ms ease';
    setTimeout(() => toast.remove(), 220);
  };

  const closeBtn = toast.querySelector('[data-toast-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', dismiss);
  }

  setTimeout(dismiss, 3200);
}

/**
 * Real HTML5 Canvas QR Readability & Contrast Verifier (Requirement 5B)
 * Analyzes uploaded/cropped image luminance transitions and module contrast so
 * blank, solid, or non-QR images are rejected while genuine QR codes pass.
 */
async function verifyQrCodeReadability(dataUrl) {
  return new Promise((resolve) => {
    if (!dataUrl || typeof dataUrl !== 'string') {
      resolve({ valid: false, reason: 'No image data provided.' });
      return;
    }
    const img = new Image();
    img.onload = () => {
      try {
        const size = 120;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        const { data } = ctx.getImageData(0, 0, size, size);

        let darkCount = 0;
        let lightCount = 0;
        let transitions = 0;
        const lum = new Uint8Array(size * size);

        for (let i = 0; i < size * size; i++) {
          const r = data[i * 4];
          const g = data[i * 4 + 1];
          const b = data[i * 4 + 2];
          const y = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
          lum[i] = y;
          if (y < 115) darkCount++;
          else if (y > 145) lightCount++;
        }

        for (let r = 10; r < size - 10; r += 2) {
          for (let c = 10; c < size - 11; c++) {
            const a = lum[r * size + c] < 128 ? 0 : 1;
            const b = lum[r * size + c + 1] < 128 ? 0 : 1;
            if (a !== b) transitions++;
          }
        }

        const total = size * size;
        const darkRatio = darkCount / total;
        const lightRatio = lightCount / total;
        const isReadableQr = darkRatio >= 0.08 && darkRatio <= 0.85 && lightRatio >= 0.12 && transitions >= 95;

        if (isReadableQr) {
          resolve({
            valid: true,
            reason: 'QR code verified and ready for invoices.'
          });
        } else {
          resolve({
            valid: false,
            reason: 'Unable to detect a readable QR pattern. Please upload or crop a high-contrast UPI QR code.'
          });
        }
      } catch (e) {
        resolve({ valid: false, reason: 'Could not inspect QR image data.' });
      }
    };
    img.onerror = () => resolve({ valid: false, reason: 'Invalid image file format.' });
    img.src = dataUrl;
  });
}

/**
 * Generates a clean default deterministic SVG/Canvas QR Data URL for demo/crop testing
 */
function generateSampleUpiQrDataUrl(upiText = 'upi://pay?pa=patilgarage@upi&pn=Patil%20Auto%20Garage') {
  const canvas = document.createElement('canvas');
  const size = 240;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  const cells = 21;
  const pad = 15;
  const cellSize = Math.floor((size - pad * 2) / cells);

  function drawFinder(ox, oy) {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(pad + ox * cellSize, pad + oy * cellSize, 7 * cellSize, 7 * cellSize);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(pad + (ox + 1) * cellSize, pad + (oy + 1) * cellSize, 5 * cellSize, 5 * cellSize);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(pad + (ox + 2) * cellSize, pad + (oy + 2) * cellSize, 3 * cellSize, 3 * cellSize);
  }

  drawFinder(0, 0);
  drawFinder(cells - 7, 0);
  drawFinder(0, cells - 7);

  let hash = 2166136261;
  for (let i = 0; i < upiText.length; i++) {
    hash ^= upiText.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }

  ctx.fillStyle = '#0f172a';
  for (let r = 0; r < cells; r++) {
    for (let c = 0; c < cells; c++) {
      const inTL = r < 8 && c < 8;
      const inTR = r < 8 && c >= cells - 8;
      const inBL = r >= cells - 8 && c < 8;
      if (inTL || inTR || inBL) continue;
      const bit = ((r * 31 + c * 17 + Math.abs(hash)) % 7) < 3;
      if (bit) {
        ctx.fillRect(pad + c * cellSize, pad + r * cellSize, cellSize, cellSize);
      }
    }
  }
  return canvas.toDataURL('image/png');
}

  ];

  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objects.forEach((obj) => {
    offsets.push(pdf.length);

  });

  pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= objects.length; i++) {

  }
  pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return new Blob([pdf], { type: 'application/pdf' });
}

/**
 * Generates a high-resolution PNG Blob & Data URL of an invoice using HTML5 Canvas
 * so "Save Invoice to Device" and "Share Invoice on WhatsApp" produce a real document file.
 */
async function generateInvoiceImageBlob(invoice, businessProfile, summary, invSettings = null) {
  const cfg = {
    showBusinessAddress: true,
    showBusinessContact: true,
    showCustomerDetails: true,
    showVehicleDetails: true,
    showPaymentSummary: true,
    showDigitalSignature: true,
    thankYouMessage: 'Thank you for choosing our garage!',
    additionalNote: 'We appreciate your business. Keep this invoice for future reference.',
    ...(AppState && AppState.data && AppState.data.invoiceSettings ? AppState.data.invoiceSettings : {}),
    ...(invSettings || {})
  };

  const loadImageSafe = (src) =>
    new Promise((resolve) => {
      if (!src) return resolve(null);
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });

  const drawRoundedRect = (ctx, x, y, w, h, r, fill, stroke, lineWidth = 1.5) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
  };

  // High-resolution A4 Portrait dimensions (210 x 297 mm aspect ratio = 1 : 1.4142857)
  const width = 1240;
  const minA4Height = 1754;
  const itemsCount = Math.max(1, (summary.items || []).length);
  const dynamicHeight = 1280 + itemsCount * 58;
  const height = Math.max(minA4Height, dynamicHeight);

  const canvas = document.createElement('canvas');

  const padX = 88;

  ctx.strokeStyle = '#d9e6fa';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(56, 56, width - 112, height - 112);

  // 2. Top Garage Branding Row (Logo/Emblem + Vertical Blue Divider + Garage Details)

  let headerY = 98;

      ctx.fillText('Mobile :', padX + 20, y + 114);
      ctx.fillText('Vehicle Number :', padX + 20, y + 148);

      ctx.font = '700 19px Inter, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(String(invoice.customerName || ''), padX + 188, y + 80);
      ctx.fillText(String(invoice.customerPhone || ''), padX + 188, y + 114);
      ctx.fillText(String(invoice.vehicleNumber || ''), padX + 188, y + 148);
    }

    if (cfg.showVehicleDetails !== false) {
      ctx.strokeStyle = '#dbeafe';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(colMidX, y + 54);
      ctx.lineTo(colMidX, y + custBoxH - 14);
      ctx.stroke();

      ctx.font = '500 19px Inter, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText('Vehicle Model :', colMidX + 22, y + 80);
      ctx.fillText('Job ID :', colMidX + 22, y + 114);

      ctx.font = '700 19px Inter, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(String(invoice.vehicleModel || ''), colMidX + 170, y + 80);
      ctx.fillText(String(invoice.jobId || 'N/A'), colMidX + 170, y + 114);
    }

    y += custBoxH + 28;
  }

  // 5. Itemized Service Table & Totals (Matches A4 PDF Table Layout)
  const tableHeaderH = 46;
  const rowH = 52;
  const items = summary.items || [];
  const tableBodyH = items.length * rowH;
  const tableTotalBoxH = tableHeaderH + tableBodyH;

  drawRoundedRect(ctx, padX, y, contentW, tableTotalBoxH, 14, '#ffffff', '#dbeafe', 2);
  ctx.fillStyle = '#eaf2ff';
  ctx.fillRect(padX + 2, y + 2, contentW - 4, tableHeaderH - 2);

  const colQtyX = padX + 640;
  const colRateX = padX + 835;
  const colAmtRightX = width - padX - 22;

  ctx.fillStyle = '#0f172a';
  ctx.font = '800 19px Inter, sans-serif';
  ctx.fillText('Description', padX + 22, y + 30);
  ctx.textAlign = 'center';
  ctx.fillText('Qty', colQtyX, y + 30);
  ctx.textAlign = 'right';
  ctx.fillText('Rate (₹)', colRateX, y + 30);
  ctx.fillText('Amount (₹)', colAmtRightX, y + 30);
  ctx.textAlign = 'left';

  let rowY = y + tableHeaderH;
  items.forEach((item, idx) => {
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(padX, rowY);
    ctx.lineTo(padX + contentW, rowY);
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.font = '600 19px Inter, sans-serif';
    ctx.fillText(String(item.description || ''), padX + 22, rowY + 33);

    ctx.textAlign = 'center';
    ctx.font = '500 19px Inter, sans-serif';
    ctx.fillText(String(item.qty), colQtyX, rowY + 33);

    ctx.textAlign = 'right';
    ctx.fillText(formatCurrency(item.rate), colRateX, rowY + 33);
    ctx.font = '700 19px Inter, sans-serif';
    ctx.fillText(formatCurrency(item.amount), colAmtRightX, rowY + 33);
    ctx.textAlign = 'left';

    rowY += rowH;
  });

  y = rowY + 24;

  // Subtotal, Discount & Grand Total Box
  const totLabelX = width - padX - 380;
  const totValRightX = width - padX - 16;

  ctx.font = '600 20px Inter, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('Subtotal', totLabelX, y);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 20px Inter, sans-serif';
  ctx.fillText(formatCurrency(summary.subtotal), totValRightX, y);
  ctx.textAlign = 'left';

  y += 34;
  ctx.font = '600 20px Inter, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('Discount', totLabelX, y);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 20px Inter, sans-serif';
  ctx.fillText(formatCurrency(summary.discount), totValRightX, y);
  ctx.textAlign = 'left';

  y += 18;
  const gtBoxW = 404;
  const gtBoxH = 54;
  const gtBoxX = width - padX - gtBoxW;
  drawRoundedRect(ctx, gtBoxX, y, gtBoxW, gtBoxH, 12, '#eaf2ff', '#bfdbfe', 1.8);
  ctx.fillStyle = '#0a1936';
  ctx.font = '800 22px Inter, sans-serif';
  ctx.fillText('Grand Total', gtBoxX + 20, y + 35);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#1e3a8a';
  ctx.font = '900 26px Inter, sans-serif';
  ctx.fillText(formatCurrency(summary.total), gtBoxX + gtBoxW - 20, y + 36);
  ctx.textAlign = 'left';

  y += gtBoxH + 30;

  // 6. PAYMENT INFORMATION Framed Box (Matches A4 PDF & Preview: Pending vs Completed)
  if (cfg.showPaymentSummary !== false) {
    const payBoxH = isPending ? 238 : 186;
    drawRoundedRect(ctx, padX, y, contentW, payBoxH, 14, '#ffffff', '#dbeafe', 2);

    ctx.fillStyle = '#eaf2ff';
    ctx.fillRect(padX + 2, y + 2, contentW - 4, 42);
    ctx.strokeStyle = '#dbeafe';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padX, y + 44);
    ctx.lineTo(padX + contentW, y + 44);
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.font = '900 18px Inter, sans-serif';
    ctx.fillText('PAYMENT INFORMATION', padX + 20, y + 29);

    const paySplitX = padX + Math.round(contentW * 0.54);

    // Left column: Total Invoice Amount, Amount Received, Payment Method
    ctx.font = '500 19px Inter, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('Total Invoice Amount :', padX + 20, y + 82);
    ctx.fillText('Amount Received :', padX + 20, y + 116);
    ctx.fillText('Payment Method :', padX + 20, y + 150);

    ctx.textAlign = 'right';
    ctx.font = '800 19px Inter, sans-serif';
    ctx.fillStyle = '#0a1936';
    ctx.fillText(formatCurrency(summary.total), paySplitX - 24, y + 82);
    ctx.fillText(formatCurrency(summary.paid), paySplitX - 24, y + 116);
    ctx.fillText(String(summary.latestMethod || 'Cash'), paySplitX - 24, y + 150);
    ctx.textAlign = 'left';

    // Vertical divider inside Payment Info
    ctx.strokeStyle = '#dbeafe';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(paySplitX, y + 54);
    ctx.lineTo(paySplitX, y + (isPending ? 172 : payBoxH - 14));
    ctx.stroke();

    if (isPending) {
      // Right column: UPI Payment + QR Code
      ctx.fillStyle = '#0a1936';
      ctx.font = '900 18px Inter, sans-serif';
      ctx.fillText('UPI PAYMENT', paySplitX + 22, y + 84);
      ctx.fillStyle = '#475569';
      ctx.font = '500 16px Inter, sans-serif';
      ctx.fillText('Scan the QR code to pay', paySplitX + 22, y + 112);
      ctx.fillText('the remaining balance.', paySplitX + 22, y + 134);

      const qrDataUrl = cfg.qrCodeDataUrl || generateSampleUpiQrDataUrl();
      const qrImg = await loadImageSafe(qrDataUrl);
      if (qrImg) {
        const qrBoxSize = 108;
        const qrX = width - padX - qrBoxSize - 20;
        const qrY = y + 56;
        drawRoundedRect(ctx, qrX - 4, qrY - 4, qrBoxSize + 8, qrBoxSize + 8, 10, '#ffffff', '#cbd5e1', 1.5);
        ctx.drawImage(qrImg, qrX, qrY, qrBoxSize, qrBoxSize);
      }

      // Bottom Outstanding Balance / Payment Pending Bar
      const barY = y + 178;
      const barH = 58;
      ctx.fillStyle = '#eef4ff';
      ctx.fillRect(padX + 2, barY, contentW - 4, barH - 2);
      ctx.strokeStyle = '#dbeafe';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(padX, barY);
      ctx.lineTo(padX + contentW, barY);
      ctx.stroke();

      ctx.fillStyle = '#0a1936';
      ctx.font = '800 20px Inter, sans-serif';
      ctx.fillText('Outstanding Balance', padX + 20, barY + 36);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#0a1936';
      ctx.font = '900 24px Inter, sans-serif';
      ctx.fillText(formatCurrency(summary.balance), paySplitX - 24, barY + 38);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#d97706';
      ctx.font = '900 22px Inter, sans-serif';
      ctx.fillText('Payment Pending', paySplitX + (width - padX - paySplitX) / 2, barY + 37);
      ctx.textAlign = 'left';
    } else {
      const rightCenterX = paySplitX + (width - padX - paySplitX) / 2;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#15803d';
      ctx.font = '900 25px Inter, sans-serif';
      ctx.fillText('Payment Completed', rightCenterX, y + 106);
      ctx.fillStyle = '#334155';
      ctx.font = '600 18px Inter, sans-serif';
      ctx.fillText('Fully paid. No outstanding balance.', rightCenterX, y + 138);
      ctx.textAlign = 'left';
    }

    y += payBoxH + 34;
  }

  // 7. Footer: Thank-You Message, Additional Note & Authorised Signatory (Matches A4 PDF)
  const footerY = Math.max(y + 10, height - 180);
  ctx.strokeStyle = '#dbeafe';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padX, footerY);
  ctx.lineTo(width - padX, footerY);
  ctx.stroke();

  ctx.fillStyle = '#0a1936';
  ctx.font = 'italic 800 20px Inter, sans-serif';
  ctx.fillText(
    String(cfg.thankYouMessage || 'Thank you for choosing our garage!'),
    padX,
    footerY + 38
  );

  ctx.fillStyle = '#475569';
  ctx.font = '500 17px Inter, sans-serif';
  ctx.fillText(
    String(cfg.additionalNote || 'We appreciate your business. Keep this invoice for future reference.'),
    padX,
    footerY + 68
  );

  if (cfg.showDigitalSignature !== false) {
    const sigRightX = width - padX;
    const sigImg = await loadImageSafe(cfg.signatureDataUrl);
    if (sigImg) {
      ctx.drawImage(sigImg, sigRightX - 180, footerY + 8, 170, 48);
    } else {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#1e3a8a';
      ctx.font = 'italic 700 25px Georgia, serif';
      ctx.fillText(String(businessProfile.ownerName || 'R. Patil'), sigRightX, footerY + 42);
    }
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sigRightX - 220, footerY + 56);
    ctx.lineTo(sigRightX, footerY + 56);
    ctx.stroke();

    ctx.textAlign = 'right';
    ctx.fillStyle = '#0a1936';
    ctx.font = '800 17px Inter, sans-serif';
    ctx.fillText('Authorised Signatory', sigRightX, footerY + 78);
    ctx.fillStyle = '#64748b';
    ctx.font = '600 15px Inter, sans-serif';
    ctx.fillText(garageTitle, sigRightX, footerY + 98);
    ctx.textAlign = 'left';
  }

  const dataUrl = canvas.toDataURL('image/png');
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  return { blob, dataUrl };
}

// GarageFlow — Centralized State & Business Logic (js/state.js)
// Enforces multi-vehicle customers, 3 service statuses, 3 staff permissions,
// sequential INV-XX numbering, and Business Profile synchronization.
// ==========================================================================


const STORAGE_KEY = 'garageflow_state_v2';

function cloneDeep(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function normalizeCustomer(c) {
  // Ensure every customer has a vehicles array and synced primary vehicle fields
  if (!Array.isArray(c.vehicles) || c.vehicles.length === 0) {
    c.vehicles = [
      {
        id: 'VEH-' + Math.floor(100 + Math.random() * 900),
        type: c.vehicleType || 'Scooter',
        regNumber: c.vehicleNumber || 'MH09 AB 1234',
        brand: (c.vehicleModel || 'Honda').split(' ')[0],
        model: c.vehicleModel || 'Honda Activa 6G',
        year: '2023',
        notes: ''
      }
    ];
  }
  const primary = c.vehicles[0];
  c.vehicleNumber = primary.regNumber;
  c.vehicleModel = `${primary.brand} ${primary.model}`.trim();
  c.vehicleType = primary.type;
  return c;
}

function loadPersistedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.customers && parsed.jobs && parsed.invoices && parsed.businessProfile) {
        parsed.customers.forEach(normalizeCustomer);
        if (!parsed.invoiceSettings) {
          parsed.invoiceSettings = cloneDeep(INITIAL_DATA.invoiceSettings);
        }
        if (!parsed.notificationSettings) {
          parsed.notificationSettings = cloneDeep(INITIAL_DATA.notificationSettings);
        }
        // Requirement 4G: Automatically detect and display user's current local date on startup
        const todayNow = new Date();
        const todayIso = `${todayNow.getFullYear()}-${String(todayNow.getMonth() + 1).padStart(2, '0')}-${String(todayNow.getDate()).padStart(2, '0')}`;
        const wk3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][todayNow.getDay()];
        const mShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][todayNow.getMonth()];
        const mFull = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][todayNow.getMonth()];
        parsed.businessProfile.selectedDateIso = todayIso;
        parsed.businessProfile.selectedDateFormatted = `${String(todayNow.getDate()).padStart(2, '0')} ${mShort} ${todayNow.getFullYear()}`;
        parsed.businessProfile.currentDateLabel = `${wk3}, ${todayNow.getDate()} ${mShort} ${todayNow.getFullYear()}`;
        parsed.businessProfile.currentMonthLabel = `${mFull} ${todayNow.getFullYear()}`;
        parsed.businessProfile.calendarDateFilterActive = false;
        return parsed;
      }
    }
  } catch (err) {
    // Fallback to in-memory state if localStorage is restricted
  }
  const fresh = cloneDeep(INITIAL_DATA);
  fresh.customers.forEach(normalizeCustomer);
  return fresh;
}

function savePersistedData(data) {
  try {
    const sanitized = cloneDeep(data);
    if (Array.isArray(sanitized.staff)) {
      sanitized.staff.forEach((s) => {
        // Step 5 Rule 5 & 6: Never store plaintext passwords in localStorage or database records
        delete s.password;
      });
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sanitized));
  } catch (err) {
    // Ignore storage quota or sandbox restrictions
  }
}

function isServiceRoleKey(keyStr) {
  try {
    const parts = String(keyStr || '').split('.');
    if (parts.length === 3) {
      const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
      return payload && payload.role === 'service_role';
    }
  } catch (e) {
    // Non-JWT publishable key format (e.g., sb_publishable_...)
  }
  return String(keyStr || '').startsWith('sb_secret_');
}

function getOrInitSupabaseClient() {
  if (supabaseClient) return supabaseClient;
  if (typeof window === 'undefined' || !window.supabase || typeof window.supabase.createClient !== 'function') {
